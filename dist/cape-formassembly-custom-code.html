/* CAPE prefill modal               */
/* -------------------------------- */

#hiddenButton,
.invisible {
  position: absolute !important;
  top: -10000px !important;
  left: -10000px !important;
  width: 1px !important;
  height: 1px !important;
  overflow: hidden !important;
}

.no-scroll {
  overflow: hidden;
}

/* Overlay */
.simple-modal-overlay,
.simple-animated-modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 666;
  background: #fff;
  opacity: 0.8;
  cursor: pointer;
}

.simple-modal-overlay[data-background-click="disabled"],
.simple-animated-modal-overlay[data-background-click="disabled"] {
  cursor: default;
}

/* The actual dialog */
dialog.simple-modal,
dialog.simple-animated-modal {
  box-sizing: border-box;
  position: fixed;
  top: 5vh;
  left: 50%;
  right: auto;
  transform: translateX(-50%);

  display: block;
  width: min(90%, 700px);
  height: auto;
  min-height: 0;
  max-height: 90vh;

  margin: 0;
  padding: 2rem;

  overflow-x: hidden;
  overflow-y: auto;

  border: 2px solid #fc9802;
  background: #f4f2c8;
  z-index: 667;

  font-family: "Open Sans", sans-serif;
}

/* Van11y wrappers */
.simple-modal__wrapper,
.simple-animated-modal__wrapper,
.simple-modal__content,
.simple-animated-modal__content {
  box-sizing: border-box;
  width: 100%;
  height: auto !important;
  min-height: 0 !important;
  max-height: none !important;

  margin: 0 !important;
  padding: 0 !important;

  border: 0 !important;
  outline: 0 !important;
  background: transparent !important;
}

.simple-modal__content,
.simple-animated-modal__content {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;

  text-align: center;

  width: 100%;
  margin: 0 !important;
  padding: 0 !important;

  font-size: 1.5em !important;
  line-height: 1.25;
  text-align: center;
}

      vi: `<p>L\u01B0u \xFD: M\u1EABu n\xE0y CH\u1EC8 d\xE0nh cho ng\u01B0\u1EDDi lao \u0111\u1ED9ng t\u1EA1i <strong>\${employerValueCalc}</strong>. N\u1EBFu qu\xFD v\u1ECB l\xE0m vi\u1EC7c \u1EDF n\u01A1i kh\xE1c v\xE0 mu\u1ED1n \u0111\xF3ng g\xF3p cho CAPE, <strong><a href="https://seiu503signup.org?cape=true">qu\xFD v\u1ECB c\xF3 th\u1EC3 th\u1EF1c hi\u1EC7n t\u1EA1i \u0111\xE2y.</a></strong></p>`,
      zh: `<p>\u6CE8\u610F\uFF1A\u6B64\u8868\u683C\u4EC5\u9002\u7528\u4E8E <strong>\${employerValueCalc}</strong> \u7684\u5DE5\u4F5C\u4EBA\u5458\u3002\u5982\u679C\u60A8\u5728\u5176\u4ED6\u5730\u65B9\u5DE5\u4F5C\u5E76\u5E0C\u671B\u5411 CAPE \u6350\u6B3E\uFF0C<strong><a href="https://seiu503signup.org?cape=true">\u53EF\u4EE5\u5728\u8FD9\u91CC\u8FDB\u884C\u3002</a></strong></p>`,
      ar: `<p>\u0645\u0644\u0627\u062D\u0638\u0629: \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C \u0645\u062E\u0635\u0635 \u0641\u0642\u0637 \u0644\u0644\u0639\u0627\u0645\u0644\u064A\u0646 \u0641\u064A <strong>\${employerValueCalc}</strong>. \u0625\u0630\u0627 \u0643\u0646\u062A \u062A\u0639\u0645\u0644 \u0641\u064A \u0645\u0643\u0627\u0646 \u0622\u062E\u0631 \u0648\u062A\u0631\u063A\u0628 \u0641\u064A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A CAPE\u060C <strong><a href="https://seiu503signup.org?cape=true">\u064A\u0645\u0643\u0646\u0643 \u0627\u0644\u0642\u064A\u0627\u0645 \u0628\u0630\u0644\u0643 \u0647\u0646\u0627.</a></strong></p>`,
      so: `<p>Fiiro gaar ah: Foomkan waxaa loogu talagalay KELIYA shaqaalaha <strong>\${employerValueCalc}</strong>. Haddii aad meel kale ka shaqeyso oo aad rabto inaad CAPE ku tabarucdo, <strong><a href="https://seiu503signup.org?cape=true">halkan ayaad ka samayn kartaa.</a></strong></p>`

    emailNote: {
      selector: '[data-cape-translate="emailNote"]',
      mode: "html",
      legacyVar: "emailNote",
      en: `Please use your personal email if you have one, since some employers limit union communication via work email. If you don't have a personal email, work email is fine. If you don't have an email address, call us at 1.844.503.7348 to sign up over the phone.`,
      es: `Use su correo electr\xF3nico particular, si tiene uno, ya que algunos empleadores limitan la comunicaci\xF3n de la uni\xF3n a trav\xE9s del correo electr\xF3nico del trabajo. Si no tiene un correo electr\xF3nico personal, puede usar el correo electr\xF3nico del trabajo. Si no tiene una direcci\xF3n de correo electr\xF3nico, ll\xE1menos al 1.844.503.7348 para registrarse por tel\xE9fono.`,
      ru: `\u041F\u043E\u0436\u0430\u043B\u0443\u0439\u0441\u0442\u0430, \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0439\u0442\u0435 \u043B\u0438\u0447\u043D\u0443\u044E \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u0443\u044E \u043F\u043E\u0447\u0442\u0443, \u0435\u0441\u043B\u0438 \u043E\u043D\u0430 \u0443 \u0432\u0430\u0441 \u0435\u0441\u0442\u044C, \u043F\u043E\u0441\u043A\u043E\u043B\u044C\u043A\u0443 \u043D\u0435\u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u0438 \u043E\u0433\u0440\u0430\u043D\u0438\u0447\u0438\u0432\u0430\u044E\u0442 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u043D\u044B\u0435 \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u044F \u0447\u0435\u0440\u0435\u0437 \u0440\u0430\u0431\u043E\u0447\u0443\u044E \u043F\u043E\u0447\u0442\u0443. \u0415\u0441\u043B\u0438 \u043B\u0438\u0447\u043D\u043E\u0439 \u043F\u043E\u0447\u0442\u044B \u043D\u0435\u0442, \u043C\u043E\u0436\u043D\u043E \u0443\u043A\u0430\u0437\u0430\u0442\u044C \u0440\u0430\u0431\u043E\u0447\u0443\u044E. \u0415\u0441\u043B\u0438 \u0443 \u0432\u0430\u0441 \u043D\u0435\u0442 \u044D\u043B\u0435\u043A\u0442\u0440\u043E\u043D\u043D\u043E\u0439 \u043F\u043E\u0447\u0442\u044B, \u043F\u043E\u0437\u0432\u043E\u043D\u0438\u0442\u0435 \u043D\u0430\u043C \u043F\u043E \u043D\u043E\u043C\u0435\u0440\u0443 1.844.503.7348, \u0447\u0442\u043E\u0431\u044B \u0437\u0430\u0440\u0435\u0433\u0438\u0441\u0442\u0440\u0438\u0440\u043E\u0432\u0430\u0442\u044C\u0441\u044F \u043F\u043E \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0443.`,
      vi: `Vui l\xF2ng s\u1EED d\u1EE5ng email c\xE1 nh\xE2n n\u1EBFu qu\xFD v\u1ECB c\xF3, v\xEC m\u1ED9t s\u1ED1 ch\u1EE7 lao \u0111\u1ED9ng h\u1EA1n ch\u1EBF th\xF4ng tin c\xF4ng \u0111o\xE0n qua email c\xF4ng vi\u1EC7c. N\u1EBFu qu\xFD v\u1ECB kh\xF4ng c\xF3 email c\xE1 nh\xE2n, c\xF3 th\u1EC3 d\xF9ng email c\xF4ng vi\u1EC7c. N\u1EBFu kh\xF4ng c\xF3 \u0111\u1ECBa ch\u1EC9 email, h\xE3y g\u1ECDi cho ch\xFAng t\xF4i theo s\u1ED1 1.844.503.7348 \u0111\u1EC3 \u0111\u0103ng k\xFD qua \u0111i\u1EC7n tho\u1EA1i.`,
      zh: "\u5982\u679C\u60A8\u6709\u4E2A\u4EBA\u7535\u5B50\u90AE\u7BB1\uFF0C\u8BF7\u4F7F\u7528\u4E2A\u4EBA\u90AE\u7BB1\uFF0C\u56E0\u4E3A\u4E00\u4E9B\u96C7\u4E3B\u4F1A\u9650\u5236\u901A\u8FC7\u5DE5\u4F5C\u90AE\u7BB1\u8FDB\u884C\u5DE5\u4F1A\u6C9F\u901A\u3002\u5982\u679C\u6CA1\u6709\u4E2A\u4EBA\u90AE\u7BB1\uFF0C\u4E5F\u53EF\u4EE5\u4F7F\u7528\u5DE5\u4F5C\u90AE\u7BB1\u3002\u5982\u679C\u60A8\u6CA1\u6709\u7535\u5B50\u90AE\u7BB1\u5730\u5740\uFF0C\u8BF7\u81F4\u7535 1.844.503.7348 \u901A\u8FC7\u7535\u8BDD\u62A5\u540D\u3002",
      ar: `\u064A\u0631\u062C\u0649 \u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0628\u0631\u064A\u062F\u0643 \u0627\u0644\u0625\u0644\u0643\u062A\u0631\u0648\u0646\u064A \u0627\u0644\u0634\u062E\u0635\u064A \u0625\u0646 \u0648\u062C\u062F\u060C \u0644\u0623\u0646 \u0628\u0639\u0636 \u0623\u0635\u062D\u0627\u0628 \u0627\u0644\u0639\u0645\u0644 \u064A\u062D\u062F\u0648\u0646 \u0645\u0646 \u062A\u0648\u0627\u0635\u0644 \u0627\u0644\u0646\u0642\u0627\u0628\u0629 \u0639\u0628\u0631 \u0628\u0631\u064A\u062F \u0627\u0644\u0639\u0645\u0644. \u0625\u0630\u0627 \u0644\u0645 \u064A\u0643\u0646 \u0644\u062F\u064A\u0643 \u0628\u0631\u064A\u062F \u0634\u062E\u0635\u064A\u060C \u0641\u0644\u0627 \u0628\u0623\u0633 \u0628\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0628\u0631\u064A\u062F \u0627\u0644\u0639\u0645\u0644. \u0625\u0630\u0627 \u0644\u0645 \u064A\u0643\u0646 \u0644\u062F\u064A\u0643 \u0639\u0646\u0648\u0627\u0646 \u0628\u0631\u064A\u062F \u0625\u0644\u0643\u062A\u0631\u0648\u0646\u064A\u060C \u0641\u0627\u062A\u0635\u0644 \u0628\u0646\u0627 \u0639\u0644\u0649 1.844.503.7348 \u0644\u0644\u062A\u0633\u062C\u064A\u0644 \u0639\u0628\u0631 \u0627\u0644\u0647\u0627\u062A\u0641.`,
      so: `Fadlan isticmaal iimaylkaaga gaarka ah haddii aad leedahay, maadaama qaar ka mid ah loo-shaqeeyayaashu xaddidaan isgaarsiinta ururka ee iimaylka shaqada. Haddii aadan lahayn iimayl gaar ah, iimaylka shaqadu waa hagaag. Haddii aadan lahayn cinwaan iimayl, naga soo wac 1.844.503.7348 si aad telefoon uga diiwaangeliso.`

    phoneNote: {
      selector: '[data-cape-translate="phoneNote"]',
      mode: "html",
      legacyVar: "phoneNote",
      en: `\u2020 By providing my phone number, I understand that the Service Employees International Union (SEIU), its local unions, and affiliates may use automated calling technologies and/or text message me on my cellular phone on a periodic basis. SEIU will never charge for text message alerts. Carrier message and data rates may apply to such alerts. Reply STOP to stop receiving messages; reply HELP for more information.`,
      es: `\u2020 Al proporcionar mi n\xFAmero de tel\xE9fono, entiendo que la Uni\xF3n Internacional de Empleados de Servicios (SEIU, por sus siglas en ingl\xE9s), sus uniones locales y sus afiliados pueden usar tecnolog\xEDas automatizadas para llamarme y/o para enviar mensajes de texto a mi celular peri\xF3dicamente. SEIU nunca cobrar\xE1 por las alertas de mensaje de texto. Pueden aplicar tarifas por el env\xEDo de mensaje y el uso de datos para dichas alertas. Responda con la palabra STOP para dejar de recibir mensajes; responda con la palabra HELP para obtener m\xE1s informaci\xF3n.`,
      ru: `\u2020 \u041F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u043B\u044F\u044F \u0441\u0432\u043E\u0439 \u043D\u043E\u043C\u0435\u0440 \u0442\u0435\u043B\u0435\u0444\u043E\u043D\u0430, \u044F \u043F\u043E\u043D\u0438\u043C\u0430\u044E, \u0447\u0442\u043E \u041C\u0435\u0436\u0434\u0443\u043D\u0430\u0440\u043E\u0434\u043D\u044B\u0439 \u0441\u043E\u044E\u0437 \u0440\u0430\u0431\u043E\u0442\u043D\u0438\u043A\u043E\u0432 \u0441\u0444\u0435\u0440\u044B \u043E\u0431\u0441\u043B\u0443\u0436\u0438\u0432\u0430\u043D\u0438\u044F (SEIU), \u0435\u0433\u043E \u043C\u0435\u0441\u0442\u043D\u044B\u0435 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u044B \u0438 \u0430\u0444\u0444\u0438\u043B\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0446\u0438\u0438 \u043C\u043E\u0433\u0443\u0442 \u043F\u0435\u0440\u0438\u043E\u0434\u0438\u0447\u0435\u0441\u043A\u0438 \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u0430\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0437\u0438\u0440\u043E\u0432\u0430\u043D\u043D\u044B\u0435 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0438 \u0437\u0432\u043E\u043D\u043A\u043E\u0432 \u0438/\u0438\u043B\u0438 \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u0442\u044C \u0442\u0435\u043A\u0441\u0442\u043E\u0432\u044B\u0435 \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u044F \u043D\u0430 \u043C\u043E\u0439 \u043C\u043E\u0431\u0438\u043B\u044C\u043D\u044B\u0439 \u0442\u0435\u043B\u0435\u0444\u043E\u043D. SEIU \u043D\u0438\u043A\u043E\u0433\u0434\u0430 \u043D\u0435 \u0432\u0437\u0438\u043C\u0430\u0435\u0442 \u043F\u043B\u0430\u0442\u0443 \u0437\u0430 \u0442\u0435\u043A\u0441\u0442\u043E\u0432\u044B\u0435 \u043E\u043F\u043E\u0432\u0435\u0449\u0435\u043D\u0438\u044F. \u041C\u043E\u0433\u0443\u0442 \u043F\u0440\u0438\u043C\u0435\u043D\u044F\u0442\u044C\u0441\u044F \u0442\u0430\u0440\u0438\u0444\u044B \u043E\u043F\u0435\u0440\u0430\u0442\u043E\u0440\u0430 \u0437\u0430 \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u044F \u0438 \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0443 \u0434\u0430\u043D\u043D\u044B\u0445. \u041E\u0442\u0432\u0435\u0442\u044C\u0442\u0435 STOP, \u0447\u0442\u043E\u0431\u044B \u043F\u0440\u0435\u043A\u0440\u0430\u0442\u0438\u0442\u044C \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u0435 \u0441\u043E\u043E\u0431\u0449\u0435\u043D\u0438\u0439; \u043E\u0442\u0432\u0435\u0442\u044C\u0442\u0435 HELP \u0434\u043B\u044F \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u044F \u0434\u043E\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u043E\u0439 \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u0438.`,
      vi: `\u2020 Khi cung c\u1EA5p s\u1ED1 \u0111i\u1EC7n tho\u1EA1i c\u1EE7a m\xECnh, t\xF4i hi\u1EC3u r\u1EB1ng Service Employees International Union (SEIU), c\xE1c c\xF4ng \u0111o\xE0n \u0111\u1ECBa ph\u01B0\u01A1ng v\xE0 \u0111\u01A1n v\u1ECB li\xEAn k\u1EBFt c\xF3 th\u1EC3 s\u1EED d\u1EE5ng c\xF4ng ngh\u1EC7 g\u1ECDi t\u1EF1 \u0111\u1ED9ng v\xE0/ho\u1EB7c nh\u1EAFn tin \u0111\u1ECBnh k\u1EF3 t\u1EDBi \u0111i\u1EC7n tho\u1EA1i di \u0111\u1ED9ng c\u1EE7a t\xF4i. SEIU s\u1EBD kh\xF4ng bao gi\u1EDD thu ph\xED c\u1EA3nh b\xE1o b\u1EB1ng tin nh\u1EAFn. C\xF3 th\u1EC3 \xE1p d\u1EE5ng ph\xED tin nh\u1EAFn v\xE0 d\u1EEF li\u1EC7u c\u1EE7a nh\xE0 m\u1EA1ng. Tr\u1EA3 l\u1EDDi STOP \u0111\u1EC3 ng\u1EEBng nh\u1EADn tin nh\u1EAFn; tr\u1EA3 l\u1EDDi HELP \u0111\u1EC3 bi\u1EBFt th\xEAm th\xF4ng tin.`,
      zh: `\u2020 \u63D0\u4F9B\u7535\u8BDD\u53F7\u7801\u5373\u8868\u793A\u6211\u7406\u89E3 Service Employees International Union (SEIU)\u3001\u5176\u5730\u65B9\u5DE5\u4F1A\u548C\u9644\u5C5E\u673A\u6784\u53EF\u80FD\u4F1A\u5B9A\u671F\u4F7F\u7528\u81EA\u52A8\u62E8\u53F7\u6280\u672F\u548C/\u6216\u5411\u6211\u7684\u624B\u673A\u53D1\u9001\u77ED\u4FE1\u3002SEIU \u7EDD\u4E0D\u4F1A\u6536\u53D6\u77ED\u4FE1\u63D0\u9192\u8D39\u7528\u3002\u8FD0\u8425\u5546\u53EF\u80FD\u4F1A\u6536\u53D6\u77ED\u4FE1\u548C\u6570\u636E\u8D39\u7528\u3002\u56DE\u590D STOP \u53EF\u505C\u6B62\u63A5\u6536\u6D88\u606F\uFF1B\u56DE\u590D HELP \u53EF\u83B7\u53D6\u66F4\u591A\u4FE1\u606F\u3002`,
      ar: `\u2020 \u0628\u062A\u0642\u062F\u064A\u0645 \u0631\u0642\u0645 \u0647\u0627\u062A\u0641\u064A\u060C \u0623\u0641\u0647\u0645 \u0623\u0646 Service Employees International Union (SEIU) \u0648\u0646\u0642\u0627\u0628\u0627\u062A\u0647\u0627 \u0627\u0644\u0645\u062D\u0644\u064A\u0629 \u0648\u0627\u0644\u0634\u0631\u0643\u0627\u062A \u0627\u0644\u062A\u0627\u0628\u0639\u0629 \u0644\u0647\u0627 \u0642\u062F \u062A\u0633\u062A\u062E\u062F\u0645 \u062A\u0642\u0646\u064A\u0627\u062A \u0627\u0644\u0627\u062A\u0635\u0627\u0644 \u0627\u0644\u0622\u0644\u064A \u0648/\u0623\u0648 \u062A\u0631\u0633\u0644 \u0644\u064A \u0631\u0633\u0627\u0626\u0644 \u0646\u0635\u064A\u0629 \u0639\u0644\u0649 \u0647\u0627\u062A\u0641\u064A \u0627\u0644\u0645\u062D\u0645\u0648\u0644 \u0628\u0634\u0643\u0644 \u062F\u0648\u0631\u064A. \u0644\u0646 \u062A\u0641\u0631\u0636 SEIU \u0623\u064A \u0631\u0633\u0648\u0645 \u0639\u0644\u0649 \u062A\u0646\u0628\u064A\u0647\u0627\u062A \u0627\u0644\u0631\u0633\u0627\u0626\u0644 \u0627\u0644\u0646\u0635\u064A\u0629. \u0642\u062F \u062A\u0637\u0628\u0642 \u0631\u0633\u0648\u0645 \u0627\u0644\u0631\u0633\u0627\u0626\u0644 \u0648\u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A \u0645\u0646 \u0634\u0631\u0643\u0629 \u0627\u0644\u0627\u062A\u0635\u0627\u0644\u0627\u062A. \u0623\u0631\u0633\u0644 STOP \u0644\u0625\u064A\u0642\u0627\u0641 \u0627\u0644\u0631\u0633\u0627\u0626\u0644\u061B \u0648\u0623\u0631\u0633\u0644 HELP \u0644\u0645\u0632\u064A\u062F \u0645\u0646 \u0627\u0644\u0645\u0639\u0644\u0648\u0645\u0627\u062A.`,
      so: `\u2020 Markaan bixiyo lambarkayga telefoonka, waxaan fahamsanahay in Service Employees International Union (SEIU), ururradeeda maxalliga ah, iyo la-hawlgalayaasheedu ay adeegsan karaan tiknoolajiyada wicitaanka otomaatigga ah iyo/ama ay fariimo qoraal ah iigu soo diri karaan telefoonka gacanta mararka qaarkood. SEIU waligeed lacag kama qaadi doonto digniinaha fariimaha qoraalka ah. Kharashyada fariimaha iyo xogta ee shirkadda adeegga ayaa dhici kara. Ku jawaab STOP si aad u joojiso helista farriimaha; ku jawaab HELP si aad u hesho macluumaad dheeraad ah.`
    },

    CAPEIntro: {
      selector: '[data-cape-translate="CAPEIntro"]',
      mode: "html",
      legacyVar: "CAPEIntro",
      en: `<h3>Contribute to CAPE: Citizen Action for Political Education</h3><p><em>Collective political action to raise wages, protect benefits, fund public services, and build strong communities.</em></p><p>This contribution qualifies for the Oregon Political Tax Credit. Single filers are eligible for a credit up to $50/year; joint filers up to $100 per year.</p>`,
      es: `<h3>Aporte al CAPE: acci\xF3n ciudadana en favor de la educaci\xF3n pol\xEDtica</h3><p><em>Acci\xF3n pol\xEDtica colectiva que busca aumentar los salarios, proteger los beneficios, financiar los servicios p\xFAblicos y fortalecer las comunidades.</em></p><p>Este aporte cumple con los requisitos del cr\xE9dito fiscal de Oreg\xF3n. Los(as) declarantes solteros(as) son elegibles para recibir un cr\xE9dito anual de hasta $50; mientras que los(as) declarantes conjuntos(as) pueden recibir hasta $100 anuales.</p>`,
      ru: `<h3>\u0423\u0447\u0430\u0441\u0442\u0438\u0435 \u0432 CAPE \u2014 \u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0441\u043A\u043E\u043C \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0438 \u0437\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043F\u0440\u043E\u0441\u0432\u0435\u0449\u0435\u043D\u0438\u0435</h3><p><em>\u0421\u043E\u0432\u043C\u0435\u0441\u0442\u043D\u0430\u044F \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u0438\u043D\u0438\u0446\u0438\u0430\u0442\u0438\u0432\u0430 \u0432 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0443 \u043F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u044F \u0437\u0430\u0440\u043F\u043B\u0430\u0442, \u0443\u0432\u0435\u043B\u0438\u0447\u0435\u043D\u0438\u044F \u043B\u044C\u0433\u043E\u0442, \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u044F \u0433\u043E\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u0434\u043E\u0442\u0430\u0446\u0438\u0439 \u0438 \u0441\u043E\u0437\u0434\u0430\u043D\u0438\u044F \u0441\u043F\u043B\u043E\u0447\u0435\u043D\u043D\u044B\u0445 \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432.</em></p><p>\u0414\u0430\u043D\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441 \u043F\u043E\u043F\u0430\u0434\u0430\u0435\u0442 \u043F\u043E\u0434 \u043D\u0430\u043B\u043E\u0433\u043E\u0432\u0443\u044E \u043B\u044C\u0433\u043E\u0442\u0443 \u0448\u0442\u0430\u0442\u0430 \u041E\u0440\u0435\u0433\u043E\u043D \u0437\u0430 \u0432\u0437\u043D\u043E\u0441\u044B \u043D\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0446\u0435\u043B\u0438. \u041F\u0440\u0438 \u0435\u0434\u0438\u043D\u043E\u043B\u0438\u0447\u043D\u043E\u0439 \u043F\u043E\u0434\u0430\u0447\u0435 \u0437\u0430\u044F\u0432\u043B\u0435\u043D\u0438\u044F \u0440\u0430\u0437\u043C\u0435\u0440 \u043B\u044C\u0433\u043E\u0442\u044B \u043C\u043E\u0436\u0435\u0442 \u0434\u043E\u0441\u0442\u0438\u0433\u0430\u0442\u044C $50 \u0432 \u0433\u043E\u0434, \u043F\u0440\u0438 \u0441\u043E\u0432\u043C\u0435\u0441\u0442\u043D\u043E\u0439 \u043F\u043E\u0434\u0430\u0447\u0435 \u2014 $100 \u0432 \u0433\u043E\u0434.</p>`,
      vi: `<h3>\u0110\xF3ng g\xF3p v\xE0o CAPE: H\xE0nh \u0111\u1ED9ng c\u1EE7a c\xF4ng d\xE2n cho gi\xE1o d\u1EE5c ch\xEDnh tr\u1ECB</h3><p><em>H\xE0nh \u0111\u1ED9ng ch\xEDnh tr\u1ECB t\u1EADp th\u1EC3 nh\u1EB1m t\u0103ng l\u01B0\u01A1ng, b\u1EA3o v\u1EC7 quy\u1EC1n l\u1EE3i, t\xE0i tr\u1EE3 cho c\xE1c d\u1ECBch v\u1EE5 c\xF4ng c\u1ED9ng v\xE0 x\xE2y d\u1EF1ng c\xE1c c\u1ED9ng \u0111\u1ED3ng v\u1EEFng m\u1EA1nh.</em></p><p>Kho\u1EA3n \u0111\xF3ng g\xF3p n\xE0y \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c Gi\u1EA3m Thu\u1EBF Thu Nh\u1EADp Cho M\u1EE5c \u0110\xEDch Ch\xEDnh Tr\u1ECB C\u1EE7a Oregon. Ng\u01B0\u1EDDi g\u1EEDi h\u1ED3 s\u01A1 ri\xEAng l\u1EBB s\u1EBD \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c gi\u1EA3m t\u1ED1i \u0111a $50/n\u0103m; c\xE1c tr\u01B0\u1EDDng h\u1EE3p g\u1EEDi h\u1ED3 s\u01A1 t\u1EADp th\u1EC3 s\u1EBD \u0111\u01B0\u1EE3c gi\u1EA3m t\u1ED1i \u0111a $100/n\u0103m.</p>`,
      zh: `<h3>\u6350\u52A9 CAPE\uFF1A\u516C\u6C11\u653F\u6CBB\u6559\u80B2\u884C\u52A8</h3><p><em>\u96C6\u4F53\u653F\u6CBB\u884C\u52A8\u65E8\u5728\u63D0\u9AD8\u5DE5\u8D44\u3001\u4FDD\u62A4\u798F\u5229\u3001\u8D44\u52A9\u516C\u5171\u670D\u52A1\uFF0C\u4EE5\u53CA\u5EFA\u8BBE\u5F3A\u5927\u7684\u793E\u533A\u3002</em></p><p>\u8FD9\u7B14\u6350\u6B3E\u6709\u8D44\u683C\u83B7\u5F97\u4FC4\u52D2\u5188\u5DDE\u653F\u6CBB\u7A0E\u6536\u62B5\u514D\u3002\u5355\u72EC\u7533\u8BF7\u8005\u6709\u8D44\u683C\u83B7\u5F97\u6BCF\u5E74\u6700\u9AD8 50 \u7F8E\u5143\u7684\u62B5\u514D\u989D\uFF1B\u8054\u5408\u7533\u8BF7\u8005\u6BCF\u5E74\u6700\u9AD8 100 \u7F8E\u5143\u3002</p>`,
      ar: `<h3>\u0633\u0627\u0647\u0645 \u0641\u064A CAPE: \u0627\u0644\u0639\u0645\u0644 \u0627\u0644\u0645\u062F\u0646\u064A \u0645\u0646 \u0623\u062C\u0644 \u0627\u0644\u062A\u062B\u0642\u064A\u0641 \u0627\u0644\u0633\u064A\u0627\u0633\u064A</h3><p><em>\u0639\u0645\u0644 \u0633\u064A\u0627\u0633\u064A \u062C\u0645\u0627\u0639\u064A \u0644\u0631\u0641\u0639 \u0627\u0644\u0623\u062C\u0648\u0631\u060C \u0648\u062D\u0645\u0627\u064A\u0629 \u0627\u0644\u0645\u0632\u0627\u064A\u0627\u060C \u0648\u062A\u0645\u0648\u064A\u0644 \u0627\u0644\u062E\u062F\u0645\u0627\u062A \u0627\u0644\u0639\u0627\u0645\u0629\u060C \u0648\u0628\u0646\u0627\u0621 \u0645\u062C\u062A\u0645\u0639\u0627\u062A \u0642\u0648\u064A\u0629.</em></p><p>\u062A\u0624\u0647\u0644 \u0647\u0630\u0647 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0644\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0627\u0644\u0627\u0626\u062A\u0645\u0627\u0646 \u0627\u0644\u0636\u0631\u064A\u0628\u064A \u0627\u0644\u0633\u064A\u0627\u0633\u064A \u0641\u064A \u0623\u0648\u0631\u064A\u063A\u0648\u0646. \u064A\u062D\u0642 \u0644\u0644\u0645\u0642\u062F\u0651\u0645\u064A\u0646 \u0627\u0644\u0623\u0641\u0631\u0627\u062F \u0627\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0627\u0626\u062A\u0645\u0627\u0646 \u064A\u0635\u0644 \u0625\u0644\u0649 50 \u062F\u0648\u0644\u0627\u0631\u064B\u0627 \u0633\u0646\u0648\u064A\u064B\u0627\u061B \u0648\u064A\u062D\u0642 \u0644\u0644\u0645\u0642\u062F\u0651\u0645\u064A\u0646 \u0627\u0644\u0645\u0634\u062A\u0631\u0643\u064A\u0646 \u0627\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0645\u0627 \u064A\u0635\u0644 \u0625\u0644\u0649 100 \u062F\u0648\u0644\u0627\u0631 \u0633\u0646\u0648\u064A\u064B\u0627.</p>`,
      so: `<h3>Ku tabaruc CAPE: Ficilka Muwaadiniinta ee Waxbarashada Siyaasadda</h3><p><em>Ficil siyaasadeed oo wadajir ah si loo kordhiyo mushaharka, loo ilaaliyo dheefaha, loo maalgeliyo adeegyada dadweynaha, loona dhiso bulshooyin xooggan.</em></p><p>Tabarucan wuxuu u qalmaa Oregon Political Tax Credit. Dadka kaligood fayl gareeya waxay xaq u leeyihiin credit ilaa $50 sanadkii; kuwa wadajir u fayl gareeya ilaa $100 sanadkii.</p>`
    },
    CAPEAuthTitle: {

      mode: "html",

      ru: "\u0420\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u043D\u0430 \u0432\u0437\u043D\u043E\u0441 \u0432 CAPE",
      vi: "\u1EE6y quy\u1EC1n \u0111\xF3ng g\xF3p CAPE",
      zh: "CAPE \u6350\u6B3E\u6388\u6743",
      ar: "\u062A\u0641\u0648\u064A\u0636 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A CAPE",

    CAPEAuthLL1: {
      selector: '[data-cape-translate="CAPEAuthLL1"]',
      mode: "html",
      legacyVar: "CAPEAuthLL1",
      en: `By submitting this form, I hereby authorize my Employer to deduct the designated amount from my monthly earnings as a contribution to SEIU Local 503, OPEU CAPE.`,
      es: `Por medio del presente, y tras haber enviado este formulario, autorizo a mi Empleador a deducir de mis ganancias mensuales el monto designado como aporte al CAPE de SEIU Local 503, OPEU.`,
      ru: `\u041E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u044F \u044D\u0442\u0443 \u0444\u043E\u0440\u043C\u0443, \u044F \u0443\u043F\u043E\u043B\u043D\u043E\u043C\u043E\u0447\u0438\u0432\u0430\u044E \u0441\u0432\u043E\u0435\u0433\u043E \u0420\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044F \u0432\u044B\u0447\u0438\u0442\u0430\u0442\u044C \u0443\u043A\u0430\u0437\u0430\u043D\u043D\u0443\u044E \u0441\u0443\u043C\u043C\u0443 \u0438\u0437 \u043C\u043E\u0435\u0439 \u0435\u0436\u0435\u043C\u0435\u0441\u044F\u0447\u043D\u043E\u0439 \u0437\u0430\u0440\u0430\u0431\u043E\u0442\u043D\u043E\u0439 \u043F\u043B\u0430\u0442\u044B \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0432\u0437\u043D\u043E\u0441\u0430 \u0432 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437 SEIU Local 503, OPEU CAPE.`,
      vi: `B\u1EB1ng vi\u1EC7c g\u1EEDi bi\u1EC3u m\u1EABu n\xE0y, t\xF4i \u1EE7y quy\u1EC1n cho Ch\u1EE7 s\u1EED d\u1EE5ng lao \u0111\u1ED9ng c\u1EE7a m\xECnh chi\u1EBFt kh\u1EA5u m\u1ED9t kho\u1EA3n ch\u1EC9 \u0111\u1ECBnh t\u1EEB ti\u1EC1n l\u01B0\u01A1ng h\xE0ng th\xE1ng c\u1EE7a t\xF4i \u0111\u1EC3 l\xE0m kho\u1EA3n \u0111\xF3ng g\xF3p cho CAPE SEIU Local 503, OPEU.`,
      zh: "\u901A\u8FC7\u63D0\u4EA4\u6B64\u8868\u683C\uFF0C\u6211\u7279\u6B64\u6388\u6743\u6211\u7684\u96C7\u4E3B\u4ECE\u6211\u7684\u6708\u6536\u5165\u4E2D\u6263\u9664\u6307\u5B9A\u91D1\u989D\u4F5C\u4E3A\u672C\u4EBA\u5411 SEIU Local 503\uFF0COPEU CAPE \u7684\u6350\u6B3E\u3002",
      ar: `\u0628\u062A\u0642\u062F\u064A\u0645 \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C\u060C \u0623\u0641\u0648\u0651\u0636 \u0635\u0627\u062D\u0628 \u0639\u0645\u0644\u064A \u0628\u062E\u0635\u0645 \u0627\u0644\u0645\u0628\u0644\u063A \u0627\u0644\u0645\u062D\u062F\u062F \u0645\u0646 \u0623\u0631\u0628\u0627\u062D\u064A \u0627\u0644\u0634\u0647\u0631\u064A\u0629 \u0643\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A SEIU Local 503, OPEU CAPE.`,
      so: `Markaan gudbiyo foomkan, waxaan u fasaxayaa Loo-shaqeeyahayga inuu ka jaro dakhligayga bil kasta qadarka la cayimay, isagoo ah tabaruc loo dirayo SEIU Local 503, OPEU CAPE.`
    },
    CAPEAuthLL2: {
      selector: '[data-cape-translate="CAPEAuthLL2"]',
      mode: "html",
      legacyVar: "CAPEAuthLL2",
      en: `<div id="capeLL2"><p>This authorization is made voluntarily based on my specific understanding that:</p><ol><li>I am not required to sign this form or make voluntary contributions to SEIU CAPE as a condition of my employment or membership in the union;</li><li>I may refuse to contribute without reprisal;</li><li>Under law, only union members and executive / administrative staff who are U.S. Citizens or lawful permanent residents are eligible to contribute to CAPE;</li><li>The contribution amounts on this form are merely suggestions, and I may contribute more or less by this or other means without fear of favor or disadvantage from SEIU or my employer;</li><li>SEIU CAPE uses the money it receives for political purposes \u2013 including, but not limited to, making contributions to and expenditures on behalf of candidates for federal, state, and local offices \u2013 and addressing political issues of public importance.</li></ol><p>This authorization shall remain in effect until revoked by me in writing via U.S. mail to SEIU. Contributions or gifts to SEIU Local 503, OPEU CAPE are not tax deductible as charitable contributions.</p></div>`,
      es: `<div id="capeLL2"><p>Esta autorizaci\xF3n es voluntaria y se basa en mis conocimientos espec\xEDficos de que:</p><ol><li>No estoy en la obligaci\xF3n de firmar este formulario o realizar aportes voluntarios a la Acci\xF3n Ciudadana en Favor de la Educaci\xF3n Pol\xEDtica (por su sigla en ingl\xE9s CAPE) de SEIU, y no supone una condici\xF3n para mantener mi empleo o membres\xEDa en la uni\xF3n;</li><li>Puedo rechazar el aporte sin que esto suponga represalias;</li><li>De conformidad con la ley, solo los(as) miembros de la uni\xF3n y el personal administrativo/ejecutivo de la misma que sean ciudadanos(as) de los EE. UU. o residentes permanentes legales son elegibles para aportar a la CAPE;</li><li>Los montos de los aportes mencionados en este formulario solo son sugerencias, as\xED que puedo aportar m\xE1s o menos a trav\xE9s de este u otros medios sin temor a que suponga una ventaja o desventaja de parte de SEIU o mi empleador;</li><li>La CAPE de SEIU utiliza el dinero que recibe para fines pol\xEDticos, entre ellos, realizar aportes y cubrir los gastos de los(as) candidatos(as) a cargos federales, estatales y locales, as\xED como afrontar asuntos pol\xEDticos de car\xE1cter p\xFAblico</li></ol><p>Esta autorizaci\xF3n permanecer\xE1 vigente hasta que yo la revoque envi\xE1ndole un aviso a SEIU a trav\xE9s del correo postal de los EE. UU. Los aportes u obsequios a la CAPE de SEIU Local 503, OPEU no son deducibles de impuestos como aportes ben\xE9ficos.</p></div>`,
      ru: `<div id="capeLL2"><p>\u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0435 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u0434\u0430\u0435\u0442\u0441\u044F \u043D\u0430 \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u043D\u043E\u0439 \u043E\u0441\u043D\u043E\u0432\u0435 \u0441 \u0443\u0447\u0435\u0442\u043E\u043C \u043C\u043E\u0435\u0433\u043E \u043F\u043E\u043D\u0438\u043C\u0430\u043D\u0438\u044F, \u0447\u0442\u043E:</p><ol><li>\u042F \u043D\u0435 \u043E\u0431\u044F\u0437\u0430\u043D(-\u0430) \u043F\u043E\u0434\u043F\u0438\u0441\u044B\u0432\u0430\u0442\u044C \u044D\u0442\u0443 \u0444\u043E\u0440\u043C\u0443 \u0438\u043B\u0438 \u0434\u0435\u043B\u0430\u0442\u044C \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u043D\u044B\u0435 \u0432\u0437\u043D\u043E\u0441\u044B \u0432 SEIU CAPE \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0443\u0441\u043B\u043E\u0432\u0438\u044F \u043C\u043E\u0435\u0433\u043E \u0442\u0440\u0443\u0434\u043E\u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430 \u0438\u043B\u0438 \u0447\u043B\u0435\u043D\u0441\u0442\u0432\u0430 \u0432 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0435;</li><li>\u042F \u043C\u043E\u0433\u0443 \u043E\u0442\u043A\u0430\u0437\u0430\u0442\u044C\u0441\u044F \u043E\u0442 \u0432\u0437\u043D\u043E\u0441\u043E\u0432 \u0431\u0435\u0437 \u043E\u0442\u0432\u0435\u0442\u043D\u044B\u0445 \u043C\u0435\u0440;</li><li>\u041F\u043E \u0437\u0430\u043A\u043E\u043D\u0443 \u043F\u0440\u0430\u0432\u043E \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0432\u0437\u043D\u043E\u0441\u044B \u0432 CAPE \u0438\u043C\u0435\u044E\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0447\u043B\u0435\u043D\u044B \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430 \u0438 \u0438\u0441\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 / \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043D\u044B\u0439 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B, \u044F\u0432\u043B\u044F\u044E\u0449\u0438\u0435\u0441\u044F \u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0430\u043C\u0438 \u0421\u0428\u0410 \u0438\u043B\u0438 \u0437\u0430\u043A\u043E\u043D\u043D\u044B\u043C\u0438 \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u044B\u043C\u0438 \u0436\u0438\u0442\u0435\u043B\u044F\u043C\u0438 \u0421\u0428\u0410;</li><li>\u0421\u0443\u043C\u043C\u044B \u0432\u0437\u043D\u043E\u0441\u043E\u0432 \u0443\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0432 \u0434\u0430\u043D\u043D\u043E\u0439 \u0444\u043E\u0440\u043C\u0435 \u0442\u043E\u043B\u044C\u043A\u043E \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0430\u0446\u0438\u0439, \u0438 \u044F \u043C\u043E\u0433\u0443 \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0431\u043E\u043B\u044C\u0448\u0435 \u0438\u043B\u0438 \u043C\u0435\u043D\u044C\u0448\u0435 \u044D\u0442\u0438\u043C \u0438\u043B\u0438 \u0438\u043D\u044B\u043C \u0441\u043F\u043E\u0441\u043E\u0431\u043E\u043C, \u043D\u0435 \u043E\u043F\u0430\u0441\u0430\u044F\u0441\u044C, \u0447\u0442\u043E SEIU \u0438\u043B\u0438 \u043C\u043E\u0439 \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044C \u0431\u0443\u0434\u0443\u0442 \u043E\u0442\u043D\u043E\u0441\u0438\u0442\u044C\u0441\u044F \u043A\u043E \u043C\u043D\u0435 \u043F\u0440\u0435\u0434\u0432\u0437\u044F\u0442\u043E (\u0441\u043E\u0434\u0435\u0439\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C \u0438\u043B\u0438 \u043F\u0440\u0435\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u0442\u044C);</li><li>SEIU CAPE \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u043D\u044B\u0435 \u0434\u0435\u043D\u044C\u0433\u0438 \u043D\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0446\u0435\u043B\u0438, \u0432\u043A\u043B\u044E\u0447\u0430\u044F \u0432 \u0442\u043E\u043C \u0447\u0438\u0441\u043B\u0435 \u043D\u0430 \u0432\u0437\u043D\u043E\u0441\u044B \u0438 \u0432\u043B\u043E\u0436\u0435\u043D\u0438\u044F \u043E\u0442 \u0438\u043C\u0435\u043D\u0438 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u043E\u0432 \u0432 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438, \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438 \u0448\u0442\u0430\u0442\u0430 \u0438 \u043C\u0435\u0441\u0442\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438 \u2014 \u0438 \u043D\u0430 \u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u0432\u043E\u043F\u0440\u043E\u0441\u043E\u0432 \u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u0437\u043D\u0430\u0447\u0438\u043C\u043E\u0441\u0442\u0438.</li></ol><p>\u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0435 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u043E\u0441\u0442\u0430\u0435\u0442\u0441\u044F \u0432 \u0441\u0438\u043B\u0435, \u043F\u043E\u043A\u0430 \u044F \u043D\u0435 \u043E\u0442\u0437\u043E\u0432\u0443 \u0435\u0433\u043E \u0432 \u043F\u0438\u0441\u044C\u043C\u0435\u043D\u043D\u043E\u0439 \u0444\u043E\u0440\u043C\u0435 \u0432 \u043E\u0431\u0440\u0430\u0449\u0435\u043D\u0438\u0438 \u043A SEIU, \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043D\u043E\u043C \u043F\u043E \u041F\u043E\u0447\u0442\u0435 \u0421\u0428\u0410. \u0412\u0437\u043D\u043E\u0441\u044B \u0438 \u043F\u043E\u0434\u0430\u0440\u043A\u0438 \u0432 SEIU Local 503, OPEU CAPE \u043D\u0435 \u043F\u043E\u0434\u043B\u0435\u0436\u0430\u0442 \u043D\u0430\u043B\u043E\u0433\u043E\u043E\u0431\u043B\u043E\u0436\u0435\u043D\u0438\u044E \u043A\u0430\u043A \u0431\u043B\u0430\u0433\u043E\u0442\u0432\u043E\u0440\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u0432\u0437\u043D\u043E\u0441\u044B.</p></div>`,
      vi: `<div id="capeLL2"><p>T\xF4i ch\u1EA5p thu\u1EADn vi\u1EC7c n\xE0y tr\xEAn tinh th\u1EA7n t\u1EF1 nguy\u1EC7n d\u1EF1a tr\xEAn hi\u1EC3u bi\u1EBFt c\u1EE5 th\u1EC3 c\u1EE7a b\u1EA3n th\xE2n r\u1EB1ng:</p><ol><li>T\xF4i kh\xF4ng b\u1EAFt bu\u1ED9c ph\u1EA3i k\xFD v\xE0o m\u1EABu \u0111\u01A1n n\xE0y ho\u1EB7c kh\xF4ng b\u1ECB \xE9p bu\u1ED9c \u0111\xF3ng g\xF3p cho SEIU CAPE nh\u01B0 m\u1ED9t \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c tuy\u1EC3n d\u1EE5ng ho\u1EB7c gia nh\u1EADp li\xEAn \u0111o\xE0n;</li><li>T\xF4i c\xF3 th\u1EC3 t\u1EEB ch\u1ED1i \u0111\xF3ng g\xF3p m\xE0 kh\xF4ng s\u1EE3 b\u1ECB tr\u1EA3 \u0111\u0169a;</li><li>Theo lu\u1EADt, ch\u1EC9 c\xF3 th\xE0nh vi\xEAn li\xEAn \u0111o\xE0n v\xE0 \u0111\u1ED9i ng\u0169 \u0111i\u1EC1u h\xE0nh/qu\u1EA3n tr\u1ECB l\xE0 th\u01B0\u1EDDng tr\xFA nh\xE2n h\u1EE3p ph\xE1p ho\u1EB7c c\xF4ng d\xE2n Hoa K\u1EF3 m\u1EDBi \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\xF3ng g\xF3p v\xE0o CAPE.</li><li>S\u1ED1 ti\u1EC1n \u0111\xF3ng g\xF3p ghi tr\xEAn \u0111\u01A1n n\xE0y ch\u1EC9 l\xE0 m\u1EE9c \u0111\u1EC1 xu\u1EA5t, v\xE0 t\xF4i c\xF3 th\u1EC3 \u0111\xF3ng g\xF3p nhi\u1EC1u ho\u1EB7c \xEDt h\u01A1n hay b\u1EB1ng c\xE1c h\xECnh th\u1EE9c kh\xE1c m\xE0 kh\xF4ng ph\u1EA3i lo s\u1EE3 SEIU hay ch\u1EE7 lao \u0111\u1ED9ng c\u1EE7a t\xF4i s\u1EBD thi\xEAn v\u1ECB ho\u1EB7c g\xE2y b\u1EA5t l\u1EE3i;</li><li>SEIU CAPE s\u1EED d\u1EE5ng s\u1ED1 ti\u1EC1n nh\u1EADn \u0111\u01B0\u1EE3c cho m\u1EE5c \u0111\xEDch ch\xEDnh tr\u1ECB \u2013 bao g\u1ED3m nh\u01B0ng kh\xF4ng gi\u1EDBi h\u1EA1n \u1EDF c\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p v\xE0 chi ph\xED thay m\u1EB7t cho \u1EE9ng vi\xEAn tranh c\u1EED cho c\xE1c ch\u1EE9c v\u1EE5 c\u1EA5p li\xEAn bang, ti\u1EC3u bang v\xE0 \u0111\u1ECBa ph\u01B0\u01A1ng \u2013 \u0111\u1ED3ng th\u1EDDi gi\u1EA3i quy\u1EBFt nh\u1EEFng v\u1EA5n \u0111\u1EC1 ch\xEDnh tr\u1ECB c\xF3 t\u1EA7m quan tr\u1ECDng v\u1EDBi c\u1ED9ng \u0111\u1ED3ng.</li></ol><p>S\u1EF1 \u1EE7y quy\u1EC1n n\xE0y s\u1EBD gi\u1EEF nguy\xEAn hi\u1EC7u l\u1EF1c cho \u0111\u1EBFn khi t\xF4i r\xFAt l\u1EA1i b\u1EB1ng th\u01B0 vi\u1EBFt tay g\u1EEDi \u0111\u1EBFn SEIU qua d\u1ECBch v\u1EE5 b\u01B0u \u0111i\u1EC7n c\u1EE7a Hoa K\u1EF3. C\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p ho\u1EB7c qu\xE0 t\u1EB7ng g\u1EEDi \u0111\u1EBFn SEIU Local 503, OPEU CAPE s\u1EBD kh\xF4ng \u0111\u01B0\u1EE3c kh\u1EA5u tr\u1EEB thu\u1EBF nh\u01B0 c\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p t\u1EEB thi\u1EC7n.</p></div>`,
      zh: `<div id="capeLL2"><p>\u6211\u57FA\u4E8E\u4EE5\u4E0B\u5177\u4F53\u7406\u89E3\u81EA\u613F\u4F5C\u51FA\u672C\u6388\u6743\uFF1A</p><ol><li>\u6211\u65E0\u9700\u7B7E\u7F72\u6B64\u8868\u683C\u6216\u81EA\u613F\u5411 SEIU CAPE \u6350\u6B3E\u4EE5\u4F5C\u4E3A\u6211\u5C31\u4E1A\u6216\u6210\u4E3A\u4F1A\u5458\u7684\u6761\u4EF6\uFF1B</li><li>\u6211\u53EF\u4EE5\u62D2\u7EDD\u6350\u6B3E\uFF0C\u800C\u4E14\u4E0D\u4F1A\u56E0\u6B64\u53D7\u5230\u62A5\u590D\uFF1B</li><li>\u6839\u636E\u6CD5\u5F8B\u89C4\u5B9A\uFF0C\u53EA\u6709\u8EAB\u4E3A\u7F8E\u56FD\u516C\u6C11\u6216\u7F8E\u56FD\u5408\u6CD5\u6C38\u4E45\u5C45\u6C11\u7684\u5DE5\u4F1A\u6210\u5458\u548C\u884C\u653F/\u7BA1\u7406\u4EBA\u5458\u624D\u6709\u8D44\u683C\u5411 CAPE \u6350\u6B3E\uFF1B</li><li>\u6B64\u8868\u683C\u4E0A\u7684\u6350\u6B3E\u91D1\u989D\u4EC5\u662F\u5EFA\u8BAE\uFF0C\u6211\u53EF\u4EE5\u6216\u591A\u6216\u5C11\u5730\u901A\u8FC7\u6B64\u79CD\u65B9\u5F0F\u6216\u5176\u4ED6\u65B9\u5F0F\u6350\u6B3E\uFF0C\u800C\u65E0\u9700\u62C5\u5FC3\u4F1A\u53D7\u5230\u6765\u81EA SEIU \u6216\u6211\u96C7\u4E3B\u7684\u504F\u8892\u6216\u4FB5\u5BB3\uFF1B</li><li>SEIU CAPE \u5C06\u5176\u6536\u5230\u7684\u8D44\u91D1\u7528\u4E8E\u653F\u6CBB\u76EE\u7684 \u2014 \u5305\u62EC\u4F46\u4E0D\u9650\u4E8E\u5411\u8054\u90A6\u3001\u5DDE\u548C\u5730\u65B9\u529E\u4E8B\u5904\u5019\u9009\u4EBA\u7684\u6350\u6B3E\u548C\u4EE3\u8868\u5019\u9009\u4EBA\u4EA7\u751F\u7684\u5F00\u652F \u2014 \u4EE5\u53CA\u5904\u7406\u516C\u4F17\u5173\u6CE8\u7684\u653F\u6CBB\u95EE\u9898\u3002</li></ol><p>\u6B64\u6388\u6743\u5C06\u4E00\u76F4\u6709\u6548\uFF0C\u76F4\u81F3\u6211\u5C06\u64A4\u9500\u7533\u8BF7\u4EE5\u4E66\u9762\u5F62\u5F0F\u901A\u8FC7\u7F8E\u56FD\u90AE\u653F\u670D\u52A1\u90AE\u5BC4\u7ED9 SEIU \u4E3A\u6B62\u3002\u5411 SEIU Local 503\u3001OPEU CAPE \u7684\u6350\u6B3E\u6216\u6240\u9001\u793C\u7269\u4E0D\u80FD\u4F5C\u4E3A\u6148\u5584\u6350\u6B3E\u8FDB\u884C\u51CF\u7A0E\u3002</p></div>`,
      ar: `<div id="capeLL2"><p>\u064A\u062A\u0645 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0637\u0648\u0639\u064B\u0627 \u0628\u0646\u0627\u0621\u064B \u0639\u0644\u0649 \u0641\u0647\u0645\u064A \u0627\u0644\u0645\u062D\u062F\u062F \u0644\u0645\u0627 \u064A\u0644\u064A:</p><ol><li>\u0644\u0633\u062A \u0645\u0637\u0627\u0644\u0628\u064B\u0627 \u0628\u062A\u0648\u0642\u064A\u0639 \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C \u0623\u0648 \u062A\u0642\u062F\u064A\u0645 \u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0637\u0648\u0639\u064A\u0629 \u0625\u0644\u0649 SEIU CAPE \u0643\u0634\u0631\u0637 \u0644\u0644\u062A\u0648\u0638\u064A\u0641 \u0623\u0648 \u0627\u0644\u0639\u0636\u0648\u064A\u0629 \u0641\u064A \u0627\u0644\u0646\u0642\u0627\u0628\u0629\u061B</li><li>\u064A\u0645\u0643\u0646\u0646\u064A \u0631\u0641\u0636 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u062F\u0648\u0646 \u0627\u0646\u062A\u0642\u0627\u0645\u061B</li><li>\u0628\u0645\u0648\u062C\u0628 \u0627\u0644\u0642\u0627\u0646\u0648\u0646\u060C \u0644\u0627 \u064A\u062D\u0642 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A CAPE \u0625\u0644\u0627 \u0644\u0623\u0639\u0636\u0627\u0621 \u0627\u0644\u0646\u0642\u0627\u0628\u0627\u062A \u0648\u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0627\u0644\u062A\u0646\u0641\u064A\u0630\u064A\u064A\u0646/\u0627\u0644\u0625\u062F\u0627\u0631\u064A\u064A\u0646 \u0627\u0644\u0630\u064A\u0646 \u0647\u0645 \u0645\u0648\u0627\u0637\u0646\u0648\u0646 \u0623\u0645\u0631\u064A\u0643\u064A\u0648\u0646 \u0623\u0648 \u0645\u0642\u064A\u0645\u0648\u0646 \u062F\u0627\u0626\u0645\u0648\u0646 \u0642\u0627\u0646\u0648\u0646\u064A\u0648\u0646\u061B</li><li>\u0645\u0628\u0627\u0644\u063A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C \u0647\u064A \u0645\u062C\u0631\u062F \u0627\u0642\u062A\u0631\u0627\u062D\u0627\u062A\u060C \u0648\u064A\u0645\u0643\u0646\u0646\u064A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0628\u0623\u0643\u062B\u0631 \u0623\u0648 \u0623\u0642\u0644 \u0645\u0646 \u062E\u0644\u0627\u0644 \u0647\u0630\u0627 \u0627\u0644\u0648\u0633\u064A\u0644\u0629 \u0623\u0648 \u063A\u064A\u0631\u0647\u0627 \u062F\u0648\u0646 \u062E\u0648\u0641 \u0645\u0646 \u062A\u0641\u0636\u064A\u0644 \u0623\u0648 \u0636\u0631\u0631 \u0645\u0646 SEIU \u0623\u0648 \u0635\u0627\u062D\u0628 \u0639\u0645\u0644\u064A\u061B</li><li>\u062A\u0633\u062A\u062E\u062F\u0645 SEIU CAPE \u0627\u0644\u0623\u0645\u0648\u0627\u0644 \u0627\u0644\u062A\u064A \u062A\u062A\u0644\u0642\u0627\u0647\u0627 \u0644\u0623\u063A\u0631\u0627\u0636 \u0633\u064A\u0627\u0633\u064A\u0629\u060C \u0628\u0645\u0627 \u0641\u064A \u0630\u0644\u0643\u060C \u0639\u0644\u0649 \u0633\u0628\u064A\u0644 \u0627\u0644\u0645\u062B\u0627\u0644 \u0644\u0627 \u0627\u0644\u062D\u0635\u0631\u060C \u062A\u0642\u062F\u064A\u0645 \u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0648\u0646\u0641\u0642\u0627\u062A \u0646\u064A\u0627\u0628\u0629 \u0639\u0646 \u0645\u0631\u0634\u062D\u064A\u0646 \u0644\u0645\u0646\u0627\u0635\u0628 \u0641\u062F\u0631\u0627\u0644\u064A\u0629 \u0648\u0639\u0644\u0649 \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0648\u0644\u0627\u064A\u0629 \u0648\u0645\u062D\u0644\u064A\u0629\u060C \u0648\u0645\u0639\u0627\u0644\u062C\u0629 \u0642\u0636\u0627\u064A\u0627 \u0633\u064A\u0627\u0633\u064A\u0629 \u0630\u0627\u062A \u0623\u0647\u0645\u064A\u0629 \u0639\u0627\u0645\u0629.</li></ol><p>\u064A\u0628\u0642\u0649 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0633\u0627\u0631\u064A\u064B\u0627 \u062D\u062A\u0649 \u0623\u0644\u063A\u064A\u0647 \u0643\u062A\u0627\u0628\u0629\u064B \u0639\u0628\u0631 \u0627\u0644\u0628\u0631\u064A\u062F \u0627\u0644\u0623\u0645\u0631\u064A\u0643\u064A \u0625\u0644\u0649 SEIU. \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0623\u0648 \u0627\u0644\u0647\u062F\u0627\u064A\u0627 \u0627\u0644\u0645\u0642\u062F\u0645\u0629 \u0625\u0644\u0649 SEIU Local 503, OPEU CAPE \u0644\u064A\u0633\u062A \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062E\u0635\u0645 \u0627\u0644\u0636\u0631\u064A\u0628\u064A \u0643\u062A\u0628\u0631\u0639\u0627\u062A \u062E\u064A\u0631\u064A\u0629.</p></div>`,
      so: `<div id="capeLL2"><p>Oggolaanshahan waxaa loo bixinayaa si ikhtiyaari ah iyadoo ku salaysan fahamkayga gaarka ah ee ah:</p><ol><li>Looma baahna inaan saxiixo foomkan ama aan SEIU CAPE ku sameeyo tabarucyo ikhtiyaari ah si ay shardi ugu noqoto shaqadayda ama xubinnimadayda ururka;</li><li>Waan diidi karaa inaan tabaruco anigoon la kulmin aargoosi;</li><li>Sida sharcigu dhigayo, kaliya xubnaha ururka iyo shaqaalaha fulinta/maamulka ee ah Muwaadiniin Maraykan ah ama deggeneyaal rasmi ah oo sharci ah ayaa xaq u leh inay ku tabarucaan CAPE;</li><li>Qadarrada tabaruca ee foomkan ku qoran waa talooyin keliya, waxaana ku tabaruci karaa wax ka badan ama ka yar anigoo adeegsanaya habkan ama hab kale, anigoon ka baqayn in SEIU ama loo-shaqeeyahaygu i siiyo doorbid ama khasaare;</li><li>SEIU CAPE waxay lacagta ay hesho u isticmaashaa ujeeddooyin siyaasadeed \u2014 oo ay ku jiraan, balse aan ku koobnayn, tabarucyo iyo kharashyo loogu talagalay murashaxiinta xafiisyada federaalka, gobolka, iyo degaanka \u2014 iyo wax ka qabashada arrimaha siyaasadeed ee muhiimka u ah dadweynaha.</li></ol><p>Oggolaanshahan wuxuu sii jiri doonaa ilaa aan qoraal ahaan ugu noqdo anigoo boostada Maraykanka ugu diraya SEIU. Tabarucyada ama hadiyadaha loo diro SEIU Local 503, OPEU CAPE looma jari karo canshuur ahaan sida deeqo sadaqo ah.</p></div>`
    },

      mode: "html",
      legacyVar: "duesNote",
      en: `<strong>Note: Your membership will not be activated and no dues or CAPE contributions will be deducted from your paycheck until you negotiate and vote to approve your first union contract with your employer.</strong>`,
      es: `<strong>Nota: Su membres\xEDa no se activar\xE1 y no se deducir\xE1n ningunas cuotas ni contribuciones de CAPE de su cheque hasta que negocie y vote para aprobar su primer contrato de uni\xF3n con su empleador.</strong>`,
      ru: `<strong>\u041F\u0440\u0438\u043C\u0435\u0447\u0430\u043D\u0438\u0435: \u0432\u0430\u0448\u0435 \u0447\u043B\u0435\u043D\u0441\u0442\u0432\u043E \u043D\u0435 \u0431\u0443\u0434\u0435\u0442 \u0430\u043A\u0442\u0438\u0432\u0438\u0440\u043E\u0432\u0430\u043D\u043E, \u0438 \u043D\u0438\u043A\u0430\u043A\u0438\u0435 \u0432\u0437\u043D\u043E\u0441\u044B \u0438\u043B\u0438 \u0432\u0437\u043D\u043E\u0441\u044B CAPE \u043D\u0435 \u0431\u0443\u0434\u0443\u0442 \u0443\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0442\u044C\u0441\u044F \u0438\u0437 \u0432\u0430\u0448\u0435\u0439 \u0437\u0430\u0440\u043F\u043B\u0430\u0442\u044B, \u043F\u043E\u043A\u0430 \u0432\u044B \u043D\u0435 \u043F\u0440\u043E\u0432\u0435\u0434\u0435\u0442\u0435 \u043F\u0435\u0440\u0435\u0433\u043E\u0432\u043E\u0440\u044B \u0438 \u043D\u0435 \u043F\u0440\u043E\u0433\u043E\u043B\u043E\u0441\u0443\u0435\u0442\u0435 \u0437\u0430 \u0443\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043D\u0438\u0435 \u043F\u0435\u0440\u0432\u043E\u0433\u043E \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u043D\u043E\u0433\u043E \u043A\u043E\u043D\u0442\u0440\u0430\u043A\u0442\u0430 \u0441 \u0432\u0430\u0448\u0438\u043C \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u0435\u043C.</strong>`,
      vi: `<strong>L\u01B0u \xFD: T\u01B0 c\xE1ch h\u1ED9i vi\xEAn c\u1EE7a qu\xFD v\u1ECB s\u1EBD ch\u01B0a \u0111\u01B0\u1EE3c k\xEDch ho\u1EA1t v\xE0 s\u1EBD kh\xF4ng c\xF3 h\u1ED9i ph\xED ho\u1EB7c kho\u1EA3n \u0111\xF3ng g\xF3p CAPE n\xE0o b\u1ECB kh\u1EA5u tr\u1EEB t\u1EEB ti\u1EC1n l\u01B0\u01A1ng cho \u0111\u1EBFn khi qu\xFD v\u1ECB th\u01B0\u01A1ng l\u01B0\u1EE3ng v\xE0 b\u1ECF phi\u1EBFu ph\xEA duy\u1EC7t h\u1EE3p \u0111\u1ED3ng c\xF4ng \u0111o\xE0n \u0111\u1EA7u ti\xEAn v\u1EDBi ch\u1EE7 lao \u0111\u1ED9ng.</strong>`,
      zh: `<strong>\u6CE8\u610F\uFF1A\u5728\u60A8\u4E0E\u96C7\u4E3B\u8C08\u5224\u5E76\u6295\u7968\u6279\u51C6\u7B2C\u4E00\u4EFD\u5DE5\u4F1A\u5408\u540C\u4E4B\u524D\uFF0C\u60A8\u7684\u4F1A\u5458\u8D44\u683C\u4E0D\u4F1A\u88AB\u6FC0\u6D3B\uFF0C\u4E5F\u4E0D\u4F1A\u4ECE\u60A8\u7684\u85AA\u6C34\u4E2D\u6263\u9664\u4EFB\u4F55\u4F1A\u8D39\u6216 CAPE \u6350\u6B3E\u3002</strong>`,

    CAPECopy: {
      selector: '[data-cape-translate="CAPECopy"]',
      mode: "html",
      legacyVar: "CAPECopy",
      en: `<div id="quoteCon" class="cape-quote"><div class="cape-quote-content"><div class="cape-quote-text-wrap"><svg class="cape-quote-icon cape-quote-icon-open" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg><p class="cape-quote-text">I can\u2019t write big checks. But I contribute what I can each month to CAPE. And when we put all of our resources together, we have shown we can elect legislators in Oregon who will fight for working families and our clients.</p><svg class="cape-quote-icon cape-quote-icon-close" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg></div><p class="cape-quote-attribution">\u2014Deffo Mebrat, Adult Foster Care Provider</p></div><img class="cape-quote-image" src="https://seiu503.tfaforms.net/forms/get_image/3/7scGYMrpwLhJ4AmGzpnPSKaz7NFBsDhTavVfsbrhguy4A78N4DFrJV8YyKklhV5i-ibrahim_coulibaly_300-Bq8u2x_N.png" alt="Deffo Mebrat, Adult Foster Care Provider"></div>`,
      es: `<div id="quoteCon" class="cape-quote"><div class="cape-quote-content"><div class="cape-quote-text-wrap"><svg class="cape-quote-icon cape-quote-icon-open" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg><p class="cape-quote-text">No puedo ofrecer grandes sumas, pero mensualmente aporto lo que puedo al CAPE. Si juntamos todos nuestros recursos, demostraremos que podemos elegir legisladores en Oreg\xF3n que luchar\xE1n por las familias trabajadoras y nuestros clientes.</p><svg class="cape-quote-icon cape-quote-icon-close" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg></div><p class="cape-quote-attribution">\u2014Deffo Mebrat, proveedor de atenci\xF3n temporal para adultos</p></div><img class="cape-quote-image" src="https://seiu503.tfaforms.net/forms/get_image/3/7scGYMrpwLhJ4AmGzpnPSKaz7NFBsDhTavVfsbrhguy4A78N4DFrJV8YyKklhV5i-ibrahim_coulibaly_300-Bq8u2x_N.png" alt="Deffo Mebrat, proveedor de atenci\xF3n temporal para adultos"></div>`,
      ru: `<div id="quoteCon" class="cape-quote"><div class="cape-quote-content"><div class="cape-quote-text-wrap"><svg class="cape-quote-icon cape-quote-icon-open" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg><p class="cape-quote-text">\u042F \u043D\u0435 \u043C\u043E\u0433\u0443 \u0432\u044B\u043F\u0438\u0441\u044B\u0432\u0430\u0442\u044C \u0447\u0435\u043A\u0438 \u043D\u0430 \u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u0441\u0443\u043C\u043C\u044B. \u041D\u043E \u0432\u043D\u043E\u0448\u0443 \u0432\u0437\u043D\u043E\u0441\u044B \u0432 CAPE \u043A\u0430\u0436\u0434\u044B\u0439 \u043C\u0435\u0441\u044F\u0446 \u0432 \u0442\u043E\u043C \u043E\u0431\u044A\u0435\u043C\u0435, \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u043C\u043E\u0433\u0443 \u043F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C. \u041A\u043E\u0433\u0434\u0430 \u043C\u044B \u043E\u0431\u044A\u0435\u0434\u0438\u043D\u044F\u0435\u043C \u0432\u0441\u0435 \u0441\u0432\u043E\u0438 \u0440\u0435\u0441\u0443\u0440\u0441\u044B, \u043A\u0430\u043A \u043C\u044B \u0443\u0436\u0435 \u0434\u043E\u043A\u0430\u0437\u0430\u043B\u0438, \u043C\u044B \u043C\u043E\u0436\u0435\u043C \u0438\u0437\u0431\u0438\u0440\u0430\u0442\u044C \u0441\u0432\u043E\u0438\u0445 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u043E\u0432 \u0432 \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0448\u0442\u0430\u0442\u0430 \u041E\u0440\u0435\u0433\u043E\u043D, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0431\u0443\u0434\u0443\u0442 \u0440\u0430\u0431\u043E\u0442\u0430\u0442\u044C \u043D\u0430 \u0431\u043B\u0430\u0433\u043E \u0440\u0430\u0431\u043E\u0447\u0438\u0445 \u0441\u0435\u043C\u0435\u0439 \u0438 \u043D\u0430\u0448\u0438\u0445 \u043A\u043B\u0438\u0435\u043D\u0442\u043E\u0432.</p><svg class="cape-quote-icon cape-quote-icon-close" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg></div><p class="cape-quote-attribution">\u2014\u0414\u0435\u0444\u0444\u043E \u041C\u0435\u0431\u0440\u0430\u0442 (Deffo Mebrat), \u043F\u043E\u0441\u0442\u0430\u0432\u0449\u0438\u043A \u0443\u0441\u043B\u0443\u0433 \u043F\u043E \u043E\u043F\u0435\u043A\u0435 \u043D\u0430\u0434 \u0441\u043E\u0432\u0435\u0440\u0448\u0435\u043D\u043D\u043E\u043B\u0435\u0442\u043D\u0438\u043C\u0438 \u043F\u0430\u0446\u0438\u0435\u043D\u0442\u0430\u043C\u0438</p></div><img class="cape-quote-image" src="https://seiu503.tfaforms.net/forms/get_image/3/7scGYMrpwLhJ4AmGzpnPSKaz7NFBsDhTavVfsbrhguy4A78N4DFrJV8YyKklhV5i-ibrahim_coulibaly_300-Bq8u2x_N.png" alt="\u0414\u0435\u0444\u0444\u043E \u041C\u0435\u0431\u0440\u0430\u0442 (Deffo Mebrat), \u043F\u043E\u0441\u0442\u0430\u0432\u0449\u0438\u043A \u0443\u0441\u043B\u0443\u0433 \u043F\u043E \u043E\u043F\u0435\u043A\u0435 \u043D\u0430\u0434 \u0441\u043E\u0432\u0435\u0440\u0448\u0435\u043D\u043D\u043E\u043B\u0435\u0442\u043D\u0438\u043C\u0438 \u043F\u0430\u0446\u0438\u0435\u043D\u0442\u0430\u043C\u0438"></div>`,
      vi: `<div id="quoteCon" class="cape-quote"><div class="cape-quote-content"><div class="cape-quote-text-wrap"><svg class="cape-quote-icon cape-quote-icon-open" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg><p class="cape-quote-text">T\xF4i kh\xF4ng th\u1EC3 \u0111\xF3ng g\xF3p nhi\u1EC1u v\u1EC1 m\u1EB7t t\xE0i ch\xEDnh. Tuy nhi\xEAn, t\xF4i s\u1EBD \u0111\xF3ng g\xF3p cho CAPE theo s\u1EE9c m\xECnh m\u1ED7i th\xE1ng. V\xE0 khi t\u1EADp h\u1EE3p m\u1ECDi ngu\u1ED3n l\u1EF1c v\u1EDBi nhau, ch\xFAng ta cho th\u1EA5y r\u1EB1ng ch\xFAng ta c\xF3 th\u1EC3 b\u1EA7u c\xE1c nh\xE0 l\xE0m lu\u1EADt \u1EDF Oregon. H\u1ECD s\u1EBD \u0111\u1EA5u tranh cho c\xE1c gia \u0111\xECnh lao \u0111\u1ED9ng v\xE0 kh\xE1ch h\xE0ng c\u1EE7a ch\xFAng ta.</p><svg class="cape-quote-icon cape-quote-icon-close" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg></div><p class="cape-quote-attribution">\u2014Deffo Mebrat, Nh\xE0 cung c\u1EA5p d\u1ECBch v\u1EE5 Ch\u0103m s\xF3c nu\xF4i d\u01B0\u1EE1ng cho ng\u01B0\u1EDDi tr\u01B0\u1EDFng th\xE0nh</p></div><img class="cape-quote-image" src="https://seiu503.tfaforms.net/forms/get_image/3/7scGYMrpwLhJ4AmGzpnPSKaz7NFBsDhTavVfsbrhguy4A78N4DFrJV8YyKklhV5i-ibrahim_coulibaly_300-Bq8u2x_N.png" alt="Deffo Mebrat, Nh\xE0 cung c\u1EA5p d\u1ECBch v\u1EE5 Ch\u0103m s\xF3c nu\xF4i d\u01B0\u1EE1ng cho ng\u01B0\u1EDDi tr\u01B0\u1EDFng th\xE0nh"></div>`,
      zh: `<div id="quoteCon" class="cape-quote"><div class="cape-quote-content"><div class="cape-quote-text-wrap"><svg class="cape-quote-icon cape-quote-icon-open" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg><p class="cape-quote-text">\u6211\u6CA1\u6709\u80FD\u529B\u5F00\u5927\u989D\u652F\u7968\u3002\u4F46\u6BCF\u4E2A\u6708\u6211\u90FD\u5C3D\u81EA\u5DF1\u6240\u80FD\u4E3A CAPE \u6350\u6B3E\u3002\u6211\u4EEC\u5DF2\u7ECF\u5411\u5927\u5BB6\u8BC1\u660E\uFF0C\u5F53\u6574\u5408\u6240\u6709\u8D44\u6E90\u540E\uFF0C\u6211\u4EEC\u5C31\u53EF\u4EE5\u5728\u4FC4\u52D2\u5188\u5DDE\u9009\u51FA\u5C06\u4E3A\u5DE5\u85AA\u5BB6\u5EAD\u548C\u6211\u4EEC\u7684\u5BA2\u6237\u800C\u594B\u6597\u7684\u7ACB\u6CD5\u8005\u3002</p><svg class="cape-quote-icon cape-quote-icon-close" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg></div><p class="cape-quote-attribution">\u2014Deffo Mebrat\uFF0C\u6210\u4EBA\u5BC4\u517B\u62A4\u7406\u63D0\u4F9B\u8005</p></div><img class="cape-quote-image" src="https://seiu503.tfaforms.net/forms/get_image/3/7scGYMrpwLhJ4AmGzpnPSKaz7NFBsDhTavVfsbrhguy4A78N4DFrJV8YyKklhV5i-ibrahim_coulibaly_300-Bq8u2x_N.png" alt="Deffo Mebrat\uFF0C\u6210\u4EBA\u5BC4\u517B\u62A4\u7406\u63D0\u4F9B\u8005"></div>`,
      ar: `<div id="quoteCon" class="cape-quote"><div class="cape-quote-content"><div class="cape-quote-text-wrap"><svg class="cape-quote-icon cape-quote-icon-open" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg><p class="cape-quote-text">\u0644\u0627 \u0623\u0633\u062A\u0637\u064A\u0639 \u0643\u062A\u0627\u0628\u0629 \u0634\u064A\u0643\u0627\u062A \u0643\u0628\u064A\u0631\u0629. \u0644\u0643\u0646\u0646\u064A \u0623\u0633\u0627\u0647\u0645 \u0628\u0645\u0627 \u0623\u0633\u062A\u0637\u064A\u0639 \u0643\u0644 \u0634\u0647\u0631 \u0641\u064A CAPE. \u0648\u0639\u0646\u062F\u0645\u0627 \u0646\u062C\u0645\u0639 \u0645\u0648\u0627\u0631\u062F\u0646\u0627 \u0643\u0644\u0647\u0627\u060C \u0623\u062B\u0628\u062A\u0646\u0627 \u0623\u0646\u0646\u0627 \u0646\u0633\u062A\u0637\u064A\u0639 \u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u0634\u0631\u0651\u0639\u064A\u0646 \u0641\u064A \u0623\u0648\u0631\u064A\u063A\u0648\u0646 \u064A\u062F\u0627\u0641\u0639\u0648\u0646 \u0639\u0646 \u0627\u0644\u0639\u0627\u0626\u0644\u0627\u062A \u0627\u0644\u0639\u0627\u0645\u0644\u0629 \u0648\u0639\u0645\u0644\u0627\u0626\u0646\u0627.</p><svg class="cape-quote-icon cape-quote-icon-close" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg></div><p class="cape-quote-attribution">\u2014\u062F\u064A\u0641\u0648 \u0645\u064A\u0628\u0631\u0627\u062A\u060C \u0645\u0642\u062F\u0645 \u0631\u0639\u0627\u064A\u0629 \u062D\u0636\u0627\u0646\u0629 \u0644\u0644\u0628\u0627\u0644\u063A\u064A\u0646</p></div><img class="cape-quote-image" src="https://seiu503.tfaforms.net/forms/get_image/3/7scGYMrpwLhJ4AmGzpnPSKaz7NFBsDhTavVfsbrhguy4A78N4DFrJV8YyKklhV5i-ibrahim_coulibaly_300-Bq8u2x_N.png" alt="\u062F\u064A\u0641\u0648 \u0645\u064A\u0628\u0631\u0627\u062A\u060C \u0645\u0642\u062F\u0645 \u0631\u0639\u0627\u064A\u0629 \u062D\u0636\u0627\u0646\u0629 \u06       so: `<div id="quoteCon" class="cape-quote"><div class="cape-quote-content"><div class="cape-quote-text-wrap"><svg class="cape-quote-icon cape-quote-icon-open" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg><p class="cape-quote-text">Ma qori karo jeegag waaweyn. Laakiin bil kasta waxaan CAPE ku daraa inta aan awoodo. Marka aan dhammaan khayraadkeenna isu geyno, waxaan muujinnay inaan Oregon ka dooran karno sharci-dejiyayaal u dagaallami doona qoysaska shaqeeya iyo macaamiisheena.</p><svg class="cape-quote-icon cape-quote-icon-close" aria-hidden="true" viewBox="0 0 24 24" data-testid="FormatQuoteIcon"><path d="M6 17h3l2-4V7H5v6h3zm8 0h3l2-4V7h-6v6h3z"></path></svg></div><p class="cape-quote-attribution">\u2014Deffo Mebrat, bixiye daryeel hoy-koriin dadka waaweyn</p></div><img class="cape-quote-image" src="https://seiu503.tfaforms.net/forms/get_image/3/7scGYMrpwLhJ4AmGzpnPSKaz7NFBsDhTavVfsbrhguy4A78N4DFrJV8YyKklhV5i-ibrahim_coulibaly_300-Bq8u2x_N.png" alt="Deffo Mebrat, bixiye daryeel hoy-koriin dadka waaweyn"></div>`
    },
    combinedLL: {
      selector: '[data-cape-translate="combinedLL"]',
      mode: "text",
      legacyVar: "combinedLL",
      en: `**CAPE Authorization: By submitting this form, I hereby authorize my Employer to deduct the designated amount from my monthly earnings as a contribution to SEIU Local 503, OPEU CAPE.  This authorization is made voluntarily based on my specific understanding that:  I am not required to sign this form or make voluntary contributions to SEIU CAPE as a condition of my employment or membership in the union;  I may refuse to contribute without reprisal;  Under law, only union members and executive / administrative staff who are U.S. Citizens or lawful permanent residents are eligible to contribute to CAPE;  The contribution amounts on this form are merely suggestions, and I may contribute more or less by this or other means without fear of favor or disadvantage from SEIU or my employer;  SEIU CAPE uses the money it receives for political purposes \u2013 including, but not limited to, making contributions to and expenditures on behalf of candidates for federal, state, and local offices \u2013 and addressing political issues of public importance.  This authorization shall remain in effect until revoked by me in writing via U.S. mail to SEIU. Contributions or gifts to SEIU Local 503, OPEU CAPE are not tax deductible as charitable contributions.`,
      es: `**CAPE Authorization: Por medio del presente, y tras haber enviado este formulario, autorizo a mi Empleador a deducir de mis ganancias mensuales el monto designado como aporte al CAPE de SEIU Local 503, OPEU.  Esta autorizaci\xF3n es voluntaria y se basa en mis conocimientos espec\xEDficos de que:  No estoy en la obligaci\xF3n de firmar este formulario o realizar aportes voluntarios a la Acci\xF3n Ciudadana en Favor de la Educaci\xF3n Pol\xEDtica (por su sigla en ingl\xE9s CAPE) de SEIU, y no supone una condici\xF3n para mantener mi empleo o membres\xEDa en la uni\xF3n;  Puedo rechazar el aporte sin que esto suponga represalias;  De conformidad con la ley, solo los(as) miembros de la uni\xF3n y el personal administrativo/ejecutivo de la misma que sean ciudadanos(as) de los EE. UU. o residentes permanentes legales son elegibles para aportar a la CAPE;  Los montos de los aportes mencionados en este formulario solo son sugerencias, as\xED que puedo aportar m\xE1s o menos a trav\xE9s de este u otros medios sin temor a que suponga una ventaja o desventaja de parte de SEIU o mi empleador;  La CAPE de SEIU utiliza el dinero que recibe para fines pol\xEDticos, entre ellos, realizar aportes y cubrir los gastos de los(as) candidatos(as) a cargos federales, estatales y locales, as\xED como afrontar asuntos pol\xEDticos de car\xE1cter p\xFAblico  Esta autorizaci\xF3n permanecer\xE1 vigente hasta que yo la revoque envi\xE1ndole un aviso a SEIU a trav\xE9s del correo postal de los EE. UU. Los aportes u obsequios a la CAPE de SEIU Local 503, OPEU no son deducibles de impuestos como aportes ben\xE9ficos.`,
      ru: `**CAPE Authorization: \u041E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u044F \u044D\u0442\u0443 \u0444\u043E\u0440\u043C\u0443, \u044F \u0443\u043F\u043E\u043B\u043D\u043E\u043C\u043E\u0447\u0438\u0432\u0430\u044E \u0441\u0432\u043E\u0435\u0433\u043E \u0420\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044F \u0432\u044B\u0447\u0438\u0442\u0430\u0442\u044C \u0443\u043A\u0430\u0437\u0430\u043D\u043D\u0443\u044E \u0441\u0443\u043C\u043C\u0443 \u0438\u0437 \u043C\u043E\u0435\u0439 \u0435\u0436\u0435\u043C\u0435\u0441\u044F\u0447\u043D\u043E\u0439 \u0437\u0430\u0440\u0430\u0431\u043E\u0442\u043D\u043E\u0439 \u043F\u043B\u0430\u0442\u044B \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0432\u0437\u043D\u043E\u0441\u0430 \u0432 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437 SEIU Local 503, OPEU CAPE.  \u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0435 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u0434\u0430\u0435\u0442\u0441\u044F \u043D\u0430 \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u043D\u043E\u0439 \u043E\u0441\u043D\u043E\u0432\u0435 \u0441 \u0443\u0447\u0435\u0442\u043E\u043C \u043C\u043E\u0435\u0433\u043E \u043F\u043E\u043D\u0438\u043C\u0430\u043D\u0438\u044F, \u0447\u0442\u043E:  \u042F \u043D\u0435 \u043E\u0431\u044F\u0437\u0430\u043D(-\u0430) \u043F\u043E\u0434\u043F\u0438\u0441\u044B\u0432\u0430\u0442\u044C \u044D\u0442\u0443 \u0444\u043E\u0440\u043C\u0443 \u0438\u043B\u0438 \u0434\u0435\u043B\u0430\u0442\u044C \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u043D\u044B\u0435 \u0432\u0437\u043D\u043E\u0441\u044B \u0432 SEIU CAPE \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0443\u0441\u043B\u043E\u0432\u0438\u044F \u043C\u043E\u0435\u0433\u043E \u0442\u0440\u0443\u0434\u043E\u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430 \u0438\u043B\u0438 \u0447\u043B\u0435\u043D\u0441\u0442\u0432\u0430 \u0432 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0435;  \u042F \u043C\u043E\u0433\u0443 \u043E\u0442\u043A\u0430\u0437\u0430\u0442\u044C\u0441\u044F \u043E\u0442 \u0432\u0437\u043D\u043E\u0441\u043E\u0432 \u0431\u0435\u0437 \u043E\u0442\u0432\u0435\u0442\u043D\u044B\u0445 \u043C\u0435\u0440;  \u041F\u043E \u0437\u0430\u043A\u043E\u043D\u0443 \u043F\u0440\u0430\u0432\u043E \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0432\u0437\u043D\u043E\u0441\u044B \u0432 CAPE \u0438\u043C\u0435\u044E\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0447\u043B\u0435\u043D\u044B \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430 \u0438 \u0438\u0441\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 / \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043D\u044B\u0439 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B, \u044F\u0432\u043B\u044F\u044E\u0449\u0438\u0435\u0441\u044F \u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0430\u043C\u0438 \u0421\u0428\u0410 \u0438\u043B\u0438 \u0437\u0430\u043A\u043E\u043D\u043D\u044B\u043C\u0438 \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u044B\u043C\u0438 \u0436\u0438\u0442\u0435\u043B\u044F\u043C\u0438 \u0421\u0428\u0410;  \u0421\u0443\u043C\u043C\u044B \u0432\u0437\u043D\u043E\u0441\u043E\u0432 \u0443\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0432 \u0434\u0430\u043D\u043D\u043E\u0439 \u0444\u043E\u0440\u043C\u0435 \u0442\u043E\u043B\u044C\u043A\u043E \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0430\u0446\u0438\u0439, \u0438 \u044F \u043C\u043E\u0433\u0443 \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0431\u043E\u043B\u044C\u0448\u0435 \u0438\u043B\u0438 \u043C\u0435\u043D\u044C\u0448\u0435 \u044D\u0442\u0438\u043C \u0438\u043B\u0438 \u0438\u043D\u044B\u043C \u0441\u043F\u043E\u0441\u043E\u0431\u043E\u043C, \u043D\u0435 \u043E\u043F\u0430\u0441\u0430\u044F\u0441\u044C, \u0447\u0442\u043E SEIU \u0438\u043B\u0438 \u043C\u043E\u0439 \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044C \u0431\u0443\u0434\u0443\u0442 \u043E\u0442\u043D\u043E\u0441\u0438\u0442\u044C\u0441\u044F \u043A\u043E \u043C\u043D\u0435 \u043F\u0440\u0435\u0434\u0432\u0437\u044F\u0442\u043E (\u0441\u043E\u0434\u0435\u0439\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C \u0438\u043B\u0438 \u043F\u0440\u0435\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u0442\u044C);  SEIU CAPE \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u043D\u044B\u0435 \u0434\u0435\u043D\u044C\u0433\u0438 \u043D\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0446\u0435\u043B\u0438, \u0432\u043A\u043B\u044E\u0447\u0430\u044F \u0432 \u0442\u043E\u043C \u0447\u0438\u0441\u043B\u0435 \u043D\u0430 \u0432\u0437\u043D\u043E\u0441\u044B \u0438 \u0432\u043B\u043E\u0436\u0435\u043D\u0438\u044F \u043E\u0442 \u0438\u043C\u0435\u043D\u0438 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u043E\u0432 \u0432 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438, \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438 \u0448\u0442\u0430\u0442\u0430 \u0438 \u043C\u0435\u0441\u0442\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438 \u2014 \u0438 \u043D\u0430 \u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u0432\u043E\u043F\u0440\u043E\u0441\u043E\u0432 \u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u0437\u043D\u0430\u0447\u0438\u043C\u043E\u0441\u0442\u0438.  \u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0435 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u043E\u0441\u0442\u0430\u0435\u0442\u0441\u044F \u0432 \u0441\u0438\u043B\u0435, \u043F\u043E\u043A\u0430 \u044F \u043D\u0435 \u043E\u0442\u0437\u043E\u0432\u0443 \u0435\u0433\u043E \u0432 \u043F\u0438\u0441\u044C\u043C\u0435\u043D\u043D\u043E\u0439 \u0444\u043E\u0440\u043C\u0435 \u0432 \u043E\u0431\u0440\u0430\u0449\u0435\u043D\u0438\u0438 \u043A SEIU, \u043E\u0442\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u043D\u043E\u043C \u043F\u043E \u041F\u043E\u0447\u0442\u0435 \u0421\u0428\u0410. \u0412\u0437\u043D\u043E\u0441\u044B \u0438 \u043F\u043E\u0434\u0430\u0440\u043A\u0438 \u0432 SEIU Local 503, OPEU CAPE \u043D\u0435 \u043F\u043E\u0434\u043B\u0435\u0436\u0430\u0442 \u043D\u0430\u043B\u043E\u0433\u043E\u043E\u0431\u043B\u043E\u0436\u0435\u043D\u0438\u044E \u043A\u0430\u043A \u0431\u043B\u0430\u0433\u043E\u0442\u0432\u043E\u0440\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u0432\u0437\u043D\u043E\u0441\u044B.`,
      vi: `**CAPE Authorization: B\u1EB1ng vi\u1EC7c g\u1EEDi bi\u1EC3u m\u1EABu n\xE0y, t\xF4i \u1EE7y quy\u1EC1n cho Ch\u1EE7 s\u1EED d\u1EE5ng lao \u0111\u1ED9ng c\u1EE7a m\xECnh chi\u1EBFt kh\u1EA5u m\u1ED9t kho\u1EA3n ch\u1EC9 \u0111\u1ECBnh t\u1EEB ti\u1EC1n l\u01B0\u01A1ng h\xE0ng th\xE1ng c\u1EE7a t\xF4i \u0111\u1EC3 l\xE0m kho\u1EA3n \u0111\xF3ng g\xF3p cho CAPE SEIU Local 503, OPEU.  T\xF4i ch\u1EA5p thu\u1EADn vi\u1EC7c n\xE0y tr\xEAn tinh th\u1EA7n t\u1EF1 nguy\u1EC7n d\u1EF1a tr\xEAn hi\u1EC3u bi\u1EBFt c\u1EE5 th\u1EC3 c\u1EE7a b\u1EA3n th\xE2n r\u1EB1ng:  T\xF4i kh\xF4ng b\u1EAFt bu\u1ED9c ph\u1EA3i k\xFD v\xE0o m\u1EABu \u0111\u01A1n n\xE0y ho\u1EB7c kh\xF4ng b\u1ECB \xE9p bu\u1ED9c \u0111\xF3ng g\xF3p cho SEIU CAPE nh\u01B0 m\u1ED9t \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c tuy\u1EC3n d\u1EE5ng ho\u1EB7c gia nh\u1EADp li\xEAn \u0111o\xE0n;  T\xF4i c\xF3 th\u1EC3 t\u1EEB ch\u1ED1i \u0111\xF3ng g\xF3p m\xE0 kh\xF4ng s\u1EE3 b\u1ECB tr\u1EA3 \u0111\u0169a;  Theo lu\u1EADt, ch\u1EC9 c\xF3 th\xE0nh vi\xEAn li\xEAn \u0111o\xE0n v\xE0 \u0111\u1ED9i ng\u0169 \u0111i\u1EC1u h\xE0nh/qu\u1EA3n tr\u1ECB l\xE0 th\u01B0\u1EDDng tr\xFA nh\xE2n h\u1EE3p ph\xE1p ho\u1EB7c c\xF4ng d\xE2n Hoa K\u1EF3 m\u1EDBi \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\xF3ng g\xF3p v\xE0o CAPE.  S\u1ED1 ti\u1EC1n \u0111\xF3ng g\xF3p ghi tr\xEAn \u0111\u01A1n n\xE0y ch\u1EC9 l\xE0 m\u1EE9c \u0111\u1EC1 xu\u1EA5t, v\xE0 t\xF4i c\xF3 th\u1EC3 \u0111\xF3ng g\xF3p nhi\u1EC1u ho\u1EB7c \xEDt h\u01A1n hay b\u1EB1ng c\xE1c h\xECnh th\u1EE9c kh\xE1c m\xE0 kh\xF4ng ph\u1EA3i lo s\u1EE3 SEIU hay ch\u1EE7 lao \u0111\u1ED9ng c\u1EE7a t\xF4i s\u1EBD thi\xEAn v\u1ECB ho\u1EB7c g\xE2y b\u1EA5t l\u1EE3i;  SEIU CAPE s\u1EED d\u1EE5ng s\u1ED1 ti\u1EC1n nh\u1EADn \u0111\u01B0\u1EE3c cho m\u1EE5c \u0111\xEDch ch\xEDnh tr\u1ECB \u2013 bao g\u1ED3m nh\u01B0ng kh\xF4ng gi\u1EDBi h\u1EA1n \u1EDF c\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p v\xE0 chi ph\xED thay m\u1EB7t cho \u1EE9ng vi\xEAn tranh c\u1EED cho c\xE1c ch\u1EE9c v\u1EE5 c\u1EA5p li\xEAn bang, ti\u1EC3u bang v\xE0 \u0111\u1ECBa ph\u01B0\u01A1ng \u2013 \u0111\u1ED3ng th\u1EDDi gi\u1EA3i quy\u1EBFt nh\u1EEFng v\u1EA5n \u0111\u1EC1 ch\xEDnh tr\u1ECB c\xF3 t\u1EA7m quan tr\u1ECDng v\u1EDBi c\u1ED9ng \u0111\u1ED3ng.  S\u1EF1 \u1EE7y quy\u1EC1n n\xE0y s\u1EBD gi\u1EEF nguy\xEAn hi\u1EC7u l\u1EF1c cho \u0111\u1EBFn khi t\xF4i r\xFAt l\u1EA1i b\u1EB1ng th\u01B0 vi\u1EBFt tay g\u1EEDi \u0111\u1EBFn SEIU qua d\u1ECBch v\u1EE5 b\u01B0u \u0111i\u1EC7n c\u1EE7a Hoa K\u1EF3. C\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p ho\u1EB7c qu\xE0 t\u1EB7ng g\u1EEDi \u0111\u1EBFn SEIU Local 503, OPEU CAPE s\u1EBD kh\xF4ng \u0111\u01B0\u1EE3c kh\u1EA5u tr\u1EEB thu\u1EBF nh\u01B0 c\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p t\u1EEB thi\u1EC7n.`,
      zh: `**CAPE Authorization: \u901A\u8FC7\u63D0\u4EA4\u6B64\u8868\u683C\uFF0C\u6211\u7279\u6B64\u6388\u6743\u6211\u7684\u96C7\u4E3B\u4ECE\u6211\u7684\u6708\u6536\u5165\u4E2D\u6263\u9664\u6307\u5B9A\u91D1\u989D\u4F5C\u4E3A\u672C\u4EBA\u5411 SEIU Local 503\uFF0COPEU CAPE \u7684\u6350\u6B3E\u3002  \u6211\u57FA\u4E8E\u4EE5\u4E0B\u5177\u4F53\u7406\u89E3\u81EA\u613F\u4F5C\u51FA\u672C\u6388\u6743\uFF1A  \u6211\u65E0\u9700\u7B7E\u7F72\u6B64\u8868\u683C\u6216\u81EA\u613F\u5411 SEIU CAPE \u6350\u6B3E\u4EE5\u4F5C\u4E3A\u6211\u5C31\u4E1A\u6216\u6210\u4E3A\u4F1A\u5458\u7684\u6761\u4EF6\uFF1B  \u6211\u53EF\u4EE5\u62D2\u7EDD\u6350\u6B3E\uFF0C\u800C\u4E14\u4E0D\u4F1A\u56E0\u6B64\u53D7\u5230\u62A5\u590D\uFF1B  \u6839\u636E\u6CD5\u5F8B\u89C4\u5B9A\uFF0C\u53EA\u6709\u8EAB\u4E3A\u7F8E\u56FD\u516C\u6C11\u6216\u7F8E\u56FD\u5408\u6CD5\u6C38\u4E45\u5C45\u6C11\u7684\u5DE5\u4F1A\u6210\u5458\u548C\u884C\u653F/\u7BA1\u7406\u4EBA\u5458\u624D\u6709\u8D44\u683C\u5411 CAPE \u6350\u6B3E\uFF1B  \u6B64\u8868\u683C\u4E0A\u7684\u6350\u6B3E\u91D1\u989D\u4EC5\u662F\u5EFA\u8BAE\uFF0C\u6211\u53EF\u4EE5\u6216\u591A\u6216\u5C11\u5730\u901A\u8FC7\u6B64\u79CD\u65B9\u5F0F\u6216\u5176\u4ED6\u65B9\u5F0F\u6350\u6B3E\uFF0C\u800C\u65E0\u9700\u62C5\u5FC3\u4F1A\u53D7\u5230\u6765\u81EA SEIU \u6216\u6211\u96C7\u4E3B\u7684\u504F\u8892\u6216\u4FB5\u5BB3\uFF1B  SEIU CAPE \u5C06\u5176\u6536\u5230\u7684\u8D44\u91D1\u7528\u4E8E\u653F\u6CBB\u76EE\u7684 \u2014 \u5305\u62EC\u4F46\u4E0D\u9650\u4E8E\u5411\u8054\u90A6\u3001\u5DDE\u548C\u5730\u65B9\u529E\u4E8B\u5904\u5019\u9009\u4EBA\u7684\u6350\u6B3E\u548C\u4EE3\u8868\u5019\u9009\u4EBA\u4EA7\u751F\u7684\u5F00\u652F \u2014 \u4EE5\u53CA\u5904\u7406\u516C\u4F17\u5173\u6CE8\u7684\u653F\u6CBB\u95EE\u9898\u3002  \u6B64\u6388\u6743\u5C06\u4E00\u76F4\u6709\u6548\uFF0C\u76F4\u81F3\u6211\u5C06\u64A4\u9500\u7533\u8BF7\u4EE5\u4E66\u9762\u5F62\u5F0F\u901A\u8FC7\u7F8E\u56FD\u90AE\u653F\u670D\u52A1\u90AE\u5BC4\u7ED9 SEIU \u4E3A\u6B62\u3002\u5411 SEIU Local 503\u3001OPEU CAPE \u7684\u6350\u6B3E\u6216\u6240\u9001\u793C\u7269\u4E0D\u80FD\u4F5C\u4E3A\u6148\u5584\u6350\u6B3E\u8FDB\u884C\u51CF\u7A0E\u3002`,
      ar: `**CAPE Authorization: \u0628\u062A\u0642\u062F\u064A\u0645 \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C\u060C \u0623\u0641\u0648\u0651\u0636 \u0635\u0627\u062D\u0628 \u0639\u0645\u0644\u064A \u0628\u062E\u0635\u0645 \u0627\u0644\u0645\u0628\u0644\u063A \u0627\u0644\u0645\u062D\u062F\u062F \u0645\u0646 \u0623\u0631\u0628\u0627\u062D\u064A \u0627\u0644\u0634\u0647\u0631\u064A\u0629 \u0643\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A SEIU Local 503, OPEU CAPE.  \u064A\u062A\u0645 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0637\u0648\u0639\u064B\u0627 \u0628\u0646\u0627\u0621\u064B \u0639\u0644\u0649 \u0641\u0647\u0645\u064A \u0627\u0644\u0645\u062D\u062F\u062F \u0644\u0645\u0627 \u064A\u0644\u064A:  \u0644\u0633\u062A \u0645\u0637\u0627\u0644\u0628\u064B\u0627 \u0628\u062A\u0648\u0642\u064A\u0639 \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C \u0623\u0648 \u062A\u0642\u062F\u064A\u0645 \u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0637\u0648\u0639\u064A\u0629 \u0625\u0644\u0649 SEIU CAPE \u0643\u0634\u0631\u0637 \u0644\u0644\u062A\u0648\u0638\u064A\u0641 \u0623\u0648 \u0627\u0644\u0639\u0636\u0648\u064A\u0629 \u0641\u064A \u0627\u0644\u0646\u0642\u0627\u0628\u0629\u061B  \u064A\u0645\u0643\u0646\u0646\u064A \u0631\u0641\u0636 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u062F\u0648\u0646 \u0627\u0646\u062A\u0642\u0627\u0645\u061B  \u0628\u0645\u0648\u062C\u0628 \u0627\u0644\u0642\u0627\u0646\u0648\u0646\u060C \u0644\u0627 \u064A\u062D\u0642 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A CAPE \u0625\u0644\u0627 \u0644\u0623\u0639\u0636\u0627\u0621 \u0627\u0644\u0646\u0642\u0627\u0628\u0627\u062A \u0648\u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0627\u0644\u062A\u0646\u0641\u064A\u0630\u064A\u064A\u0646/\u0627\u0644\u0625\u062F\u0627\u0631\u064A\u064A\u0646 \u0627\u0644\u0630\u064A\u0646 \u0647\u0645 \u0645\u0648\u0627\u0637\u0646\u0648\u0646 \u0623\u0645\u0631\u064A\u0643\u064A\u0648\u0646 \u0623\u0648 \u0645\u0642\u064A\u0645\u0648\u0646 \u062F\u0627\u0626\u0645\u0648\u0646 \u0642\u0627\u0646\u0648\u0646\u064A\u0648\u0646\u061B  \u0645\u0628\u0627\u0644\u063A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C \u0647\u064A \u0645\u062C\u0631\u062F \u0627\u0642\u062A\u0631\u0627\u062D\u0627\u062A\u060C \u0648\u064A\u0645\u0643\u0646\u0646\u064A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0628\u0623\u0643\u062B\u0631 \u0623\u0648 \u0623\u0642\u0644 \u0645\u0646 \u062E\u0644\u0627\u0644 \u0647\u0630\u0627 \u0627\u0644\u0648\u0633\u064A\u0644\u0629 \u0623\u0648 \u063A\u064A\u0631\u0647\u0627 \u062F\u0648\u0646 \u062E\u0648\u0641 \u0645\u0646 \u062A\u0641\u0636\u064A\u0644 \u0623\u0648 \u0636\u0631\u0631 \u0645\u0646 SEIU \u0623\u0648 \u0635\u0627\u062D\u0628 \u0639\u0645\u0644\u064A\u061B  \u062A\u0633\u062A\u062E\u062F\u0645 SEIU CAPE \u0627\u0644\u0623\u0645\u0648\u0627\u0644 \u0627\u0644\u062A\u064A \u062A\u062A\u0644\u0642\u0627\u0647\u0627 \u0644\u0623\u063A\u0631\u0627\u0636 \u0633\u064A\u0627\u0633\u064A\u0629\u060C \u0628\u0645\u0627 \u0641\u064A \u0630\u0644\u0643\u060C \u0639\u0644\u0649 \u0633\u0628\u064A\u0644 \u0627\u0644\u0645\u062B\u0627\u0644 \u0644\u0627 \u0627\u0644\u062D\u0635\u0631\u060C \u062A\u0642\u062F\u064A\u0645 \u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0648\u0646\u0641\u0642\u0627\u062A \u0646\u064A\u0627\u0628\u0629 \u0639\u0646 \u0645\u0631\u0634\u062D\u064A\u0646 \u0644\u0645\u0646\u0627\u0635\u0628 \u0641\u062F\u0631\u0627\u0644\u064A\u0629 \u0648\u0639\u0644\u0649 \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0648\u0644\u0627\u064A\u0629 \u0648\u0645\u062D\u0644\u064A\u0629\u060C \u0648\u0645\u0639\u0627\u0644\u062C\u0629 \u0642\u0636\u0627\u064A\u0627 \u0633\u064A\u0627\u0633\u064A\u0629 \u0630\u0627\u062A \u0623\u0647\u0645\u064A\u0629 \u0639\u0627\u0645\u0629.  \u064A\u0628\u0642\u0649 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0633\u0627\u0631\u064A\u064B\u0627 \u062D\u062A\u0649 \u0623\u0644\u063A\u064A\u0647 \u0643\u062A\u0627\u0628\u0629\u064B \u0639\u0628\u0631 \u0627\u0644\u0628\u0631\u064A\u062F \u0627\u0644\u0623\u0645\u0631\u064A\u0643\u064A \u0625\u0644\u0649 SEIU. \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0623\u0648 \u0627\u0644\u0647\u062F\u0627\u064A\u0627 \u0627\u0644\u0645\u0642\u062F\u0645\u0629 \u0625\u0644\u0649 SEIU Local 503, OPEU CAPE \u0644\u064A\u0633\u062A \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062E\u0635\u0645 \u0627\u0644\u0636\u0631\u064A\u0628\u064A \u0643\u062A\u0628\u0631\u0639\u0627\u062A \u062E\u064A\u0631\u064A\u0629.`,
      so: `**CAPE Authorization: Markaan gudbiyo foomkan, waxaan u fasaxayaa Loo-shaqeeyahayga inuu ka jaro dakhligayga bil kasta qadarka la cayimay, isagoo ah tabaruc loo dirayo SEIU Local 503, OPEU CAPE.  Oggolaanshahan waxaa loo bixinayaa si ikhtiyaari ah iyadoo ku salaysan fahamkayga gaarka ah ee ah:  Looma baahna inaan saxiixo foomkan ama aan SEIU CAPE ku sameeyo tabarucyo ikhtiyaari ah si ay shardi ugu noqoto shaqadayda ama xubinnimadayda ururka;  Waan diidi karaa inaan tabaruco anigoon la kulmin aargoosi;  Sida sharcigu dhigayo, kaliya xubnaha ururka iyo shaqaalaha fulinta/maamulka ee ah Muwaadiniin Maraykan ah ama deggeneyaal rasmi ah oo sharci ah ayaa xaq u leh inay ku tabarucaan CAPE;  Qadarrada tabaruca ee foomkan ku qoran waa talooyin keliya, waxaana ku tabaruci karaa wax ka badan ama ka yar anigoo adeegsanaya habkan ama hab kale, anigoon ka baqayn in SEIU ama loo-shaqeeyahaygu i siiyo doorbid ama khasaare;  SEIU CAPE waxay lacagta ay hesho u isticmaashaa ujeeddooyin siyaasadeed \u2014 oo ay ku jiraan, balse aan ku koobnayn, tabarucyo iyo kharashyo loogu talagalay murashaxiinta xafiisyada federaalka, gobolka, iyo degaanka \u2014 iyo wax ka qabashada arrimaha siyaasadeed ee muhiimka u ah dadweynaha.  Oggolaanshahan wuxuu sii jiri doonaa ilaa aan qoraal ahaan ugu noqdo anigoo boostada Maraykanka ugu diraya SEIU. Tabarucyada ama hadiyadaha loo diro SEIU Local 503, OPEU CAPE looma jari karo canshuur ahaan sida deeqo sadaqo ah.`
    },
    capeHeadline: {

      en: "Contribute to CAPE: Citizen Action for Political Education",
