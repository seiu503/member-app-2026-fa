      so: "Hadda waxaad iska diiwaangelisay inaad ku tabarucdo"
    },
    currentContribution2: {
      selector: '[data-cape-copy="currentContribution2"]',
      mode: "html",
      en: "per month. Would you like to increase your monthly contribution?",
      es: "mensual. \xBFLe gustar\xEDa aumentar su aporte mensual?",
      ru: "\u0432\u0437\u043D\u043E\u0441\u043E\u0432. \u0425\u043E\u0442\u0438\u0442\u0435 \u0443\u0432\u0435\u043B\u0438\u0447\u0438\u0442\u044C \u0435\u0436\u0435\u043C\u0435\u0441\u044F\u0447\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441?",
      vi: "theo th\xE1ng. Qu\xFD v\u1ECB c\xF3 mu\u1ED1n t\u0103ng kho\u1EA3n \u0111\xF3ng g\xF3p h\xE0ng th\xE1ng kh\xF4ng?",
      zh: "\u6BCF\u6708\u6350\u6B3E\u3002\u60A8\u60F3\u589E\u52A0\u6BCF\u6708\u6350\u6B3E\u989D\u5417\uFF1F",
      ar: "\u0634\u0647\u0631\u064A\u064B\u0627. \u0647\u0644 \u062A\u0631\u063A\u0628 \u0641\u064A \u0632\u064A\u0627\u062F\u0629 \u0645\u0633\u0627\u0647\u0645\u062A\u0643 \u0627\u0644\u0634\u0647\u0631\u064A\u0629\u061F",
      so: "bil kasta. Ma jeclaan lahayd inaad kordhiso tabarucaaga bil kasta?"
    },
    capeLegalCheckoff1: {
      selector: '[data-cape-copy="capeLegalCheckoff1"]',
      mode: "html",
      en: `By submitting this form, I hereby authorize my Employer to deduct the designated amount from my monthly earnings as a contribution to SEIU Local 503, OPEU CAPE.`,
      es: `Por medio del presente, y tras haber enviado este formulario, autorizo a mi Empleador a deducir de mis ganancias mensuales el monto designado como aporte al CAPE de SEIU Local 503, OPEU.`,
      ru: `\u041E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u044F \u044D\u0442\u0443 \u0444\u043E\u0440\u043C\u0443, \u044F \u0443\u043F\u043E\u043B\u043D\u043E\u043C\u043E\u0447\u0438\u0432\u0430\u044E \u0441\u0432\u043E\u0435\u0433\u043E \u0420\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044F \u0432\u044B\u0447\u0438\u0442\u0430\u0442\u044C \u0443\u043A\u0430\u0437\u0430\u043D\u043D\u0443\u044E \u0441\u0443\u043C\u043C\u0443 \u0438\u0437 \u043C\u043E\u0435\u0439 \u0435\u0436\u0435\u043C\u0435\u0441\u044F\u0447\u043D\u043E\u0439 \u0437\u0430\u0440\u0430\u0431\u043E\u0442\u043D\u043E\u0439 \u043F\u043B\u0430\u0442\u044B \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0432\u0437\u043D\u043E\u0441\u0430 \u0432 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437 SEIU Local 503, OPEU CAPE.`,
      vi: `B\u1EB1ng vi\u1EC7c g\u1EEDi bi\u1EC3u m\u1EABu n\xE0y, t\xF4i \u1EE7y quy\u1EC1n cho Ch\u1EE7 s\u1EED d\u1EE5ng lao \u0111\u1ED9ng c\u1EE7a m\xECnh chi\u1EBFt kh\u1EA5u m\u1ED9t kho\u1EA3n ch\u1EC9 \u0111\u1ECBnh t\u1EEB ti\u1EC1n l\u01B0\u01A1ng h\xE0ng th\xE1ng c\u1EE7a t\xF4i \u0111\u1EC3 l\xE0m kho\u1EA3n \u0111\xF3ng g\xF3p cho CAPE SEIU Local 503, OPEU.`,
      zh: "\u901A\u8FC7\u63D0\u4EA4\u6B64\u8868\u683C\uFF0C\u6211\u7279\u6B64\u6388\u6743\u6211\u7684\u96C7\u4E3B\u4ECE\u6211\u7684\u6708\u6536\u5165\u4E2D\u6263\u9664\u6307\u5B9A\u91D1\u989D\u4F5C\u4E3A\u672C\u4EBA\u5411 SEIU Local 503\uFF0COPEU CAPE \u7684\u6350\u6B3E\u3002",
      ar: `\u0628\u062A\u0642\u062F\u064A\u0645 \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C\u060C \u0623\u0641\u0648\u0651\u0636 \u0635\u0627\u062D\u0628 \u0639\u0645\u0644\u064A \u0628\u062E\u0635\u0645 \u0627\u0644\u0645\u0628\u0644\u063A \u0627\u0644\u0645\u062D\u062F\u062F \u0645\u0646 \u0623\u0631\u0628\u0627\u062D\u064A \u0627\u0644\u0634\u0647\u0631\u064A\u0629 \u0643\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A SEIU Local 503, OPEU CAPE.`,
      so: `Markaan gudbiyo foomkan, waxaan u fasaxayaa Loo-shaqeeyahayga inuu ka jaro dakhligayga bil kasta qadarka la cayimay, isagoo ah tabaruc loo dirayo SEIU Local 503, OPEU CAPE.`
    },
    capeLegalStripe1: {
      selector: '[data-cape-copy="capeLegalStripe1"]',
      mode: "html",
      en: "By submitting this form I am agreeing with the terms stated here:",
      es: "Al enviar este formulario, estoy aceptando los t\xE9rminos que se estipulan aqu\xED:",
      ru: "\u041E\u0442\u043F\u0440\u0430\u0432\u043B\u044F\u044F \u044D\u0442\u0443 \u0444\u043E\u0440\u043C\u0443, \u044F \u0441\u043E\u0433\u043B\u0430\u0448\u0430\u044E\u0441\u044C \u0441 \u0438\u0437\u043B\u043E\u0436\u0435\u043D\u043D\u044B\u043C\u0438 \u0437\u0434\u0435\u0441\u044C \u0443\u0441\u043B\u043E\u0432\u0438\u044F\u043C\u0438:",
      vi: "B\u1EB1ng vi\u1EC7c g\u1EEDi bi\u1EC3u m\u1EABu n\xE0y, t\xF4i \u0111\u1ED3ng \xFD v\u1EDBi c\xE1c \u0111i\u1EC1u kho\u1EA3n n\xEAu d\u01B0\u1EDBi \u0111\xE2y:",
      zh: "\u63D0\u4EA4\u6B64\u8868\u683C\u5373\u8868\u793A\u6211\u540C\u610F\u4EE5\u4E0B\u6240\u8FF0\u7684\u6761\u6B3E\uFF1A",
      ar: "\u0628\u062A\u0642\u062F\u064A\u0645 \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C\u060C \u0623\u0648\u0627\u0641\u0642 \u0639\u0644\u0649 \u0627\u0644\u0634\u0631\u0648\u0637 \u0627\u0644\u0645\u0630\u0643\u0648\u0631\u0629 \u0647\u0646\u0627:",
      so: "Markaan gudbiyo foomkan waxaan oggolaanayaa shuruudaha halkan ku qoran:"
    },
    capeLegal2: {
      selector: '[data-cape-copy="capeLegal2"]',
      mode: "html",
      en: `My contribution will be used to support member-endorsed candidates and for expenditures in connection with elections for Local, Legislative, Statewide, and Federal offices. These elected officials make critical decisions on salaries, health care, retirement, and other benefits and laws affecting SEIU Local 503, OPEU members. A portion of this contribution (as much as 48% for the average contributor) may be used by SEIU for federal elections.`,
      es: `Mi aporte se utilizar\xE1 para respaldar a los candidatos apoyados por los miembros y cubrir los gastos relacionados con las elecciones de cargos locales, legislativos, estatales y federales. Estos funcionarios elegidos toman decisiones fundamentales relativas a salarios, atenci\xF3n de salud, jubilaci\xF3n, y otros beneficios y leyes que afectan a los miembros de SEIU Local 503, OPEU. Es posible que SEIU utilice una parte de este aporte (aproximadamente el 48 % en el caso de contribuyentes promedio) para las elecciones federales.`,
      ru: `\u0414\u0430\u043D\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441 \u0431\u0443\u0434\u0435\u0442 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D \u043D\u0430 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0443 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u043E\u0432, \u043E\u0434\u043E\u0431\u0440\u0435\u043D\u043D\u044B\u0445 \u0447\u043B\u0435\u043D\u0430\u043C\u0438 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430, \u0438 \u0440\u0430\u0441\u0445\u043E\u0434\u044B, \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0435 \u0441 \u0432\u044B\u0431\u043E\u0440\u0430\u043C\u0438 \u0432 \u043C\u0435\u0441\u0442\u043D\u044B\u0435, \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0435, \u0440\u0435\u0433\u0438\u043E\u043D\u0430\u043B\u044C\u043D\u044B\u0435 \u0438 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B. \u0418\u0437\u0431\u0440\u0430\u043D\u043D\u044B\u0435 \u0434\u0435\u043F\u0443\u0442\u0430\u0442\u044B \u043F\u0440\u0438\u043D\u0438\u043C\u0430\u044E\u0442 \u0432\u0430\u0436\u043D\u044B\u0435 \u0440\u0435\u0448\u0435\u043D\u0438\u044F \u043F\u043E \u0432\u043E\u043F\u0440\u043E\u0441\u0430\u043C \u0440\u0430\u0437\u043C\u0435\u0440\u0430 \u0437\u0430\u0440\u0430\u0431\u043E\u0442\u043D\u043E\u0439 \u043F\u043B\u0430\u0442\u044B, \u0437\u0434\u0440\u0430\u0432\u043E\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F, \u043F\u0435\u043D\u0441\u0438\u043E\u043D\u043D\u043E\u0433\u043E \u043E\u0431\u0435\u0441\u043F\u0435\u0447\u0435\u043D\u0438\u044F \u0438 \u0434\u0440\u0443\u0433\u0438\u043C \u043B\u044C\u0433\u043E\u0442\u0430\u043C \u0438 \u0437\u0430\u043A\u043E\u043D\u0430\u043C, \u0438\u043C\u0435\u044E\u0449\u0438\u043C \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u0435 \u043A \u0447\u043B\u0435\u043D\u0430\u043C\u0438 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430 SEIU Local 503, OPEU. \u041F\u0440\u043E\u0444\u0441\u043E\u044E\u0437 SEIU \u043C\u043E\u0436\u0435\u0442 \u043D\u0430\u043F\u0440\u0430\u0432\u0438\u0442\u044C \u0447\u0430\u0441\u0442\u044C \u043D\u0430\u0441\u0442\u043E\u044F\u0449\u0435\u0433\u043E \u0432\u0437\u043D\u043E\u0441\u0430 (\u0430 \u0438\u043C\u0435\u043D\u043D\u043E 48 % \u0434\u043B\u044F \u0441\u0440\u0435\u0434\u043D\u0435\u0433\u043E \u043F\u043B\u0430\u0442\u0435\u043B\u044C\u0449\u0438\u043A\u0430 \u0432\u0437\u043D\u043E\u0441\u043E\u0432) \u043D\u0430 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u044B\u0435 \u0432\u044B\u0431\u043E\u0440\u044B.`,
      vi: `Kho\u1EA3n \u0111\xF3ng g\xF3p c\u1EE7a t\xF4i s\u1EBD d\xF9ng \u0111\u1EC3 h\u1ED7 tr\u1EE3 c\xE1c \u1EE9ng vi\xEAn \u0111\u01B0\u1EE3c th\xE0nh vi\xEAn ch\u1EA5p nh\u1EADn v\xE0 cho vi\u1EC7c chi ti\xEAu li\xEAn quan \u0111\u1EBFn vi\u1EC7c b\u1EA7u c\u1EED \u1EDF c\xE1c v\u0103n ph\xF2ng \u0110\u1ECBa ph\u01B0\u01A1ng, L\u1EADp ph\xE1p, To\xE0n ti\u1EC3u bang v\xE0 Li\xEAn bang. Nh\u1EEFng c\xF4ng ch\u1EE9c \u0111\u01B0\u1EE3c b\u1EA7u n\xE0y s\u1EBD \u0111\u01B0a ra c\xE1c quy\u1EBFt \u0111\u1ECBnh quan tr\u1ECDng v\u1EC1 l\u01B0\u01A1ng, d\u1ECBch v\u1EE5 ch\u0103m s\xF3c s\u1EE9c kh\u1ECFe, h\u01B0u tr\xED c\u0169ng nh\u01B0 ph\xFAc l\u1EE3i v\xE0 c\xE1c lu\u1EADt kh\xE1c \u1EA3nh h\u01B0\u1EDFng \u0111\u1EBFn th\xE0nh vi\xEAn c\u1EE7a SEIU Local 503, OPEU. SEIU c\xF3 th\u1EC3 d\xF9ng m\u1ED9t ph\u1EA7n \u0111\xF3ng g\xF3p n\xE0y (t\u1ED1i \u0111a trung b\xECnh 48%/ng\u01B0\u1EDDi \u0111\xF3ng g\xF3p) cho vi\u1EC7c b\u1EA7u c\u1EED li\xEAn bang.`,
      zh: `\u6211\u7684\u6350\u6B3E\u5C06\u7528\u4E8E\u652F\u6301\u6210\u5458\u8BA4\u53EF\u7684\u5019\u9009\u4EBA\u4EE5\u53CA\u4E0E\u5730\u65B9\u3001\u7ACB\u6CD5\u3001\u5168\u5DDE\u548C\u8054\u90A6\u529E\u4E8B\u5904\u9009\u4E3E\u6709\u5173\u7684\u652F\u51FA\u3002\u5F53\u9009\u5B98\u5458\u4F1A\u5C31\u5DE5\u8D44\u3001\u533B\u7597\u4FDD\u5065\u3001\u9000\u4F11\u4EE5\u53CA\u5176\u4ED6\u4F1A\u5F71\u54CD SEIU Local 503\uFF0COPEU \u4F1A\u5458\u7684\u798F\u5229\u548C\u6CD5\u5F8B\u505A\u51FA\u5173\u952E\u51B3\u7B56\u3002SEIU \u53EF\u5C06\u90E8\u5206\u6350\u6B3E\u91D1\u989D\uFF08\u591A\u8FBE\u5E73\u5747\u6350\u6B3E\u4EBA\u6240\u6350\u6B3E\u7684 48\uFF05\uFF09\u7528\u4E8E\u8054\u90A6\u9009\u4E3E\u3002`,
      ar: `\u0633\u062A\u064F\u0633\u062A\u062E\u062F\u0645 \u0645\u0633\u0627\u0647\u0645\u062A\u064A \u0644\u062F\u0639\u0645 \u0627\u0644\u0645\u0631\u0634\u062D\u064A\u0646 \u0627\u0644\u0630\u064A\u0646 \u064A\u0642\u0631\u0651\u0647\u0645 \u0627\u0644\u0623\u0639\u0636\u0627\u0621 \u0648\u0644\u0644\u0646\u0641\u0642\u0627\u062A \u0627\u0644\u0645\u062A\u0639\u0644\u0642\u0629 \u0628\u0627\u0646\u062A\u062E\u0627\u0628\u0627\u062A \u0627\u0644\u0645\u0646\u0627\u0635\u0628 \u0627\u0644\u0645\u062D\u0644\u064A\u0629 \u0648\u0627\u0644\u062A\u0634\u0631\u064A\u0639\u064A\u0629 \u0648\u0639\u0644\u0649 \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0648\u0644\u0627\u064A\u0629 \u0648\u0627\u0644\u0641\u062F\u0631\u0627\u0644\u064A\u0629. \u064A\u062A\u062E\u0630 \u0647\u0624\u0644\u0627\u0621 \u0627\u0644\u0645\u0633\u0624\u0648\u0644\u0648\u0646 \u0627\u0644\u0645\u0646\u062A\u062E\u0628\u0648\u0646 \u0642\u0631\u0627\u0631\u0627\u062A \u062D\u0627\u0633\u0645\u0629 \u0628\u0634\u0623\u0646 \u0627\u0644\u0631\u0648\u0627\u062A\u0628 \u0648\u0627\u0644\u0631\u0639\u0627\u064A\u0629 \u0627\u0644\u0635\u062D\u064A\u0629 \u0648\u0627\u0644\u062A\u0642\u0627\u0639\u062F \u0648\u063A\u064A\u0631\u0647\u0627 \u0645\u0646 \u0627\u0644\u0645\u0632\u0627\u064A\u0627 \u0648\u0627\u0644\u0642\u0648\u0627\u0646\u064A\u0646 \u0627\u0644\u062A\u064A \u062A\u0624\u062B\u0631 \u0639\u0644\u0649 \u0623\u0639\u0636\u0627\u0621 SEIU Local 503, OPEU. \u0642\u062F \u062A\u0633\u062A\u062E\u062F\u0645 SEIU \u062C\u0632\u0621\u064B\u0627 \u0645\u0646 \u0647\u0630\u0647 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629\u060C \u064A\u0635\u0644 \u0625\u0644\u0649 48% \u0644\u0644\u0645\u0633\u0627\u0647\u0645 \u0627\u0644\u0645\u062A\u0648\u0633\u0637\u060C \u0641\u064A \u0627\u0644\u0627\u0646\u062A\u062E\u0627\u0628\u0627\u062A \u0627\u0644\u0641\u062F\u0631\u0627\u0644\u064A\u0629.`,
      so: `Tabarucayga waxaa loo isticmaali doonaa taageeridda murashaxiinta ay xubnuhu ansixiyeen iyo kharashaadka la xiriira doorashooyinka xafiisyada degaanka, sharci-dejinta, gobolka oo dhan, iyo federaalka. Mas\u2019uuliyiintan la doortay waxay go\u2019aanno muhiim ah ka gaaraan mushaharka, daryeelka caafimaadka, hawlgabka, iyo dheefaha iyo sharciyada kale ee saameeya xubnaha SEIU Local 503, OPEU. Qayb ka mid ah tabarucan, ilaa 48% celcelis ahaan tabaruc-bixiyaha, waxaa SEIU u isticmaali kartaa doorashooyinka federaalka.`
    },
    capeLegal3: {
      selector: '[data-cape-copy="capeLegal3"]',
      mode: "html",
      en: `The contribution amounts indicated above are only suggestions and I may choose not to contribute or to vary my contribution amount without reprisal from my Union or my Employer.`,
      es: `Los montos del aporte que se indicaron anteriormente solo son sugerencias, de modo que puedo abstenerme de aportar o cambiar el monto sin que esto suponga represalias por parte de mi Uni\xF3n o mi Empleador.`,
      ru: `\u0423\u043A\u0430\u0437\u0430\u043D\u043D\u044B\u0435 \u0441\u0443\u043C\u043C\u044B \u0432\u0437\u043D\u043E\u0441\u043E\u0432 \u043D\u043E\u0441\u044F\u0442 \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0445\u0430\u0440\u0430\u043A\u0442\u0435\u0440, \u044F \u043C\u043E\u0433\u0443 \u043D\u0435 \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0432\u0437\u043D\u043E\u0441 \u0438\u043B\u0438 \u0438\u0437\u043C\u0435\u043D\u044F\u0442\u044C \u0435\u0433\u043E \u0440\u0430\u0437\u043C\u0435\u0440 \u0431\u0435\u0437 \u0443\u0433\u0440\u043E\u0437\u044B \u043F\u0440\u0438\u043D\u044F\u0442\u0438\u044F \u043E\u0442\u0432\u0435\u0442\u043D\u044B\u0445 \u043C\u0435\u0440 \u0441\u043E \u0441\u0442\u043E\u0440\u043E\u043D\u044B \u043C\u043E\u0435\u0433\u043E \u041F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430 \u0438\u043B\u0438 \u0420\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044F.`,
      vi: `Kho\u1EA3n \u0111\xF3ng g\xF3p n\xEAu tr\xEAn ch\u1EC9 l\xE0 \u0111\u1EC1 xu\u1EA5t v\xE0 t\xF4i c\xF3 th\u1EC3 ch\u1ECDn kh\xF4ng \u0111\xF3ng g\xF3p ho\u1EB7c thay \u0111\u1ED5i kho\u1EA3n \u0111\xF3ng g\xF3p m\xE0 kh\xF4ng b\u1ECB C\xF4ng \u0111o\xE0n ho\u1EB7c Ch\u1EE7 s\u1EED d\u1EE5ng lao \u0111\u1ED9ng c\u1EE7a m\xECnh tr\u1EA3 \u0111\u0169a.`,
      zh: "\u4E0A\u8FF0\u6350\u6B3E\u91D1\u989D\u4EC5\u4E3A\u5EFA\u8BAE\uFF0C\u6211\u53EF\u4EE5\u9009\u62E9\u4E0D\u6350\u6B3E\u6216\u66F4\u6539\u6211\u7684\u6350\u6B3E\u91D1\u989D\uFF0C\u800C\u4E0D\u4F1A\u88AB\u5DE5\u4F1A\u6216\u96C7\u4E3B\u62A5\u590D\u3002",
      ar: `\u0645\u0628\u0627\u0644\u063A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0627\u0644\u0645\u0634\u0627\u0631 \u0625\u0644\u064A\u0647\u0627 \u0623\u0639\u0644\u0627\u0647 \u0647\u064A \u0645\u062C\u0631\u062F \u0627\u0642\u062A\u0631\u0627\u062D\u0627\u062A\u060C \u0648\u064A\u0645\u0643\u0646\u0646\u064A \u0627\u062E\u062A\u064A\u0627\u0631 \u0639\u062F\u0645 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0623\u0648 \u062A\u063A\u064A\u064A\u0631 \u0645\u0628\u0644\u063A \u0645\u0633\u0627\u0647\u0645\u062A\u064A \u062F\u0648\u0646 \u0623\u064A \u0627\u0646\u062A\u0642\u0627\u0645 \u0645\u0646 \u0646\u0642\u0627\u0628\u062A\u064A \u0623\u0648 \u0635\u0627\u062D\u0628 \u0639\u0645\u0644\u064A.`,
      so: `Qadarrada tabaruca ee kor ku xusan waa talooyin keliya, waxaana dooran karaa inaanan tabarucin ama inaan beddelo qadarka tabarucayga anigoon ka baqayn aargoosi ka yimaada Ururkayga ama Loo-shaqeeyahayga.`
    },
    capeLegal4: {
      selector: '[data-cape-copy="capeLegal4"]',
      mode: "html",
      en: `Federal law states that only represented workers and executive/administrative staff who are U.S. citizens or lawful permanent residents are eligible to contribute to CAPE.`,
      es: `La ley federal declara que solo los trabajadores representados y el personal administrativo/ejecutivo que sean ciudadanos de los EE. UU. o residentes permanentes legales son elegibles para aportar al CAPE.`,
      ru: `\u0412 \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0438 \u0441 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u044B\u043C \u0437\u0430\u043A\u043E\u043D\u043E\u043C, \u0432\u0437\u043D\u043E\u0441\u044B \u0432 CAPE (\u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0441\u043A\u043E\u0435 \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0435 \u0437\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043F\u0440\u043E\u0441\u0432\u0435\u0449\u0435\u043D\u0438\u0435) \u043C\u043E\u0433\u0443\u0442 \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u0440\u0430\u0431\u043E\u0442\u043D\u0438\u043A\u0438 \u0441 \u043F\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u0438\u0442\u0435\u043B\u044C\u0441\u0442\u0432\u043E\u043C \u0432 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0435 \u0438 \u0447\u043B\u0435\u043D\u044B \u0438\u0441\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0445 \u043A\u043E\u043C\u0438\u0442\u0435\u0442\u043E\u0432 / \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043D\u044B\u0439 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B, \u044F\u0432\u043B\u044F\u044E\u0449\u0438\u0435\u0441\u044F \u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0430\u043C\u0438 \u0438\u043B\u0438 \u0437\u0430\u043A\u043E\u043D\u043D\u044B\u043C\u0438 \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u044B\u043C\u0438 \u0440\u0435\u0437\u0438\u0434\u0435\u043D\u0442\u0430\u043C\u0438 \u0421\u0428\u0410.`,
      vi: `Lu\u1EADt li\xEAn bang quy \u0111\u1ECBnh r\u1EB1ng ch\u1EC9 c\xF3 ng\u01B0\u1EDDi lao \u0111\u1ED9ng \u0111\u01B0\u1EE3c \u0111\u1EA1i di\u1EC7n, nh\xE2n vi\xEAn \u0111i\u1EC1u h\xE0nh/qu\u1EA3n tr\u1ECB l\xE0 th\u01B0\u1EDDng tr\xFA nh\xE2n h\u1EE3p ph\xE1p ho\u1EB7c c\xF4ng d\xE2n Hoa K\u1EF3 m\u1EDBi \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\xF3ng g\xF3p v\xE0o CAPE.`,
      zh: "\u6839\u636E\u8054\u90A6\u6CD5\u5F8B\u7684\u89C4\u5B9A\uFF0C\u53EA\u6709\u4EE3\u8868\u7F8E\u56FD\u516C\u6C11\u6216\u5408\u6CD5\u6C38\u4E45\u5C45\u6C11\u7684\u5DE5\u4F1A\u5DE5\u4EBA\u548C\u884C\u653F\u4EBA\u5458\u624D\u6709\u8D44\u683C\u5411 CAPE \u6350\u6B3E\u3002",
      ar: `\u064A\u0646\u0635 \u0627\u0644\u0642\u0627\u0646\u0648\u0646 \u0627\u0644\u0641\u062F\u0631\u0627\u0644\u064A \u0639\u0644\u0649 \u0623\u0646 \u0627\u0644\u0639\u0645\u0627\u0644 \u0627\u0644\u0645\u0645\u062B\u0651\u064E\u0644\u064A\u0646 \u0648\u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0627\u0644\u062A\u0646\u0641\u064A\u0630\u064A\u064A\u0646/\u0627\u0644\u0625\u062F\u0627\u0631\u064A\u064A\u0646 \u0627\u0644\u0630\u064A\u0646 \u0647\u0645 \u0645\u0648\u0627\u0637\u0646\u0648\u0646 \u0623\u0645\u0631\u064A\u0643\u064A\u0648\u0646 \u0623\u0648 \u0645\u0642\u064A\u0645\u0648\u0646 \u062F\u0627\u0626\u0645\u0648\u0646 \u0642\u0627\u0646\u0648\u0646\u064A\u0648\u0646 \u0641\u0642\u0637 \u0645\u0624\u0647\u0644\u0648\u0646 \u0644\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A CAPE.`,
      so: `Sharciga federaalku wuxuu dhigaya in kaliya shaqaalaha matalaad haysta iyo shaqaalaha fulinta/maamulka ee ah muwaadiniin Maraykan ah ama deggeneyaal rasmi ah oo sharci ah ay xaq u leeyihiin inay ku tabarucaan CAPE.`
    },
    capeLegal5: {
      selector: '[data-cape-copy="capeLegal5"]',
      mode: "html",
      en: `This authorization is made voluntarily and is not a condition of my employment or membership in the union.`,
      es: `Esta autorizaci\xF3n es voluntaria y no supone una condici\xF3n para mantener mi empleo o membres\xEDa en la Uni\xF3n.`,
      ru: `\u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0430\u044F \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043F\u043E\u043B\u043D\u043E\u043C\u043E\u0447\u0438\u0439 \u043E\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u043D\u0430 \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u043D\u043E\u0439 \u043E\u0441\u043D\u043E\u0432\u0435 \u0438 \u043D\u0435 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0443\u0441\u043B\u043E\u0432\u0438\u0435\u043C \u043C\u043E\u0435\u0433\u043E \u043F\u0440\u0438\u043D\u044F\u0442\u0438\u044F \u043D\u0430 \u0440\u0430\u0431\u043E\u0442\u0443 \u0438\u043B\u0438 \u0432 \u0447\u043B\u0435\u043D\u044B \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430.`,
      vi: `Vi\u1EC7c \u1EE7y quy\u1EC1n n\xE0y l\xE0 t\u1EF1 nguy\u1EC7n v\xE0 kh\xF4ng ph\u1EA3i \u0111i\u1EC1u ki\u1EC7n c\u1EE7a c\xF4ng vi\u1EC7c hay t\u01B0 c\xE1ch th\xE0nh vi\xEAn c\u1EE7a t\xF4i trong c\xF4ng \u0111o\xE0n.`,
      zh: "\u8BE5\u6388\u6743\u662F\u6211\u81EA\u613F\u4F5C\u51FA\u7684\uFF0C\u4E0D\u662F\u6211\u5C31\u4E1A\u6216\u52A0\u5165\u5DE5\u4F1A\u7684\u6761\u4EF6\u3002",
      ar: "\u064A\u062A\u0645 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0637\u0648\u0639\u064B\u0627 \u0648\u0644\u064A\u0633 \u0634\u0631\u0637\u064B\u0627 \u0644\u0644\u062A\u0648\u0638\u064A\u0641 \u0623\u0648 \u0627\u0644\u0639\u0636\u0648\u064A\u0629 \u0641\u064A \u0627\u0644\u0646\u0642\u0627\u0628\u0629.",
      so: `Oggolaanshahan waxaa loo bixinayaa si ikhtiyaari ah mana aha shardi shaqadayda ama xubinnimadayda ururka.`
    },
    capeLegal6: {
      selector: '[data-cape-copy="capeLegal6"]',
      mode: "html",
      en: `This authorization shall remain in effect until revoked in writing by me. This contribution is in addition to dues and existing contributions through payroll deduction/ACH transfer. This contribution is not deductible for federal income tax purposes.`,
      es: `Esta autorizaci\xF3n permanecer\xE1 vigente hasta que yo mismo la revoque por escrito. Este aporte es adicional a las cuotas y aportes existentes que se deduzcan de la n\xF3mina/transferencia ACH. Este aporte no es deducible para efectos del impuesto federal sobre la renta.`,
      ru: `\u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0430\u044F \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043F\u043E\u043B\u043D\u043E\u043C\u043E\u0447\u0438\u0439 \u0441\u043E\u0445\u0440\u0430\u043D\u044F\u0435\u0442 \u0437\u0430\u043A\u043E\u043D\u043D\u0443\u044E \u0441\u0438\u043B\u0443 \u0434\u043E \u0441\u0432\u043E\u0435\u0439 \u043E\u0442\u043C\u0435\u043D\u044B, \u043E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u043D\u043E\u0439 \u043C\u043D\u043E\u044E \u0432 \u043F\u0438\u0441\u044C\u043C\u0435\u043D\u043D\u043E\u043C \u0432\u0438\u0434\u0435. \u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0439 \u0432\u0437\u043D\u043E\u0441 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0434\u043E\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0435\u043C \u043A \u043E\u0442\u0447\u0438\u0441\u043B\u0435\u043D\u0438\u044F\u043C \u0438 \u0432\u0437\u043D\u043E\u0441\u0430\u043C, \u043F\u0435\u0440\u0435\u0447\u0438\u0441\u043B\u044F\u0435\u043C\u044B\u043C \u043F\u0443\u0442\u0435\u043C \u0432\u044B\u0447\u0435\u0442\u0430 \u0438\u0437 \u0437\u0430\u0440\u043F\u043B\u0430\u0442\u044B / \u043F\u0435\u0440\u0435\u0432\u043E\u0434\u0430 ACH. \u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0439 \u0432\u0437\u043D\u043E\u0441 \u043D\u0435 \u043F\u043E\u0434\u043B\u0435\u0436\u0438\u0442 \u0432\u044B\u0447\u0435\u0442\u0443 \u0438\u0437 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u043E\u0433\u043E \u043D\u0430\u043B\u043E\u0433\u0430 \u043D\u0430 \u043F\u0440\u0438\u0431\u044B\u043B\u044C.`,
      vi: `Vi\u1EC7c \u1EE7y quy\u1EC1n n\xE0y s\u1EBD v\u1EABn c\xF3 hi\u1EC7u l\u1EF1c cho \u0111\u1EBFn khi t\xF4i h\u1EE7y b\u1ECF b\u1EB1ng v\u0103n b\u1EA3n. Kho\u1EA3n \u0111\xF3ng g\xF3p n\xE0y kh\xE1c v\u1EDBi kho\u1EA3n thu\u1EBF v\xE0 c\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p hi\u1EC7n t\u1EA1i th\xF4ng qua h\xECnh th\u1EE9c chi\u1EBFt kh\u1EA5u l\u01B0\u01A1ng/chuy\u1EC3n ACH. Kho\u1EA3n \u0111\xF3ng g\xF3p n\xE0y kh\xF4ng nh\u1EB1m m\u1EE5c \u0111\xEDch kh\u1EA5u tr\u1EEB thu\u1EBF thu nh\u1EADp li\xEAn bang.`,
      zh: "\u8BE5\u6388\u6743\u5728\u6211\u901A\u8FC7\u4E66\u9762\u5F62\u5F0F\u64A4\u9500\u524D\u5C06\u4E00\u76F4\u6709\u6548\u3002\u6B64\u6350\u6B3E\u662F\u901A\u8FC7\u85AA\u8D44\u6263\u9664/ACH \u8F6C\u8D26\u6765\u652F\u4ED8\u4F1A\u8D39\u548C\u73B0\u6709\u6350\u6B3E\u7684\u8865\u5145\u3002\u6B64\u6350\u6B3E\u4E0D\u53EF\u4ECE\u8054\u90A6\u6240\u5F97\u7A0E\u4E2D\u6263\u9664\u3002",
      ar: `\u064A\u0628\u0642\u0649 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0633\u0627\u0631\u064A\u064B\u0627 \u062D\u062A\u0649 \u0623\u0644\u063A\u064A\u0647 \u0643\u062A\u0627\u0628\u0629\u064B. \u0647\u0630\u0647 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0627\u0644\u0631\u0633\u0648\u0645 \u0648\u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0627\u0644\u062D\u0627\u0644\u064A\u0629 \u0645\u0646 \u062E\u0644\u0627\u0644 \u062E\u0635\u0645 \u0627\u0644\u0631\u0648\u0627\u062A\u0628/\u062A\u062D\u0648\u064A\u0644 ACH. \u0647\u0630\u0647 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u063A\u064A\u0631 \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062E\u0635\u0645 \u0644\u0623\u063A\u0631\u0627\u0636 \u0636\u0631\u064A\u0628\u0629 \u0627\u0644\u062F\u062E\u0644 \u0627\u0644\u0641\u062F\u0631\u0627\u0644\u064A\u0629.`,
      so: `Oggolaanshahan wuxuu sii jiri doonaa ilaa aan qoraal ahaan uga noqdo. Tabarucan waa mid dheeraad ka ah lacagaha xubinnimada iyo tabarucyada hadda jira ee laga jaro mushaharka/wareejinta ACH. Tabarucan looma jari karo canshuurta dakhliga federaalka.`
    },
    communityCAPE2022: {
      selector: '[data-cape-copy="communityCAPE2022"]',
      mode: "html",
      en: `This contribution qualifies for the Oregon Political Tax Credit. Single filers are eligible for a credit up to $50/year; joint filers up to $100 per year. Contributions of $5.00 per month or more qualify for CAPE Community Membership. I authorize SEIU Local 503 to make withdrawals in the amount indicated above from my checking account, savings account or credit card, after confirmation of my account information, in accordance with the authorization provided for Community membership. This authorization is made voluntarily and is not a condition of my membership in the Union. The contribution amounts indicated above are only suggestions and I may choose not to contribute or to vary my contribution amount without reprisal SEIU Local 503.  My contribution will be used to support CAPE and COPE -endorsed candidates and for expenditures in connection with elections for Federal, Local, Legislative, and Statewide offices. These elected officials make critical decisions on salaries, health care, retirement and other benefits and laws affecting our communities. A portion of my contribution may also be used by the SEIU Committee on Political Education (SEIU \u201CCOPE\u201D).  As per federal law, only union members and union executive/administrative staff who are U.S. citizens or lawful permanent residents are eligible to contribute to SEIU COPE. This authorization shall remain in effect until revoked in writing by me. This contribution is in addition to membership dues. Contributions or gifts to SEIU CAPE are not tax deductible as charitable contributions.`,
      es: `Este aporte cumple con los requisitos del cr\xE9dito fiscal de Oreg\xF3n. Los (las) declarantes solteros(as) son elegibles para recibir un cr\xE9dito anual de hasta $50; mientras que los (las) declarantes conjuntos(as) pueden recibir hasta $100 anuales. Los aportes de $5.00 al mes o m\xE1s cumplen con los requisitos para la membres\xEDa comunitaria de la Acci\xF3n Ciudadana en Favor de la Educaci\xF3n Pol\xEDtica (por su sigla en ingl\xE9s CAPE). Autorizo a SEIU Local 503 para que realice retiros por el monto indicado anteriormente de mi cuenta corriente, cuenta de ahorros o tarjeta de cr\xE9dito, luego de confirmar la informaci\xF3n de mi cuenta, de conformidad con la autorizaci\xF3n que proporcion\xE9 anteriormente en la Secci\xF3n\xA02. Esta autorizaci\xF3n es voluntaria y no supone una condici\xF3n para mantener mi membres\xEDa en la Uni\xF3n. Los montos del aporte que se indicaron anteriormente solo son sugerencias, de modo que puedo abstenerme de aportar o cambiar el monto sin que esto suponga represalias por parte de SEIU Local 503.  Mi aporte se utilizar\xE1 para respaldar a los (las) candidatos(as) apoyados(as) por la CAPE y el Comit\xE9 sobre Educaci\xF3n Pol\xEDtica (por su sigla en ingl\xE9s COPE) y cubrir los gastos relacionados con las elecciones de cargos federales, locales, legislativos y estatales. Estos(as) funcionarios(as) elegidos(as) toman decisiones fundamentales relativas a salarios, atenci\xF3n de salud, jubilaci\xF3n y otros beneficios y leyes que afectan a nuestras comunidades. Una parte de mi aporte tambi\xE9n se puede destinar para el Comit\xE9 sobre Educaci\xF3n Pol\xEDtica de SEIU (COPE de SEIU).  En virtud de la ley federal, solo los (las) miembros de la uni\xF3n y el personal administrativo/ejecutivo de la misma que sean ciudadanos(as) de los EE.\xA0UU. o residentes permanentes legales son elegibles para aportar al COPE de SEIU. Esta autorizaci\xF3n permanecer\xE1 vigente hasta que yo la revoque por escrito. Este aporte es adicional a las cuotas de la membres\xEDa. Los aportes u obsequios a la CAPE de SEIU no son deducibles de impuestos como aportes ben\xE9ficos.`,
      ru: `\u0414\u0430\u043D\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441 \u043F\u043E\u0434\u043F\u0430\u0434\u0430\u0435\u0442 \u043F\u043E\u0434 \u043D\u0430\u043B\u043E\u0433\u043E\u0432\u0443\u044E \u043B\u044C\u0433\u043E\u0442\u0443 \u0448\u0442\u0430\u0442\u0430 \u041E\u0440\u0435\u0433\u043E\u043D \u0437\u0430 \u0432\u0437\u043D\u043E\u0441\u044B \u043D\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0446\u0435\u043B\u0438. \u041F\u0440\u0438 \u0435\u0434\u0438\u043D\u043E\u043B\u0438\u0447\u043D\u043E\u0439 \u043F\u043E\u0434\u0430\u0447\u0435 \u0437\u0430\u044F\u0432\u043B\u0435\u043D\u0438\u044F \u0440\u0430\u0437\u043C\u0435\u0440 \u043B\u044C\u0433\u043E\u0442\u044B \u043C\u043E\u0436\u0435\u0442 \u0434\u043E\u0441\u0442\u0438\u0433\u0430\u0442\u044C $50 \u0432 \u0433\u043E\u0434, \u043F\u0440\u0438 \u0441\u043E\u0432\u043C\u0435\u0441\u0442\u043D\u043E\u0439 \u043F\u043E\u0434\u0430\u0447\u0435 \u2014 $100 \u0432 \u0433\u043E\u0434. \u0412\u0437\u043D\u043E\u0441\u044B \u0432 \u0440\u0430\u0437\u043C\u0435\u0440\u0435 $5,00 \u0432 \u043C\u0435\u0441\u044F\u0446 \u0438 \u0431\u043E\u043B\u0435\u0435 \u0434\u0430\u044E\u0442 \u043F\u0440\u0430\u0432\u043E \u043D\u0430 \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u0435 \u0441\u0442\u0430\u0442\u0443\u0441\u0430 \u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0433\u043E \u0447\u043B\u0435\u043D\u0430 CAPE. \u042F \u0440\u0430\u0437\u0440\u0435\u0448\u0430\u044E SEIU Local 503 \u043F\u0440\u043E\u0438\u0437\u0432\u043E\u0434\u0438\u0442\u044C \u0441\u043D\u044F\u0442\u0438\u0435 \u0441\u0440\u0435\u0434\u0441\u0442\u0432 \u0432 \u0443\u043A\u0430\u0437\u0430\u043D\u043D\u043E\u0439 \u0432\u044B\u0448\u0435 \u0441\u0443\u043C\u043C\u0435 \u0441 \u043C\u043E\u0435\u0433\u043E \u0440\u0430\u0441\u0447\u0435\u0442\u043D\u043E\u0433\u043E \u0441\u0447\u0435\u0442\u0430, \u0441\u0431\u0435\u0440\u0435\u0433\u0430\u0442\u0435\u043B\u044C\u043D\u043E\u0433\u043E \u0441\u0447\u0435\u0442\u0430 \u0438\u043B\u0438 \u043A\u0440\u0435\u0434\u0438\u0442\u043D\u043E\u0439 \u043A\u0430\u0440\u0442\u044B \u043F\u043E\u0441\u043B\u0435 \u043F\u043E\u0434\u0442\u0432\u0435\u0440\u0436\u0434\u0435\u043D\u0438\u044F \u0438\u043D\u0444\u043E\u0440\u043C\u0430\u0446\u0438\u0438 \u043E \u043C\u043E\u0435\u043C \u0441\u0447\u0435\u0442\u0435 \u0432 \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0438 \u0441 \u0440\u0430\u0437\u0440\u0435\u0448\u0435\u043D\u0438\u0435\u043C, \u043F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u043B\u0435\u043D\u043D\u044B\u043C \u0432 \u0420\u0430\u0437\u0434\u0435\u043B\u0435 2 \u0432\u044B\u0448\u0435. \u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0430\u044F \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043F\u043E\u043B\u043D\u043E\u043C\u043E\u0447\u0438\u0439 \u043E\u0441\u0443\u0449\u0435\u0441\u0442\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u043D\u0430 \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u043D\u043E\u0439 \u043E\u0441\u043D\u043E\u0432\u0435 \u0438 \u043D\u0435 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0443\u0441\u043B\u043E\u0432\u0438\u0435\u043C \u043C\u043E\u0435\u0433\u043E \u043F\u0440\u0438\u043D\u044F\u0442\u0438\u044F \u0432 \u0447\u043B\u0435\u043D\u044B \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430. \u0423\u043A\u0430\u0437\u0430\u043D\u043D\u044B\u0435 \u0441\u0443\u043C\u043C\u044B \u0432\u0437\u043D\u043E\u0441\u043E\u0432 \u043D\u043E\u0441\u044F\u0442 \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0439 \u0445\u0430\u0440\u0430\u043A\u0442\u0435\u0440, \u044F \u043C\u043E\u0433\u0443 \u043D\u0435 \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0432\u0437\u043D\u043E\u0441 \u0438\u043B\u0438 \u0438\u0437\u043C\u0435\u043D\u044F\u0442\u044C \u0435\u0433\u043E \u0440\u0430\u0437\u043C\u0435\u0440 \u0431\u0435\u0437 \u0443\u0433\u0440\u043E\u0437\u044B \u043F\u0440\u0438\u043D\u044F\u0442\u0438\u044F \u043E\u0442\u0432\u0435\u0442\u043D\u044B\u0445 \u043C\u0435\u0440 \u0441\u043E \u0441\u0442\u043E\u0440\u043E\u043D\u044B SEIU Local 503.  \u0414\u0430\u043D\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441 \u0431\u0443\u0434\u0435\u0442 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D \u043D\u0430 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0443 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u043E\u0432, \u043E\u0434\u043E\u0431\u0440\u0435\u043D\u043D\u044B\u0445 CAPE \u0438 COPE, \u0438 \u0440\u0430\u0441\u0445\u043E\u0434\u044B, \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0435 \u0441 \u0432\u044B\u0431\u043E\u0440\u0430\u043C\u0438 \u0432 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u044B\u0435, \u043C\u0435\u0441\u0442\u043D\u044B\u0435, \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0438 \u043E\u0440\u0433\u0430\u043D\u044B \u0448\u0442\u0430\u0442\u0430. \u0418\u0437\u0431\u0440\u0430\u043D\u043D\u044B\u0435 \u0434\u0435\u043F\u0443\u0442\u0430\u0442\u044B \u043F\u0440\u0438\u043D\u0438\u043C\u0430\u044E\u0442 \u0432\u0430\u0436\u043D\u044B\u0435 \u0440\u0435\u0448\u0435\u043D\u0438\u044F \u043F\u043E \u0432\u043E\u043F\u0440\u043E\u0441\u0430\u043C \u0440\u0430\u0437\u043C\u0435\u0440\u0430 \u0437\u0430\u0440\u0430\u0431\u043E\u0442\u043D\u043E\u0439 \u043F\u043B\u0430\u0442\u044B, \u0437\u0434\u0440\u0430\u0432\u043E\u043E\u0445\u0440\u0430\u043D\u0435\u043D\u0438\u044F, \u043F\u0435\u043D\u0441\u0438\u043E\u043D\u043D\u043E\u0433\u043E \u043E\u0431\u0435\u0441\u043F\u0435\u0447\u0435\u043D\u0438\u044F \u0438 \u0434\u0440\u0443\u0433\u0438\u043C \u043B\u044C\u0433\u043E\u0442\u0430\u043C \u0438 \u0437\u0430\u043A\u043E\u043D\u0430\u043C, \u0438\u043C\u0435\u044E\u0449\u0438\u043C \u043E\u0442\u043D\u043E\u0448\u0435\u043D\u0438\u0435 \u043A \u043D\u0430\u0448\u0438\u043C \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0430\u043C. \u0427\u0430\u0441\u0442\u044C \u043C\u043E\u0435\u0433\u043E \u0432\u0437\u043D\u043E\u0441\u0430 \u0442\u0430\u043A\u0436\u0435 \u043C\u043E\u0436\u0435\u0442 \u0431\u044B\u0442\u044C \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u043D\u0430 \u041A\u043E\u043C\u0438\u0442\u0435\u0442\u043E\u043C SEIU \u043F\u043E \u0432\u043E\u043F\u0440\u043E\u0441\u0430\u043C \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F (SEIU COPE).  \u0412 \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0438\u0438 \u0441 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u044B\u043C \u0437\u0430\u043A\u043E\u043D\u043E\u043C, \u0432\u0437\u043D\u043E\u0441\u044B \u0432 SEIU COPE \u043C\u043E\u0433\u0443\u0442 \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0442\u043E\u043B\u044C\u043A\u043E \u0447\u043B\u0435\u043D\u044B \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u043E\u0432 \u0438 \u0447\u043B\u0435\u043D\u044B \u0438\u0441\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0445 \u043A\u043E\u043C\u0438\u0442\u0435\u0442\u043E\u0432 / \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043D\u044B\u0439 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u043E\u0432, \u044F\u0432\u043B\u044F\u044E\u0449\u0438\u0435\u0441\u044F \u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0430\u043C\u0438 \u0438\u043B\u0438 \u0437\u0430\u043A\u043E\u043D\u043D\u044B\u043C\u0438 \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u044B\u043C\u0438 \u0440\u0435\u0437\u0438\u0434\u0435\u043D\u0442\u0430\u043C\u0438 \u0421\u0428\u0410. \u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0430\u044F \u043F\u0435\u0440\u0435\u0434\u0430\u0447\u0430 \u043F\u043E\u043B\u043D\u043E\u043C\u043E\u0447\u0438\u0439 \u0441\u043E\u0445\u0440\u0430\u043D\u044F\u0435\u0442 \u0437\u0430\u043A\u043E\u043D\u043D\u0443\u044E \u0441\u0438\u043B\u0443 \u0434\u043E \u0441\u0432\u043E\u0435\u0439 \u043E\u0442\u043C\u0435\u043D\u044B, \u043E\u0444\u043E\u0440\u043C\u043B\u0435\u043D\u043D\u043E\u0439 \u043C\u043D\u043E\u044E \u0432 \u043F\u0438\u0441\u044C\u043C\u0435\u043D\u043D\u043E\u043C \u0432\u0438\u0434\u0435. \u041D\u0430\u0441\u0442\u043E\u044F\u0449\u0438\u0439 \u0432\u0437\u043D\u043E\u0441 \u044F\u0432\u043B\u044F\u0435\u0442\u0441\u044F \u0434\u043E\u043F\u043E\u043B\u043D\u0435\u043D\u0438\u0435\u043C \u043A \u0447\u043B\u0435\u043D\u0441\u043A\u043E\u043C\u0443 \u0432\u0437\u043D\u043E\u0441\u0443. \u0412\u0437\u043D\u043E\u0441\u044B \u0438 \u043F\u043E\u0434\u0430\u0440\u043A\u0438 \u0432 SEIU CAPE \u043D\u0435 \u043F\u043E\u0434\u043B\u0435\u0436\u0430\u0442 \u043D\u0430\u043B\u043E\u0433\u043E\u043E\u0431\u043B\u043E\u0436\u0435\u043D\u0438\u044E \u043A\u0430\u043A \u0431\u043B\u0430\u0433\u043E\u0442\u0432\u043E\u0440\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u0432\u0437\u043D\u043E\u0441\u044B.`,
      vi: `Kho\u1EA3n \u0111\xF3ng g\xF3p n\xE0y \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c Gi\u1EA3m Thu\u1EBF Thu Nh\u1EADp Cho M\u1EE5c \u0110\xEDch Ch\xEDnh Tr\u1ECB C\u1EE7a Oregon. Ng\u01B0\u1EDDi g\u1EEDi h\u1ED3 s\u01A1 ri\xEAng l\u1EBB s\u1EBD \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c gi\u1EA3m t\u1ED1i \u0111a $50/n\u0103m; c\xE1c tr\u01B0\u1EDDng h\u1EE3p g\u1EEDi h\u1ED3 s\u01A1 t\u1EADp th\u1EC3 s\u1EBD \u0111\u01B0\u1EE3c gi\u1EA3m t\u1ED1i \u0111a $100/n\u0103m. \u0110i\u1EC1u ki\u1EC7n \u0111\u1EC3 l\xE0m Th\xE0nh Vi\xEAn C\u1ED9ng \u0110\u1ED3ng CAPE l\xE0 \u0111\xF3ng g\xF3p $5 tr\u1EDF l\xEAn/th\xE1ng. T\xF4i \u1EE7y quy\u1EC1n cho SEIU Local 503 r\xFAt s\u1ED1 ti\u1EC1n n\xEAu tr\xEAn t\u1EEB t\xE0i kho\u1EA3n thanh to\xE1n, t\xE0i kho\u1EA3n ti\u1EBFt ki\u1EC7m ho\u1EB7c th\u1EBB t\xEDn d\u1EE5ng c\u1EE7a t\xF4i, sau khi x\xE1c nh\u1EADn th\xF4ng tin t\xE0i kho\u1EA3n c\u1EE7a t\xF4i, theo \u1EE7y quy\u1EC1n n\xEAu t\u1EA1i Ph\u1EA7n 2 \u1EDF tr\xEAn. Vi\u1EC7c \u1EE7y quy\u1EC1n n\xE0y mang t\xEDnh t\u1EF1 nguy\u1EC7n v\xE0 kh\xF4ng ph\u1EA3i l\xE0 \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 t\xF4i gia nh\u1EADp Li\xEAn \u0110o\xE0n. Kho\u1EA3n \u0111\xF3ng g\xF3p n\xEAu tr\xEAn ch\u1EC9 l\xE0 \u0111\u1EC1 xu\u1EA5t v\xE0 t\xF4i c\xF3 th\u1EC3 ch\u1ECDn kh\xF4ng \u0111\xF3ng g\xF3p ho\u1EB7c thay \u0111\u1ED5i kho\u1EA3n \u0111\xF3ng g\xF3p m\xE0 kh\xF4ng b\u1ECB SEIU Local 503 tr\u1EA3 \u0111\u0169a.  Kho\u1EA3n \u0111\xF3ng g\xF3p c\u1EE7a t\xF4i s\u1EBD d\xF9ng \u0111\u1EC3 h\u1ED7 tr\u1EE3 nh\u1EEFng \u1EE9ng vi\xEAn \u0111\u01B0\u1EE3c CAPE v\xE0 COPE ch\u1EE9ng th\u1EF1c, c\u0169ng nh\u01B0 cho vi\u1EC7c chi ti\xEAu li\xEAn quan \u0111\u1EBFn cu\u1ED9c b\u1EA7u c\u1EED \u1EDF c\xE1c v\u0103n ph\xF2ng Li\xEAn Bang, \u0110\u1ECBa Ph\u01B0\u01A1ng, L\u1EADp Ph\xE1p v\xE0 To\xE0n Ti\u1EC3u Bang. Nh\u1EEFng c\xF4ng ch\u1EE9c \u0111\u01B0\u1EE3c b\u1EA7u n\xE0y s\u1EBD ra c\xE1c quy\u1EBFt \u0111\u1ECBnh quan tr\u1ECDng v\u1EC1 l\u01B0\u01A1ng, ch\u01B0\u01A1ng tr\xECnh ch\u0103m s\xF3c s\u1EE9c kh\u1ECFe, h\u01B0u tr\xED c\u0169ng nh\u01B0 ph\xFAc l\u1EE3i v\xE0 c\xE1c lu\u1EADt kh\xE1c \u1EA3nh h\u01B0\u1EDFng \u0111\u1EBFn c\u1ED9ng \u0111\u1ED3ng c\u1EE7a ch\xFAng t\xF4i. \u1EE6y Ban SEIU c\xF3 th\u1EC3 d\xF9ng m\u1ED9t ph\u1EA7n kho\u1EA3n \u0111\xF3ng g\xF3p c\u1EE7a t\xF4i cho ch\u01B0\u01A1ng tr\xECnh Gi\xE1o D\u1EE5c Ch\xEDnh Tr\u1ECB (SEIU "COPE").  Theo lu\u1EADt li\xEAn bang, ch\u1EC9 c\xF3 th\xE0nh vi\xEAn li\xEAn \u0111o\xE0n v\xE0 \u0111\u1ED9i ng\u0169 \u0111i\u1EC1u h\xE0nh/qu\u1EA3n tr\u1ECB li\xEAn \u0111o\xE0n l\xE0 th\u01B0\u1EDDng tr\xFA nh\xE2n h\u1EE3p ph\xE1p ho\u1EB7c c\xF4ng d\xE2n Hoa K\u1EF3 m\u1EDBi \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\xF3ng g\xF3p v\xE0o SEIU COPE. Vi\u1EC7c \u1EE7y quy\u1EC1n n\xE0y s\u1EBD v\u1EABn c\xF3 hi\u1EC7u l\u1EF1c cho \u0111\u1EBFn khi t\xF4i h\u1EE7y b\u1ECF b\u1EB1ng v\u0103n b\u1EA3n. Kho\u1EA3n \u0111\xF3ng g\xF3p n\xE0y kh\xE1c v\u1EDBi h\u1ED9i ph\xED. C\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p ho\u1EB7c qu\xE0 t\u1EB7ng cho SEIU CAPE l\xE0 c\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p t\u1EEB thi\u1EC7n n\xEAn kh\xF4ng b\u1ECB kh\u1EA5u tr\u1EEB thu\u1EBF.`,
      zh: `\u8FD9\u7B14\u6350\u6B3E\u6709\u8D44\u683C\u83B7\u5F97\u4FC4\u52D2\u5188\u5DDE\u653F\u6CBB\u7A0E\u6536\u62B5\u514D\u3002\u5355\u72EC\u7533\u8BF7\u8005\u6709\u8D44\u683C\u83B7\u5F97\u6BCF\u5E74\u6700\u9AD8 50 \u7F8E\u5143\u7684\u62B5\u514D\u989D\uFF1B\u8054\u5408\u7533\u8BF7\u8005\u6BCF\u5E74\u6700\u9AD8 100 \u7F8E\u5143\u3002\u6BCF\u6708\u7F34\u8D39 5 \u7F8E\u5143\u6216\u4EE5\u4E0A\u624D\u6709\u8D44\u683C\u6210\u4E3A CAPE \u793E\u533A\u4F1A\u5458\u3002\u672C\u4EBA\u6388\u6743 SEIU Local 503 \u5728\u786E\u8BA4\u672C\u4EBA\u7684\u8D26\u6237\u4FE1\u606F\u540E\uFF0C\u6839\u636E\u4E0A\u8FF0\u7B2C 2 \u6761\u7684\u6388\u6743\uFF0C\u4ECE\u672C\u4EBA\u7684\u652F\u7968\u8D26\u6237\u3001\u50A8\u84C4\u8D26\u6237\u6216\u4FE1\u7528\u5361\u4E2D\u6263\u9664\u4E0A\u8FF0\u91D1\u989D\u3002\u8BE5\u6388\u6743\u662F\u6211\u81EA\u613F\u4F5C\u51FA\u7684\uFF0C\u4E0D\u662F\u6211\u6210\u4E3A\u5DE5\u4F1A\u6210\u5458\u7684\u6761\u4EF6\u3002\u4E0A\u8FF0\u6350\u6B3E\u91D1\u989D\u4EC5\u4E3A\u5EFA\u8BAE\uFF0C\u6211\u53EF\u4EE5\u9009\u62E9\u4E0D\u6350\u6B3E\u6216\u66F4\u6539\u6211\u7684\u6350\u6B3E\u91D1\u989D\uFF0C\u800C\u4E0D\u4F1A\u88AB SEIU Local 503 \u62A5\u590D\u3002  \u6211\u7684\u6350\u6B3E\u5C06\u7528\u4E8E\u652F\u6301 CAPE \u548C COPE \u8BA4\u53EF\u7684\u5019\u9009\u4EBA\u4EE5\u53CA\u4E0E\u8054\u90A6\u3001\u5730\u65B9\u3001\u7ACB\u6CD5\u548C\u5168\u5DDE\u529E\u516C\u5BA4\u9009\u4E3E\u6709\u5173\u7684\u652F\u51FA\u3002\u8FD9\u4E9B\u6C11\u9009\u5B98\u5458\u5C31\u5F71\u54CD\u6211\u4EEC\u793E\u533A\u7684\u5DE5\u8D44\u3001\u533B\u7597\u4FDD\u5065\u3001\u9000\u4F11\u548C\u5176\u4ED6\u798F\u5229\u53CA\u6CD5\u5F8B\u505A\u51FA\u5173\u952E\u51B3\u7B56\u3002\u6211\u7684\u90E8\u5206\u6350\u6B3E\u4E5F\u53EF\u80FD\u88AB SEIU Committee on Political Education\uFF08SEIU \u653F\u6CBB\u6559\u80B2\u59D4\u5458\u4F1A\uFF0C\u82F1\u6587\u7B80\u79F0\u4E3A "COPE"\uFF09\u4F7F\u7528\u3002  \u6839\u636E\u8054\u90A6\u6CD5\u5F8B\u89C4\u5B9A\uFF0C\u53EA\u6709\u8EAB\u4E3A\u7F8E\u56FD\u516C\u6C11\u6216\u7F8E\u56FD\u5408\u6CD5\u6C38\u4E45\u5C45\u6C11\u7684\u5DE5\u4F1A\u6210\u5458\u548C\u884C\u653F/\u7BA1\u7406\u4EBA\u5458\u624D\u6709\u8D44\u683C\u5411 SEIU COPE \u6350\u6B3E\u3002\u8BE5\u6388\u6743\u5728\u6211\u901A\u8FC7\u4E66\u9762\u5F62\u5F0F\u64A4\u9500\u524D\u5C06\u4E00\u76F4\u6709\u6548\u3002\u8FD9\u7B14\u6350\u6B3E\u662F\u4F1A\u8D39\u4E4B\u5916\u7684\u3002\u5411 SEIU CAPE \u7684\u6350\u6B3E\u6216\u6240\u9001\u793C\u7269\u4E0D\u80FD\u4F5C\u4E3A\u6148\u5584\u6350\u6B3E\u8FDB\u884C\u51CF\u7A0E\u3002`,
      ar: `\u062A\u0624\u0647\u0644 \u0647\u0630\u0647 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0644\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0627\u0644\u0627\u0626\u062A\u0645\u0627\u0646 \u0627\u0644\u0636\u0631\u064A\u0628\u064A \u0627\u0644\u0633\u064A\u0627\u0633\u064A \u0641\u064A \u0623\u0648\u0631\u064A\u063A\u0648\u0646. \u064A\u062D\u0642 \u0644\u0644\u0645\u0642\u062F\u0651\u0645\u064A\u0646 \u0627\u0644\u0623\u0641\u0631\u0627\u062F \u0627\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0627\u0626\u062A\u0645\u0627\u0646 \u064A\u0635\u0644 \u0625\u0644\u0649 50 \u062F\u0648\u0644\u0627\u0631\u064B\u0627 \u0633\u0646\u0648\u064A\u064B\u0627\u061B \u0648\u064A\u062D\u0642 \u0644\u0644\u0645\u0642\u062F\u0651\u0645\u064A\u0646 \u0627\u0644\u0645\u0634\u062A\u0631\u0643\u064A\u0646 \u0627\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0645\u0627 \u064A\u0635\u0644 \u0625\u0644\u0649 100 \u062F\u0648\u0644\u0627\u0631 \u0633\u0646\u0648\u064A\u064B\u0627. \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0627\u0644\u0628\u0627\u0644\u063A\u0629 5.00 \u062F\u0648\u0644\u0627\u0631\u0627\u062A \u0634\u0647\u0631\u064A\u064B\u0627 \u0623\u0648 \u0623\u0643\u062B\u0631 \u062A\u0624\u0647\u0644 \u0644\u0639\u0636\u0648\u064A\u0629 \u0645\u062C\u062A\u0645\u0639 CAPE. \u0623\u0641\u0648\u0651\u0636 SEIU Local 503 \u0628\u0633\u062D\u0628 \u0627\u0644\u0645\u0628\u0644\u063A \u0627\u0644\u0645\u0648\u0636\u062D \u0623\u0639\u0644\u0627\u0647 \u0645\u0646 \u062D\u0633\u0627\u0628\u064A \u0627\u0644\u062C\u0627\u0631\u064A \u0623\u0648 \u062D\u0633\u0627\u0628 \u0627\u0644\u062A\u0648\u0641\u064A\u0631 \u0623\u0648 \u0628\u0637\u0627\u0642\u0629 \u0627\u0644\u0627\u0626\u062A\u0645\u0627\u0646\u060C \u0628\u0639\u062F \u062A\u0623\u0643\u064A\u062F \u0645\u0639\u0644\u0648\u0645\u0627\u062A \u062D\u0633\u0627\u0628\u064A\u060C \u0648\u0641\u0642\u064B\u0627 \u0644\u0644\u062A\u0641\u0648\u064A\u0636 \u0627\u0644\u0645\u0642\u062F\u0645 \u0644\u0639\u0636\u0648\u064A\u0629 \u0627\u0644\u0645\u062C\u062A\u0645\u0639. \u064A\u062A\u0645 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0637\u0648\u0639\u064B\u0627 \u0648\u0644\u064A\u0633 \u0634\u0631\u0637\u064B\u0627 \u0644\u0639\u0636\u0648\u064A\u062A\u064A \u0641\u064A \u0627\u0644\u0646\u0642\u0627\u0628\u0629. \u0645\u0628\u0627\u0644\u063A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0627\u0644\u0645\u0648\u0636\u062D\u0629 \u0623\u0639\u0644\u0627\u0647 \u0647\u064A \u0645\u062C\u0631\u062F \u0627\u0642\u062A\u0631\u0627\u062D\u0627\u062A\u060C \u0648\u064A\u0645\u0643\u0646\u0646\u064A \u0627\u062E\u062A\u064A\u0627\u0631 \u0639\u062F\u0645 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0623\u0648 \u062A\u063A\u064A\u064A\u0631 \u0645\u0628\u0644\u063A \u0645\u0633\u0627\u0647\u0645\u062A\u064A \u062F\u0648\u0646 \u0627\u0646\u062A\u0642\u0627\u0645 \u0645\u0646 SEIU Local 503. \u0633\u062A\u064F\u0633\u062A\u062E\u062F\u0645 \u0645\u0633\u0627\u0647\u0645\u062A\u064A \u0644\u062F\u0639\u0645 \u0627\u0644\u0645\u0631\u0634\u062D\u064A\u0646 \u0627\u0644\u0645\u0639\u062A\u0645\u062F\u064A\u0646 \u0645\u0646 CAPE \u0648COPE \u0648\u0644\u0644\u0646\u0641\u0642\u0627\u062A \u0627\u0644\u0645\u062A\u0639\u0644\u0642\u0629 \u0628\u0627\u0646\u062A\u062E\u0627\u0628\u0627\u062A \u0627\u0644\u0645\u0646\u0627\u0635\u0628 \u0627\u0644\u0641\u062F\u0631\u0627\u0644\u064A\u0629 \u0648\u0627\u0644\u0645\u062D\u0644\u064A\u0629 \u0648\u0627\u0644\u062A\u0634\u0631\u064A\u0639\u064A\u0629 \u0648\u0639\u0644\u0649 \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0648\u0644\u0627\u064A\u0629. \u064A\u062A\u062E\u0630 \u0647\u0624\u0644\u0627\u0621 \u0627\u0644\u0645\u0633\u0624\u0648\u0644\u0648\u0646 \u0627\u0644\u0645\u0646\u062A\u062E\u0628\u0648\u0646 \u0642\u0631\u0627\u0631\u0627\u062A \u062D\u0627\u0633\u0645\u0629 \u0628\u0634\u0623\u0646 \u0627\u0644\u0631\u0648\u0627\u062A\u0628 \u0648\u0627\u0644\u0631\u0639\u0627\u064A\u0629 \u0627\u0644\u0635\u062D\u064A\u0629 \u0648\u0627\u0644\u062A\u0642\u0627\u0639\u062F \u0648\u063A\u064A\u0631\u0647\u0627 \u0645\u0646 \u0627\u0644\u0645\u0632\u0627\u064A\u0627 \u0648\u0627\u0644\u0642\u0648\u0627\u0646\u064A\u0646 \u0627\u0644\u062A\u064A \u062A\u0624\u062B\u0631 \u0639\u0644\u0649 \u0645\u062C\u062A\u0645\u0639\u0627\u062A\u0646\u0627. \u0643\u0645\u0627 \u064A\u0645\u0643\u0646 \u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u062C\u0632\u0621 \u0645\u0646 \u0645\u0633\u0627\u0647\u0645\u062A\u064A \u0645\u0646 \u0642\u0628\u0644 \u0644\u062C\u0646\u0629 SEIU \u0644\u0644\u062A\u062B\u0642\u064A\u0641 \u0627\u0644\u0633\u064A\u0627\u0633\u064A (SEIU \u201CCOPE\u201D). \u0648\u0628\u0645\u0648\u062C\u0628 \u0627\u0644\u0642\u0627\u0646\u0648\u0646 \u0627\u0644\u0641\u062F\u0631\u0627\u0644\u064A\u060C \u0644\u0627 \u064A\u062D\u0642 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A SEIU COPE \u0625\u0644\u0627 \u0644\u0623\u0639\u0636\u0627\u0621 \u0627\u0644\u0646\u0642\u0627\u0628\u0627\u062A \u0648\u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0627\u0644\u062A\u0646\u0641\u064A\u0630\u064A\u064A\u0646/\u0627\u0644\u0625\u062F\u0627\u0631\u064A\u064A\u0646 \u0641\u064A \u0627\u0644\u0646\u0642\u0627\u0628\u0627\u062A \u0627\u0644\u0630\u064A\u0646 \u0647\u0645 \u0645\u0648\u0627\u0637\u0646\u0648\u0646 \u0623\u0645\u0631\u064A\u0643\u064A\u0648\u0646 \u0623\u0648 \u0645\u0642\u064A\u0645\u0648\u0646 \u062F\u0627\u0626\u0645\u0648\u0646 \u0642\u0627\u0646\u0648\u0646\u064A\u0648\u0646. \u064A\u0628\u0642\u0649 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0633\u0627\u0631\u064A\u064B\u0627 \u062D\u062A\u0649 \u0623\u0644\u063A\u064A\u0647 \u0643\u062A\u0627\u0628\u0629\u064B. \u0647\u0630\u0647 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0631\u0633\u0648\u0645 \u0627\u0644\u0639\u0636\u0648\u064A\u0629. \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0623\u0648 \u0627\u0644\u0647\u062F\u0627\u064A\u0627 \u0627\u0644\u0645\u0642\u062F\u0645\u0629 \u0625\u0644\u0649 SEIU CAPE \u0644\u064A\u0633\u062A \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062E\u0635\u0645 \u0627\u0644\u0636\u0631\u064A\u0628\u064A \u0643\u062A\u0628\u0631\u0639\u0627\u062A \u062E\u064A\u0631\u064A\u0629.`,
      so: `Tabarucan wuxuu u qalmaa Oregon Political Tax Credit. Dadka kaligood fayl gareeya waxay xaq u leeyihiin credit ilaa $50 sanadkii; kuwa wadajir u fayl gareeya ilaa $100 sanadkii. Tabarucyada $5.00 bil kasta ama ka badan waxay u qalmaan Xubinnimada Bulshada CAPE. Waxaan u fasaxayaa SEIU Local 503 inay qadarka kor ku xusan kala baxdo akoonkayga jeegga, keydka, ama kaarka deynta, kadib marka la xaqiijiyo macluumaadka akoonkayga, iyadoo la raacayo oggolaanshaha xubinnimada bulshada. Oggolaanshahan waa ikhtiyaari mana aha shardi xubinnimadayda Ururka. Qadarrada tabaruca ee kor ku xusan waa talooyin keliya, waxaana dooran karaa inaanan tabarucin ama aan beddelo qadarka tabarucayga anigoon ka baqayn aargoosi SEIU Local 503. Tabarucayga waxaa loo isticmaali doonaa taageeridda murashaxiinta ay CAPE iyo COPE ansixiyeen iyo kharashaadka la xiriira doorashooyinka xafiisyada Federaalka, Degaanka, Sharci-dejinta, iyo Gobolka oo dhan. Mas\u2019uuliyiintan la doortay waxay go\u2019aanno muhiim ah ka gaaraan mushaharka, daryeelka caafimaadka, hawlgabka iyo dheefaha iyo sharciyada kale ee saameeya bulshooyinkeenna. Qayb ka mid ah tabarucayga waxaa sidoo kale isticmaali kara SEIU Committee on Political Education (SEIU \u201CCOPE\u201D). Sida uu dhigayo sharciga federaalka, kaliya xubnaha ururka iyo shaqaalaha fulinta/maamulka ururka ee ah muwaadiniin Maraykan ah ama deggeneyaal rasmi ah oo sharci ah ayaa xaq u leh inay ku tabarucaan SEIU COPE. Oggolaanshahan wuxuu sii jiri doonaa ilaa aan qoraal ahaan uga noqdo. Tabarucan waa dheeraad ka ah lacagaha xubinnimada. Tabarucyada ama hadiyadaha loo diro SEIU CAPE looma jari karo canshuur ahaan sida deeqo sadaqo ah.`
    },
    capeNewLegal1: {
      selector: '[data-cape-copy="capeNewLegal1"]',
      mode: "html",
      en: `This contribution qualifies for the Oregon Political Tax Credit. Single filers are eligible for a credit up to $50/year; joint filers up to $100 per year.`,
      es: `Este aporte cumple con los requisitos del cr\xE9dito fiscal de Oreg\xF3n. Los(as) declarantes solteros(as) son elegibles para recibir un cr\xE9dito anual de hasta $50; mientras que los(as) declarantes conjuntos(as) pueden recibir hasta $100 anuales.`,
      ru: `\u0414\u0430\u043D\u043D\u044B\u0439 \u0432\u0437\u043D\u043E\u0441 \u043F\u043E\u043F\u0430\u0434\u0430\u0435\u0442 \u043F\u043E\u0434 \u043D\u0430\u043B\u043E\u0433\u043E\u0432\u0443\u044E \u043B\u044C\u0433\u043E\u0442\u0443 \u0448\u0442\u0430\u0442\u0430 \u041E\u0440\u0435\u0433\u043E\u043D \u0437\u0430 \u0432\u0437\u043D\u043E\u0441\u044B \u043D\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0446\u0435\u043B\u0438. \u041F\u0440\u0438 \u0435\u0434\u0438\u043D\u043E\u043B\u0438\u0447\u043D\u043E\u0439 \u043F\u043E\u0434\u0430\u0447\u0435 \u0437\u0430\u044F\u0432\u043B\u0435\u043D\u0438\u044F \u0440\u0430\u0437\u043C\u0435\u0440 \u043B\u044C\u0433\u043E\u0442\u044B \u043C\u043E\u0436\u0435\u0442 \u0434\u043E\u0441\u0442\u0438\u0433\u0430\u0442\u044C $50 \u0432 \u0433\u043E\u0434, \u043F\u0440\u0438 \u0441\u043E\u0432\u043C\u0435\u0441\u0442\u043D\u043E\u0439 \u043F\u043E\u0434\u0430\u0447\u0435 \u2014 $100 \u0432 \u0433\u043E\u0434.`,
      vi: `Kho\u1EA3n \u0111\xF3ng g\xF3p n\xE0y \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c Gi\u1EA3m Thu\u1EBF Thu Nh\u1EADp Cho M\u1EE5c \u0110\xEDch Ch\xEDnh Tr\u1ECB C\u1EE7a Oregon. Ng\u01B0\u1EDDi g\u1EEDi h\u1ED3 s\u01A1 ri\xEAng l\u1EBB s\u1EBD \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c gi\u1EA3m t\u1ED1i \u0111a $50/n\u0103m; c\xE1c tr\u01B0\u1EDDng h\u1EE3p g\u1EEDi h\u1ED3 s\u01A1 t\u1EADp th\u1EC3 s\u1EBD \u0111\u01B0\u1EE3c gi\u1EA3m t\u1ED1i \u0111a $100/n\u0103m.`,
      zh: "\u8FD9\u7B14\u6350\u6B3E\u6709\u8D44\u683C\u83B7\u5F97\u4FC4\u52D2\u5188\u5DDE\u653F\u6CBB\u7A0E\u6536\u62B5\u514D\u3002\u5355\u72EC\u7533\u8BF7\u8005\u6709\u8D44\u683C\u83B7\u5F97\u6BCF\u5E74\u6700\u9AD8 50 \u7F8E\u5143\u7684\u62B5\u514D\u989D\uFF1B\u8054\u5408\u7533\u8BF7\u8005\u6BCF\u5E74\u6700\u9AD8 100 \u7F8E\u5143\u3002",
      ar: `\u062A\u0624\u0647\u0644 \u0647\u0630\u0647 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0644\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0627\u0644\u0627\u0626\u062A\u0645\u0627\u0646 \u0627\u0644\u0636\u0631\u064A\u0628\u064A \u0627\u0644\u0633\u064A\u0627\u0633\u064A \u0641\u064A \u0623\u0648\u0631\u064A\u063A\u0648\u0646. \u064A\u062D\u0642 \u0644\u0644\u0645\u0642\u062F\u0651\u0645\u064A\u0646 \u0627\u0644\u0623\u0641\u0631\u0627\u062F \u0627\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0627\u0626\u062A\u0645\u0627\u0646 \u064A\u0635\u0644 \u0625\u0644\u0649 50 \u062F\u0648\u0644\u0627\u0631\u064B\u0627 \u0633\u0646\u0648\u064A\u064B\u0627\u061B \u0648\u064A\u062D\u0642 \u0644\u0644\u0645\u0642\u062F\u0651\u0645\u064A\u0646 \u0627\u0644\u0645\u0634\u062A\u0631\u0643\u064A\u0646 \u0627\u0644\u062D\u0635\u0648\u0644 \u0639\u0644\u0649 \u0645\u0627 \u064A\u0635\u0644 \u0625\u0644\u0649 100 \u062F\u0648\u0644\u0627\u0631 \u0633\u0646\u0648\u064A\u064B\u0627.`,
      so: `Tabarucan wuxuu u qalmaa Oregon Political Tax Credit. Dadka kaligood fayl gareeya waxay xaq u leeyihiin credit ilaa $50 sanadkii; kuwa wadajir u fayl gareeya ilaa $100 sanadkii.`
    },

      en: "This authorization is made voluntarily based on my specific understanding that:",

      vi: "T\xF4i ch\u1EA5p thu\u1EADn vi\u1EC7c n\xE0y tr\xEAn tinh th\u1EA7n t\u1EF1 nguy\u1EC7n d\u1EF1a tr\xEAn hi\u1EC3u bi\u1EBFt c\u1EE5 th\u1EC3 c\u1EE7a b\u1EA3n th\xE2n r\u1EB1ng:",

    capeNewLegal3: {
      selector: '[data-cape-copy="capeNewLegal3"]',
      mode: "html",
      en: `1) I am not required to sign this form or make voluntary contributions to SEIU CAPE as a condition of my employment or membership in the union;`,
      es: `1) No estoy en la obligaci\xF3n de firmar este formulario o realizar aportes voluntarios a la Acci\xF3n Ciudadana en Favor de la Educaci\xF3n Pol\xEDtica (por su sigla en ingl\xE9s CAPE) de SEIU, y no supone una condici\xF3n para mantener mi empleo o membres\xEDa en la uni\xF3n;`,
      ru: `1) \u042F \u043D\u0435 \u043E\u0431\u044F\u0437\u0430\u043D(-\u0430) \u043F\u043E\u0434\u043F\u0438\u0441\u044B\u0432\u0430\u0442\u044C \u044D\u0442\u0443 \u0444\u043E\u0440\u043C\u0443 \u0438\u043B\u0438 \u0434\u0435\u043B\u0430\u0442\u044C \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u043D\u044B\u0435 \u0432\u0437\u043D\u043E\u0441\u044B \u0432 SEIU CAPE \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0443\u0441\u043B\u043E\u0432\u0438\u044F \u043C\u043E\u0435\u0433\u043E \u0442\u0440\u0443\u0434\u043E\u0443\u0441\u0442\u0440\u043E\u0439\u0441\u0442\u0432\u0430 \u0438\u043B\u0438 \u0447\u043B\u0435\u043D\u0441\u0442\u0432\u0430 \u0432 \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0435;`,
      vi: `1) T\xF4i kh\xF4ng b\u1EAFt bu\u1ED9c ph\u1EA3i k\xFD v\xE0o m\u1EABu \u0111\u01A1n n\xE0y ho\u1EB7c kh\xF4ng b\u1ECB \xE9p bu\u1ED9c \u0111\xF3ng g\xF3p cho SEIU CAPE nh\u01B0 m\u1ED9t \u0111i\u1EC1u ki\u1EC7n \u0111\u1EC3 \u0111\u01B0\u1EE3c tuy\u1EC3n d\u1EE5ng ho\u1EB7c gia nh\u1EADp li\xEAn \u0111o\xE0n;`,
      zh: "1) \u6211\u65E0\u9700\u7B7E\u7F72\u6B64\u8868\u683C\u6216\u81EA\u613F\u5411 SEIU CAPE \u6350\u6B3E\u4EE5\u4F5C\u4E3A\u6211\u5C31\u4E1A\u6216\u6210\u4E3A\u4F1A\u5458\u7684\u6761\u4EF6\uFF1B",
      ar: `1) \u0644\u0633\u062A \u0645\u0637\u0627\u0644\u0628\u064B\u0627 \u0628\u062A\u0648\u0642\u064A\u0639 \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C \u0623\u0648 \u062A\u0642\u062F\u064A\u0645 \u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0637\u0648\u0639\u064A\u0629 \u0625\u0644\u0649 SEIU CAPE \u0643\u0634\u0631\u0637 \u0644\u0644\u062A\u0648\u0638\u064A\u0641 \u0623\u0648 \u0627\u0644\u0639\u0636\u0648\u064A\u0629 \u0641\u064A \u0627\u0644\u0646\u0642\u0627\u0628\u0629\u061B`,
      so: `1) Looma baahna inaan saxiixo foomkan ama aan SEIU CAPE ku sameeyo tabarucyo ikhtiyaari ah si ay shardi ugu noqoto shaqadayda ama xubinnimadayda ururka;`
    },
    capeNewLegal4: {
      selector: '[data-cape-copy="capeNewLegal4"]',
      mode: "html",
      en: "2) I may refuse to contribute without reprisal;",
      es: "2) Puedo rechazar el aporte sin que esto suponga represalias;",
      ru: "2) \u042F \u043C\u043E\u0433\u0443 \u043E\u0442\u043A\u0430\u0437\u0430\u0442\u044C\u0441\u044F \u043E\u0442 \u0432\u0437\u043D\u043E\u0441\u043E\u0432 \u0431\u0435\u0437 \u043E\u0442\u0432\u0435\u0442\u043D\u044B\u0445 \u043C\u0435\u0440;",
      vi: "2) T\xF4i c\xF3 th\u1EC3 t\u1EEB ch\u1ED1i \u0111\xF3ng g\xF3p m\xE0 kh\xF4ng s\u1EE3 b\u1ECB tr\u1EA3 \u0111\u0169a;",
      zh: "2) \u6211\u53EF\u4EE5\u62D2\u7EDD\u6350\u6B3E\uFF0C\u800C\u4E14\u4E0D\u4F1A\u56E0\u6B64\u53D7\u5230\u62A5\u590D\uFF1B",
      ar: "2) \u064A\u0645\u0643\u0646\u0646\u064A \u0631\u0641\u0636 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u062F\u0648\u0646 \u0627\u0646\u062A\u0642\u0627\u0645\u061B",
      so: "2) Waan diidi karaa inaan tabaruco anigoon la kulmin aargoosi;"
    },
    capeNewLegal5: {
      selector: '[data-cape-copy="capeNewLegal5"]',
      mode: "html",
      en: `3) Under law, only union members and executive / administrative staff who are U.S. Citizens or lawful permanent residents are eligible to contribute to CAPE;`,
      es: `3) De conformidad con la ley, solo los(as) miembros de la uni\xF3n y el personal administrativo/ejecutivo de la misma que sean ciudadanos(as) de los EE. UU. o residentes permanentes legales son elegibles para aportar a la CAPE;`,
      ru: `3) \u041F\u043E \u0437\u0430\u043A\u043E\u043D\u0443 \u043F\u0440\u0430\u0432\u043E \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0432\u0437\u043D\u043E\u0441\u044B \u0432 CAPE \u0438\u043C\u0435\u044E\u0442 \u0442\u043E\u043B\u044C\u043A\u043E \u0447\u043B\u0435\u043D\u044B \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430 \u0438 \u0438\u0441\u043F\u043E\u043B\u043D\u0438\u0442\u0435\u043B\u044C\u043D\u044B\u0439 / \u0430\u0434\u043C\u0438\u043D\u0438\u0441\u0442\u0440\u0430\u0442\u0438\u0432\u043D\u044B\u0439 \u043F\u0435\u0440\u0441\u043E\u043D\u0430\u043B, \u044F\u0432\u043B\u044F\u044E\u0449\u0438\u0435\u0441\u044F \u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0430\u043C\u0438 \u0421\u0428\u0410 \u0438\u043B\u0438 \u0437\u0430\u043A\u043E\u043D\u043D\u044B\u043C\u0438 \u043F\u043E\u0441\u0442\u043E\u044F\u043D\u043D\u044B\u043C\u0438 \u0436\u0438\u0442\u0435\u043B\u044F\u043C\u0438 \u0421\u0428\u0410;`,
      vi: `3) Theo lu\u1EADt, ch\u1EC9 c\xF3 th\xE0nh vi\xEAn li\xEAn \u0111o\xE0n v\xE0 \u0111\u1ED9i ng\u0169 \u0111i\u1EC1u h\xE0nh/qu\u1EA3n tr\u1ECB l\xE0 th\u01B0\u1EDDng tr\xFA nh\xE2n h\u1EE3p ph\xE1p ho\u1EB7c c\xF4ng d\xE2n Hoa K\u1EF3 m\u1EDBi \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n \u0111\xF3ng g\xF3p v\xE0o CAPE.`,
      zh: "3) \u6839\u636E\u6CD5\u5F8B\u89C4\u5B9A\uFF0C\u53EA\u6709\u8EAB\u4E3A\u7F8E\u56FD\u516C\u6C11\u6216\u7F8E\u56FD\u5408\u6CD5\u6C38\u4E45\u5C45\u6C11\u7684\u5DE5\u4F1A\u6210\u5458\u548C\u884C\u653F/\u7BA1\u7406\u4EBA\u5458\u624D\u6709\u8D44\u683C\u5411 CAPE \u6350\u6B3E\uFF1B",
      ar: `3) \u0628\u0645\u0648\u062C\u0628 \u0627\u0644\u0642\u0627\u0646\u0648\u0646\u060C \u0644\u0627 \u064A\u062D\u0642 \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A CAPE \u0625\u0644\u0627 \u0644\u0623\u0639\u0636\u0627\u0621 \u0627\u0644\u0646\u0642\u0627\u0628\u0627\u062A \u0648\u0627\u0644\u0645\u0648\u0638\u0641\u064A\u0646 \u0627\u0644\u062A\u0646\u0641\u064A\u0630\u064A\u064A\u0646/\u0627\u0644\u0625\u062F\u0627\u0631\u064A\u064A\u0646 \u0627\u0644\u0630\u064A\u0646 \u0647\u0645 \u0645\u0648\u0627\u0637\u0646\u0648\u0646 \u0623\u0645\u0631\u064A\u0643\u064A\u0648\u0646 \u0623\u0648 \u0645\u0642\u064A\u0645\u0648\u0646 \u062F\u0627\u0626\u0645\u0648\u0646 \u0642\u0627\u0646\u0648\u0646\u064A\u0648\u0646\u061B`,
      so: `3) Sida sharcigu dhigayo, kaliya xubnaha ururka iyo shaqaalaha fulinta/maamulka ee ah Muwaadiniin Maraykan ah ama deggeneyaal rasmi ah oo sharci ah ayaa xaq u leh inay ku tabarucaan CAPE;`
    },
    capeNewLegal6: {
      selector: '[data-cape-copy="capeNewLegal6"]',
      mode: "html",
      en: `4) The contribution amounts on this form are merely suggestions, and I may contribute more or less by this or other means without fear of favor or disadvantage from SEIU or my employer;`,
      es: `4) Los montos de los aportes mencionados en este formulario solo son sugerencias, as\xED que puedo aportar m\xE1s o menos a trav\xE9s de este u otros medios sin temor a que suponga una ventaja o desventaja de parte de SEIU o mi empleador;`,
      ru: `4) \u0421\u0443\u043C\u043C\u044B \u0432\u0437\u043D\u043E\u0441\u043E\u0432 \u0443\u043A\u0430\u0437\u044B\u0432\u0430\u044E\u0442\u0441\u044F \u0432 \u0434\u0430\u043D\u043D\u043E\u0439 \u0444\u043E\u0440\u043C\u0435 \u0442\u043E\u043B\u044C\u043A\u043E \u0432 \u043A\u0430\u0447\u0435\u0441\u0442\u0432\u0435 \u0440\u0435\u043A\u043E\u043C\u0435\u043D\u0434\u0430\u0446\u0438\u0439, \u0438 \u044F \u043C\u043E\u0433\u0443 \u0432\u043D\u043E\u0441\u0438\u0442\u044C \u0431\u043E\u043B\u044C\u0448\u0435 \u0438\u043B\u0438 \u043C\u0435\u043D\u044C\u0448\u0435 \u044D\u0442\u0438\u043C \u0438\u043B\u0438 \u0438\u043D\u044B\u043C \u0441\u043F\u043E\u0441\u043E\u0431\u043E\u043C, \u043D\u0435 \u043E\u043F\u0430\u0441\u0430\u044F\u0441\u044C, \u0447\u0442\u043E SEIU \u0438\u043B\u0438 \u043C\u043E\u0439 \u0440\u0430\u0431\u043E\u0442\u043E\u0434\u0430\u0442\u0435\u043B\u044C \u0431\u0443\u0434\u0443\u0442 \u043E\u0442\u043D\u043E\u0441\u0438\u0442\u044C\u0441\u044F \u043A\u043E \u043C\u043D\u0435 \u043F\u0440\u0435\u0434\u0432\u0437\u044F\u0442\u043E (\u0441\u043E\u0434\u0435\u0439\u0441\u0442\u0432\u043E\u0432\u0430\u0442\u044C \u0438\u043B\u0438 \u043F\u0440\u0435\u0441\u043B\u0435\u0434\u043E\u0432\u0430\u0442\u044C);`,
      vi: `4) S\u1ED1 ti\u1EC1n \u0111\xF3ng g\xF3p ghi tr\xEAn \u0111\u01A1n n\xE0y ch\u1EC9 l\xE0 m\u1EE9c \u0111\u1EC1 xu\u1EA5t, v\xE0 t\xF4i c\xF3 th\u1EC3 \u0111\xF3ng g\xF3p nhi\u1EC1u ho\u1EB7c \xEDt h\u01A1n hay b\u1EB1ng c\xE1c h\xECnh th\u1EE9c kh\xE1c m\xE0 kh\xF4ng ph\u1EA3i lo s\u1EE3 SEIU hay ch\u1EE7 lao \u0111\u1ED9ng c\u1EE7a t\xF4i s\u1EBD thi\xEAn v\u1ECB ho\u1EB7c g\xE2y b\u1EA5t l\u1EE3i;`,
      zh: "4) \u6B64\u8868\u683C\u4E0A\u7684\u6350\u6B3E\u91D1\u989D\u4EC5\u662F\u5EFA\u8BAE\uFF0C\u6211\u53EF\u4EE5\u6216\u591A\u6216\u5C11\u5730\u901A\u8FC7\u6B64\u79CD\u65B9\u5F0F\u6216\u5176\u4ED6\u65B9\u5F0F\u6350\u6B3E\uFF0C\u800C\u65E0\u9700\u62C5\u5FC3\u4F1A\u53D7\u5230\u6765\u81EA SEIU \u6216\u6211\u96C7\u4E3B\u7684\u504F\u8892\u6216\u4FB5\u5BB3\uFF1B",
      ar: `4) \u0645\u0628\u0627\u0644\u063A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0641\u064A \u0647\u0630\u0627 \u0627\u0644\u0646\u0645\u0648\u0630\u062C \u0647\u064A \u0645\u062C\u0631\u062F \u0627\u0642\u062A\u0631\u0627\u062D\u0627\u062A\u060C \u0648\u064A\u0645\u0643\u0646\u0646\u064A \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0629 \u0628\u0623\u0643\u062B\u0631 \u0623\u0648 \u0623\u0642\u0644 \u0645\u0646 \u062E\u0644\u0627\u0644 \u0647\u0630\u0627 \u0627\u0644\u0648\u0633\u064A\u0644\u0629 \u0623\u0648 \u063A\u064A\u0631\u0647\u0627 \u062F\u0648\u0646 \u062E\u0648\u0641 \u0645\u0646 \u062A\u0641\u0636\u064A\u0644 \u0623\u0648 \u0636\u0631\u0631 \u0645\u0646 SEIU \u0623\u0648 \u0635\u0627\u062D\u0628 \u0639\u0645\u0644\u064A\u061B`,
      so: `4) Qadarrada tabaruca ee foomkan ku qoran waa talooyin keliya, waxaana ku tabaruci karaa wax ka badan ama ka yar anigoo adeegsanaya habkan ama hab kale, anigoon ka baqayn in SEIU ama loo-shaqeeyahaygu i siiyo doorbid ama khasaare;`
    },
    capeNewLegal7: {
      selector: '[data-cape-copy="capeNewLegal7"]',
      mode: "html",
      en: `5) SEIU CAPE uses the money it receives for political purposes \u2013 including, but not limited to, making contributions to and expenditures on behalf of candidates for federal, state, and local offices \u2013 and addressing political issues of public importance.`,
      es: `5) La CAPE de SEIU utiliza el dinero que recibe para fines pol\xEDticos, entre ellos, realizar aportes y cubrir los gastos de los(as) candidatos(as) a cargos federales, estatales y locales, as\xED como afrontar asuntos pol\xEDticos de car\xE1cter p\xFAblico`,
      ru: `5) SEIU CAPE \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u0443\u0435\u0442 \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u043D\u044B\u0435 \u0434\u0435\u043D\u044C\u0433\u0438 \u043D\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0435 \u0446\u0435\u043B\u0438, \u0432\u043A\u043B\u044E\u0447\u0430\u044F \u0432 \u0442\u043E\u043C \u0447\u0438\u0441\u043B\u0435 \u043D\u0430 \u0432\u0437\u043D\u043E\u0441\u044B \u0438 \u0432\u043B\u043E\u0436\u0435\u043D\u0438\u044F \u043E\u0442 \u0438\u043C\u0435\u043D\u0438 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u043E\u0432 \u0432 \u0444\u0435\u0434\u0435\u0440\u0430\u043B\u044C\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438, \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438 \u0448\u0442\u0430\u0442\u0430 \u0438 \u043C\u0435\u0441\u0442\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0432\u043B\u0430\u0441\u0442\u0438 \u2014 \u0438 \u043D\u0430 \u0440\u0435\u0448\u0435\u043D\u0438\u0435 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u0432\u043E\u043F\u0440\u043E\u0441\u043E\u0432 \u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0439 \u0437\u043D\u0430\u0447\u0438\u043C\u043E\u0441\u0442\u0438.`,
      vi: `5) SEIU CAPE s\u1EED d\u1EE5ng s\u1ED1 ti\u1EC1n nh\u1EADn \u0111\u01B0\u1EE3c cho m\u1EE5c \u0111\xEDch ch\xEDnh tr\u1ECB \u2013 bao g\u1ED3m nh\u01B0ng kh\xF4ng gi\u1EDBi h\u1EA1n \u1EDF c\xE1c kho\u1EA3n \u0111\xF3ng g\xF3p v\xE0 chi ph\xED thay m\u1EB7t cho \u1EE9ng vi\xEAn tranh c\u1EED cho c\xE1c ch\u1EE9c v\u1EE5 c\u1EA5p li\xEAn bang, ti\u1EC3u bang v\xE0 \u0111\u1ECBa ph\u01B0\u01A1ng \u2013 \u0111\u1ED3ng th\u1EDDi gi\u1EA3i quy\u1EBFt nh\u1EEFng v\u1EA5n \u0111\u1EC1 ch\xEDnh tr\u1ECB c\xF3 t\u1EA7m quan tr\u1ECDng v\u1EDBi c\u1ED9ng \u0111\u1ED3ng.`,
      zh: "5) SEIU CAPE \u5C06\u5176\u6536\u5230\u7684\u8D44\u91D1\u7528\u4E8E\u653F\u6CBB\u76EE\u7684 \u2014 \u5305\u62EC\u4F46\u4E0D\u9650\u4E8E\u5411\u8054\u90A6\u3001\u5DDE\u548C\u5730\u65B9\u529E\u4E8B\u5904\u5019\u9009\u4EBA\u7684\u6350\u6B3E\u548C\u4EE3\u8868\u5019\u9009\u4EBA\u4EA7\u751F\u7684\u5F00\u652F \u2014 \u4EE5\u53CA\u5904\u7406\u516C\u4F17\u5173\u6CE8\u7684\u653F\u6CBB\u95EE\u9898\u3002",
      ar: `5) \u062A\u0633\u062A\u062E\u062F\u0645 SEIU CAPE \u0627\u0644\u0623\u0645\u0648\u0627\u0644 \u0627\u0644\u062A\u064A \u062A\u062A\u0644\u0642\u0627\u0647\u0627 \u0644\u0623\u063A\u0631\u0627\u0636 \u0633\u064A\u0627\u0633\u064A\u0629\u060C \u0628\u0645\u0627 \u0641\u064A \u0630\u0644\u0643\u060C \u0639\u0644\u0649 \u0633\u0628\u064A\u0644 \u0627\u0644\u0645\u062B\u0627\u0644 \u0644\u0627 \u0627\u0644\u062D\u0635\u0631\u060C \u062A\u0642\u062F\u064A\u0645 \u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0648\u0646\u0641\u0642\u0627\u062A \u0646\u064A\u0627\u0628\u0629 \u0639\u0646 \u0645\u0631\u0634\u062D\u064A\u0646 \u0644\u0645\u0646\u0627\u0635\u0628 \u0641\u062F\u0631\u0627\u0644\u064A\u0629 \u0648\u0639\u0644\u0649 \u0645\u0633\u062A\u0648\u0649 \u0627\u0644\u0648\u0644\u0627\u064A\u0629 \u0648\u0645\u062D\u0644\u064A\u0629\u060C \u0648\u0645\u0639\u0627\u0644\u062C\u0629 \u0642\u0636\u0627\u064A\u0627 \u0633\u064A\u0627\u0633\u064A\u0629 \u0630\u0627\u062A \u0623\u0647\u0645\u064A\u0629 \u0639\u0627\u0645\u0629.`,
      so: `5) SEIU CAPE waxay lacagta ay hesho u isticmaashaa ujeeddooyin siyaasadeed \u2014 oo ay ku jiraan, balse aan ku koobnayn, tabarucyo iyo kharashyo loogu talagalay murashaxiinta xafiisyada federaalka, gobolka, iyo degaanka \u2014 iyo wax ka qabashada arrimaha siyaasadeed ee muhiimka u ah dadweynaha.`

    capeNewLegal8: {

      mode: "html",
      en: `This authorization shall remain in effect until revoked by me in writing via U.S. mail to SEIU. Contributions or gifts to SEIU Local 503, OPEU CAPE are not tax deductible as charitable contributions.`,
      es: `Esta autorizaci\xF3n permanecer\xE1 vigente hasta que yo la revoque envi\xE1ndole un aviso a SEIU a trav\xE9s del correo postal de los EE. UU. Los aportes u obsequios a la CAPE de SEIU Local 503, OPEU no son deducibles de impuestos como aportes ben\xE9ficos.`,

      zh: "\u6B64\u6388\u6743\u5C06\u4E00\u76F4\u6709\u6548\uFF0C\u76F4\u81F3\u6211\u5C06\u64A4\u9500\u7533\u8BF7\u4EE5\u4E66\u9762\u5F62\u5F0F\u901A\u8FC7\u7F8E\u56FD\u90AE\u653F\u670D\u52A1\u90AE\u5BC4\u7ED9 SEIU \u4E3A\u6B62\u3002\u5411 SEIU Local 503\u3001OPEU CAPE \u7684\u6350\u6B3E\u6216\u6240\u9001\u793C\u7269\u4E0D\u80FD\u4F5C\u4E3A\u6148\u5584\u6350\u6B3E\u8FDB\u884C\u51CF\u7A0E\u3002",
      ar: `\u064A\u0628\u0642\u0649 \u0647\u0630\u0627 \u0627\u0644\u062A\u0641\u0648\u064A\u0636 \u0633\u0627\u0631\u064A\u064B\u0627 \u062D\u062A\u0649 \u0623\u0644\u063A\u064A\u0647 \u0643\u062A\u0627\u0628\u0629\u064B \u0639\u0628\u0631 \u0627\u0644\u0628\u0631\u064A\u062F \u0627\u0644\u0623\u0645\u0631\u064A\u0643\u064A \u0625\u0644\u0649 SEIU. \u0627\u0644\u0645\u0633\u0627\u0647\u0645\u0627\u062A \u0623\u0648 \u0627\u0644\u0647\u062F\u0627\u064A\u0627 \u0627\u0644\u0645\u0642\u062F\u0645\u0629 \u0625\u0644\u0649 SEIU Local 503, OPEU CAPE \u0644\u064A\u0633\u062A \u0642\u0627\u0628\u0644\u0629 \u0644\u0644\u062E\u0635\u0645 \u0627\u0644\u0636\u0631\u064A\u0628\u064A \u0643\u062A\u0628\u0631\u0639\u0627\u062A \u062E\u064A\u0631\u064A\u0629.`,

      document.querySelector("[lang]")?.getAttribute("lang"),
      document.querySelector("html")?.getAttribute("lang")
    ];
    const found = candidates.map((value) => String(value || "").trim().toLowerCase()).find((value) => value && value !== "en");
    return (found || "en").split("-")[0];
  }
  function patchAlert() {
    if (window.__faLocalizedAlertPatched) return;
    window.__faLocalizedAlertPatched = true;
    const originalAlert = window.alert;
    window.alert = function(message) {
      const lang = getCurrentLang();
      const dict = i18n[lang];
      console.log("FA alert intercepted:", message, "lang:", lang);
      if (dict && typeof message === "string") {
        const match = message.match(
          /The form is not complete and has not been submitted yet\. There (?:is|are) (\d+) problems? with your submission\./i
        );
        if (match) {
          return originalAlert.call(window, dict.alert(Number(match[1])));
        }
      }
      return originalAlert.call(window, message);
    };
  }
  function observeFormAssemblyErrors() {
    if (window.__faErrorObserverInstalled) return;
    window.__faErrorObserverInstalled = true;
    new MutationObserver(runTranslations).observe(document.documentElement, {
      childList: true,
      subtree: true,
      characterData: true,
      attributes: true,
      attributeFilter: ["value", "class", "style"]
    });
    document.addEventListener(
      "submit",
      () => {
        setTimeout(runTranslations, 0);
        setTimeout(runTranslations, 50);

        setTimeout(runTranslations, 1e3);
      },

    );

      "click",

  function runTranslations() {

  function translateSubmitButtons() {
    const lang = getCurrentLang();
    const dict = i18n[lang];
    if (!dict) return;
    document.querySelectorAll("input[type='submit'], button[type='submit']").forEach((btn) => {
      if (btn.tagName === "INPUT" && /please wait/i.test(btn.value)) {
        btn.value = dict.pleaseWait;
      } else if (/please wait/i.test(btn.textContent)) {
        btn.textContent = dict.pleaseWait;
      }
    });
  }
  function initValidation({ formEl, getLang }) {
    console.log("initValidation called");

      currentGetLang = getLang;

  function translateValidationMessages() {
    const lang = getCurrentLang();
    if (lang === "en") return;
    const dict = i18n[lang];
    if (!dict) return;
    document.querySelectorAll(".errMsg").forEach((el) => {
      let text = el.textContent || "";
      Object.entries(dict.messages).forEach(([english, translated]) => {
        text = text.replaceAll(english, translated);
      });
      if (el.textContent !== text) {
        console.log("Translated error:", el.textContent, "=>", text);
        el.textContent = text;
      }
    });
  }

  function normalizeTranslationMap(map) {
    return Object.fromEntries(
      Object.entries(map).map(([key, value]) => [key.toLowerCase(), value])
    );
  }
  var translationsNorm = normalizeTranslationMap(translations);
  function getTranslation(map, key, lang, fallbackText = "") {
    if (!map || !key) return fallbackText;
    const entry = map[key.toLowerCase()];
    if (!entry) return fallbackText;
    const value = entry?.[lang];
    if (typeof value === "string" && value.trim()) return value;
    const english = entry?.en;
    if (typeof english === "string" && english.trim()) return english;
    return fallbackText;
  }

    function clearAllEmployerAccountFields() {

    function applyTranslations() {
      document.title = getTranslation(translationsNorm, "formTitle", getLang, document.title);
      Object.entries(translations).forEach(([key, entry]) => {
        const selectors = [];
        if (entry.selector) selectors.push(entry.selector);
        if (entry.id) {
          selectors.push(`#${CSS.escape(entry.id)}`);
        }
        if (entry.ids?.length) {
          entry.ids.forEach((id) => {
            selectors.push(`#${CSS.escape(id)}`);
          });
        }
        selectors.forEach((selector) => {
          const el = document.querySelector(selector);
          if (!el) return;
          const translated = getTranslation(translationsNorm, key, getLang, "");
          if (entry.mode === "html") {
            if (!el.dataset.originalHtml) el.dataset.originalHtml = el.innerHTML || "";
            el.innerHTML = translated || el.dataset.originalHtml;
            return;
          }
          if (entry.mode === "value") {
            if (!el.dataset.originalValue) el.dataset.originalValue = el.value || "";
            el.value = translated || el.dataset.originalValue;
            return;
          }
          if (entry.mode === "firstOption") {
            const option = el.options?.[0] || el.querySelector?.("option:first-child");

            if (!option.dataset.originalText) {
              option.dataset.originalText = option.textContent || "";
            }
