      ru: "\u0423\u0447\u0430\u0441\u0442\u0438\u0435 \u0432 CAPE \u2014 \u0433\u0440\u0430\u0436\u0434\u0430\u043D\u0441\u043A\u043E\u043C \u0434\u0432\u0438\u0436\u0435\u043D\u0438\u0438 \u0437\u0430 \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043F\u0440\u043E\u0441\u0432\u0435\u0449\u0435\u043D\u0438\u0435",

    capeSubhead: {
      selector: '[data-cape-copy="capeSubhead"]',
      mode: "html",
      en: `Collective political action to raise wages, protect benefits, fund public services, and build strong communities.`,
      es: `Acci\xF3n pol\xEDtica colectiva que busca aumentar los salarios, proteger los beneficios, financiar los servicios p\xFAblicos y fortalecer las comunidades.`,
      ru: `\u0421\u043E\u0432\u043C\u0435\u0441\u0442\u043D\u0430\u044F \u043F\u043E\u043B\u0438\u0442\u0438\u0447\u0435\u0441\u043A\u0430\u044F \u0438\u043D\u0438\u0446\u0438\u0430\u0442\u0438\u0432\u0430 \u0432 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u043A\u0443 \u043F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u044F \u0437\u0430\u0440\u043F\u043B\u0430\u0442, \u0443\u0432\u0435\u043B\u0438\u0447\u0435\u043D\u0438\u044F \u043B\u044C\u0433\u043E\u0442, \u043F\u043E\u043B\u0443\u0447\u0435\u043D\u0438\u044F \u0433\u043E\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u0434\u043E\u0442\u0430\u0446\u0438\u0439 \u0438 \u0441\u043E\u0437\u0434\u0430\u043D\u0438\u044F \u0441\u043F\u043B\u043E\u0447\u0435\u043D\u043D\u044B\u0445 \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432.`,
      vi: `H\xE0nh \u0111\u1ED9ng ch\xEDnh tr\u1ECB t\u1EADp th\u1EC3 nh\u1EB1m t\u0103ng l\u01B0\u01A1ng, b\u1EA3o v\u1EC7 quy\u1EC1n l\u1EE3i, t\xE0i tr\u1EE3 cho c\xE1c d\u1ECBch v\u1EE5 c\xF4ng c\u1ED9ng v\xE0 x\xE2y d\u1EF1ng c\xE1c c\u1ED9ng \u0111\u1ED3ng v\u1EEFng m\u1EA1nh.`,
      zh: "\u96C6\u4F53\u653F\u6CBB\u884C\u52A8\u65E8\u5728\u63D0\u9AD8\u5DE5\u8D44\u3001\u4FDD\u62A4\u798F\u5229\u3001\u8D44\u52A9\u516C\u5171\u670D\u52A1\uFF0C\u4EE5\u53CA\u5EFA\u8BBE\u5F3A\u5927\u7684\u793E\u533A\u3002",
      ar: "\u0639\u0645\u0644 \u0633\u064A\u0627\u0633\u064A \u062C\u0645\u0627\u0639\u064A \u0644\u0631\u0641\u0639 \u0627\u0644\u0623\u062C\u0648\u0631\u060C \u0648\u062D\u0645\u0627\u064A\u0629 \u0627\u0644\u0645\u0632\u0627\u064A\u0627\u060C \u0648\u062A\u0645\u0648\u064A\u0644 \u0627\u0644\u062E\u062F\u0645\u0627\u062A \u0627\u0644\u0639\u0627\u0645\u0629\u060C \u0648\u0628\u0646\u0627\u0621 \u0645\u062C\u062A\u0645\u0639\u0627\u062A \u0642\u0648\u064A\u0629.",
      so: `Ficil siyaasadeed oo wadajir ah si loo kordhiyo mushaharka, loo ilaaliyo dheefaha, loo maalgeliyo adeegyada dadweynaha, loona dhiso bulshooyin xooggan.`
    },
    capeBody1_2022: {
      selector: '[data-cape-copy="capeBody1_2022"]',
      mode: "html",
      en: `When workers unite, legislators listen. In 2021, SEIU 503 members\u2019 advocacy at the Oregon Legislature resulted in impactful wins for our state during the pandemic and set up some of the best contracts for our members despite the economic downturn. That wouldn\u2019t have happened without CAPE helping elect candidates who our members believed shared our values.`,
      es: `Cuando los (las) trabajadores(as) se unen, los (las) legisladores(as) prestan atenci\xF3n. En el 2021, la defensa de los (las) miembros de SEIU\xA0503 ante la legislatura de Oreg\xF3n dio como resultado importantes victorias para nuestro estado durante la pandemia y logr\xF3 algunos de los mejores contratos para nuestros(as) miembros a pesar de la recesi\xF3n econ\xF3mica. Esto no hubiera sucedido sin la ayuda de la Acci\xF3n Ciudadana en Favor de la Educaci\xF3n Pol\xEDtica (por su sigla en ingl\xE9s CAPE) para elegir a los (las) candidatos(as) que nuestros(as) miembros cre\xEDan que compart\xEDan nuestros valores.`,
      ru: `\u041A\u043E\u0433\u0434\u0430 \u0440\u0430\u0431\u043E\u0442\u043D\u0438\u043A\u0438 \u043E\u0431\u044A\u0435\u0434\u0438\u043D\u044F\u044E\u0442\u0441\u044F, \u043A \u043D\u0438\u043C \u043F\u0440\u0438\u0441\u043B\u0443\u0448\u0438\u0432\u0430\u044E\u0442\u0441\u044F \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0442\u0435\u043B\u0438. \u0412 2021\xA0\u0433\u043E\u0434\u0443 \u0437\u0430\u0449\u0438\u0442\u0430 \u0438\u043D\u0442\u0435\u0440\u0435\u0441\u043E\u0432 \u0447\u043B\u0435\u043D\u043E\u0432 SEIU 503 \u0432 \u0417\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0442\u0435\u043B\u044C\u043D\u043E\u043C \u0441\u043E\u0431\u0440\u0430\u043D\u0438\u0438 \u0448\u0442\u0430\u0442\u0430 \u041E\u0440\u0435\u0433\u043E\u043D \u043F\u043E\u0437\u0432\u043E\u043B\u0438\u043B\u0430 \u0434\u043E\u0431\u0438\u0442\u044C\u0441\u044F \u043E\u0447\u0435\u043D\u044C \u043C\u043D\u043E\u0433\u043E\u0433\u043E \u0434\u043B\u044F \u0436\u0438\u0442\u0435\u043B\u0435\u0439 \u043D\u0430\u0448\u0435\u0433\u043E \u0448\u0442\u0430\u0442\u0430 \u0432\u043E \u0432\u0440\u0435\u043C\u044F \u043F\u0430\u043D\u0434\u0435\u043C\u0438\u0438 \u0438 \u0437\u0430\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u043E\u0434\u0438\u043D \u0438\u0437 \u0441\u0430\u043C\u044B\u0445 \u0432\u044B\u0433\u043E\u0434\u043D\u044B\u0445 \u043A\u043E\u043D\u0442\u0440\u0430\u043A\u0442\u043E\u0432 \u0434\u043B\u044F \u0447\u043B\u0435\u043D\u043E\u0432 \u043D\u0430\u0448\u0435\u0433\u043E \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430, \u043D\u0435\u0441\u043C\u043E\u0442\u0440\u044F \u043D\u0430 \u044D\u043A\u043E\u043D\u043E\u043C\u0438\u0447\u0435\u0441\u043A\u0438\u0439 \u0441\u043F\u0430\u0434. \u042D\u0442\u043E\u0433\u043E \u0431\u044B \u043D\u0435 \u0441\u043B\u0443\u0447\u0438\u043B\u043E\u0441\u044C \u0431\u0435\u0437 \u043F\u043E\u043C\u043E\u0449\u0438 CAPE \u0432 \u0432\u044B\u0431\u043E\u0440\u0435 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u043E\u0432, \u043A\u043E\u0442\u043E\u0440\u044B\u0435, \u043A\u0430\u043A \u0441\u0447\u0438\u0442\u0430\u044E\u0442 \u0447\u043B\u0435\u043D\u044B \u043D\u0430\u0448\u0435\u0433\u043E \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430, \u0440\u0430\u0437\u0434\u0435\u043B\u044F\u044E\u0442 \u043D\u0430\u0448\u0438 \u0446\u0435\u043D\u043D\u043E\u0441\u0442\u0438.`,
      vi: `Khi ng\u01B0\u1EDDi lao \u0111\u1ED9ng \u0111o\xE0n k\u1EBFt th\xEC c\xE1c nh\xE0 l\xE0m lu\u1EADt s\u1EBD l\u1EAFng nghe. V\xE0o n\u0103m 2021,s\u1EF1 \u1EE7ng h\u1ED9 c\u1EE7a c\xE1c th\xE0nh vi\xEAn SEIU 503 trong Cu\u1ED9c H\u1ECDp L\u1EADp Ph\xE1p Oregon \u0111\xE3 \u0111em \u0111\u1EBFn th\u1EAFng l\u1EE3i c\xF3 t\xE1c \u0111\u1ED9ng m\u1EA1nh m\u1EBD \u0111\u1EBFn ti\u1EC3u bang c\u1EE7a ch\xFAng ta trong \u0111\u1EA1i d\u1ECBch v\xE0 thi\u1EBFt l\u1EADp m\u1ED9t s\u1ED1 h\u1EE3p \u0111\u1ED3ng c\xF3 l\u1EE3i nh\u1EA5t cho c\xE1c th\xE0nh vi\xEAn c\u1EE7a ch\xFAng ta b\u1EA5t ch\u1EA5p s\u1EF1 suy tho\xE1i v\u1EC1 kinh t\u1EBF. \u0110i\u1EC1u \u0111\xF3 s\u1EBD kh\xF4ng th\u1EC3 x\u1EA3y ra n\u1EBFu kh\xF4ng c\xF3 s\u1EF1 tr\u1EE3 gi\xFAp c\u1EE7a CAPE trong vi\u1EC7c b\u1EA7u ch\u1ECDn ra nh\u1EEFng \u1EE9ng vi\xEAn m\xE0 c\xE1c th\xE0nh vi\xEAn c\u1EE7a ch\xFAng ta tin l\xE0 s\u1EBD c\xF9ng chung gi\xE1 tr\u1ECB v\u1EDBi ch\xFAng ta.`,
      zh: `\u5F53\u5DE5\u4EBA\u4EEC\u56E2\u7ED3\u8D77\u6765\u65F6\uFF0C\u7ACB\u6CD5\u8005\u5C31\u4F1A\u542C\u89C1\u6211\u4EEC\u7684\u58F0\u97F3\u30022021 \u5E74\uFF0CSEIU 503 \u6210\u5458\u5728\u4FC4\u52D2\u5188\u5DDE\u7ACB\u6CD5\u673A\u6784\u7684\u5021\u5BFC\u5728\u75AB\u60C5\u671F\u95F4\u4E3A\u6211\u4EEC\u5DDE\u8D62\u5F97\u4E86\u6709\u5F71\u54CD\u529B\u7684\u80DC\u5229\uFF0C\u5E76\u5728\u7ECF\u6D4E\u4F4E\u8FF7\u7684\u60C5\u51B5\u4E0B\u4E3A\u6211\u4EEC\u7684\u6210\u5458\u8FBE\u6210\u4E86\u4E00\u4E9B\u6700\u597D\u7684\u5408\u540C\u3002\u5982\u679C\u4E0D\u662F CAPE \u5E2E\u52A9\u6211\u4EEC\u7684\u6210\u5458\u9009\u51FA\u4E0E\u6211\u4EEC\u6301\u6709\u76F8\u540C\u4EF7\u503C\u89C2\u7684\u5019\u9009\u4EBA\uFF0C\u8FD9\u4E00\u5207\u90FD\u4E0D\u4F1A\u53D1\u751F\u3002`,
      ar: `\u0639\u0646\u062F\u0645\u0627 \u064A\u062A\u062D\u062F \u0627\u0644\u0639\u0645\u0627\u0644\u060C \u064A\u0633\u062A\u0645\u0639 \u0627\u0644\u0645\u0634\u0631\u0651\u0639\u0648\u0646. \u0641\u064A \u0639\u0627\u0645 2021\u060C \u0623\u062F\u062A \u0645\u0646\u0627\u0635\u0631\u0629 \u0623\u0639\u0636\u0627\u0621 SEIU 503 \u0641\u064A \u0627\u0644\u0645\u062C\u0644\u0633 \u0627\u0644\u062A\u0634\u0631\u064A\u0639\u064A \u0641\u064A \u0623\u0648\u0631\u064A\u063A\u0648\u0646 \u0625\u0644\u0649 \u0645\u0643\u0627\u0633\u0628 \u0645\u0624\u062B\u0631\u0629 \u0644\u0648\u0644\u0627\u064A\u062A\u0646\u0627 \u062E\u0644\u0627\u0644 \u0627\u0644\u062C\u0627\u0626\u062D\u0629\u060C \u0648\u0645\u0647\u062F\u062A \u0627\u0644\u0637\u0631\u064A\u0642 \u0644\u0628\u0639\u0636 \u0623\u0641\u0636\u0644 \u0627\u0644\u0639\u0642\u0648\u062F \u0644\u0623\u0639\u0636\u0627\u0626\u0646\u0627 \u0631\u063A\u0645 \u0627\u0644\u062A\u0631\u0627\u062C\u0639 \u0627\u0644\u0627\u0642\u062A\u0635\u0627\u062F\u064A. \u0645\u0627 \u0643\u0627\u0646 \u0630\u0644\u0643 \u0644\u064A\u062D\u062F\u062B \u0644\u0648\u0644\u0627 \u0645\u0633\u0627\u0639\u062F\u0629 CAPE \u0641\u064A \u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u0631\u0634\u062D\u064A\u0646 \u0631\u0623\u0649 \u0623\u0639\u0636\u0627\u0624\u0646\u0627 \u0623\u0646\u0647\u0645 \u064A\u0634\u0627\u0631\u0643\u0648\u0646\u0646\u0627 \u0642\u064A\u0645\u0646\u0627.`,
      so: `Marka shaqaaluhu midoobaan, sharci-dejiyayaashu way dhegaystaan. Sanadkii 2021, u doodista xubnaha SEIU 503 ee Golaha Sharci-dejinta Oregon waxay keentay guulo waaweyn intii lagu jiray aafadii, waxayna u gogol xaartay qaar ka mid ah heshiisyadii ugu fiicnaa ee xubnaheena inkasta oo dhaqaaluhu hoos u dhacay. Taasi ma dhici lahayn haddii CAPE aysan gacan ka geysan doorashada murashaxiin xubnaheennu aaminsanaayeen inay nala wadaagaan qiimayaasheenna.`
    },
    capeBullet1_2022: {
      selector: '[data-cape-copy="capeBullet1_2022"]',
      mode: "html",
      en: `We won a bargaining pot for homecare workers that was 50% higher than 2 years ago and resulted in a contract that included hazard pay and pay increases.`,
      es: `Conseguimos un fondo de negociaci\xF3n para los (las) trabajadores(as) de atenci\xF3n domiciliaria que super\xF3 en un 50\xA0% al de hace 2 a\xF1os y que dio como resultado un contrato que inclu\xEDa el pago adicional por trabajar en condiciones peligrosas y aumentos salariales.`,
      ru: `\u0411\u043B\u0430\u0433\u043E\u0434\u0430\u0440\u044F \u043D\u0430\u0448\u0438\u043C \u0443\u0441\u0438\u043B\u0438\u044F\u043C \u0444\u043E\u043D\u0434 \u043E\u043F\u043B\u0430\u0442\u044B \u0442\u0440\u0443\u0434\u0430 \u0434\u043B\u044F \u0440\u0430\u0431\u043E\u0442\u043D\u0438\u043A\u043E\u0432 \u043F\u043E \u0443\u0445\u043E\u0434\u0443 \u043D\u0430 \u0434\u043E\u043C\u0443 \u0443\u0432\u0435\u043B\u0438\u0447\u0438\u043B\u0441\u044F \u043D\u0430 50% \u0432 \u0441\u0440\u0430\u0432\u043D\u0435\u043D\u0438\u0438 \u0441 \u0442\u0435\u043C, \u0447\u0442\u043E \u0431\u044B\u043B\u043E \u0434\u0432\u0430 \u0433\u043E\u0434\u0430 \u043D\u0430\u0437\u0430\u0434, \u0438 \u044D\u0442\u043E \u043F\u043E\u0437\u0432\u043E\u043B\u0438\u043B\u043E \u043D\u0430\u043C \u0437\u0430\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u043A\u043E\u043D\u0442\u0440\u0430\u043A\u0442, \u043F\u0440\u0435\u0434\u0443\u0441\u043C\u0430\u0442\u0440\u0438\u0432\u0430\u044E\u0449\u0438\u0439 \u043D\u0430\u0434\u0431\u0430\u0432\u043A\u0438 \u0437\u0430 \u0440\u0430\u0431\u043E\u0442\u0443 \u0432 \u043E\u043F\u0430\u0441\u043D\u044B\u0445 \u0443\u0441\u043B\u043E\u0432\u0438\u044F\u0445 \u0438 \u043F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u0435 \u0437\u0430\u0440\u0430\u0431\u043E\u0442\u043D\u043E\u0439 \u043F\u043B\u0430\u0442\u044B.`,
      vi: `Ch\xFAng ta \u0111\xE3 gi\xE0nh \u0111\u01B0\u1EE3c m\u1EE9c th\u01B0\u01A1ng l\u01B0\u1EE3ng cho nh\xE2n vi\xEAn ch\u0103m s\xF3c t\u1EA1i nh\xE0 cao h\u01A1n 50% so v\u1EDBi 2 n\u0103m tr\u01B0\u1EDBc v\xE0 \u0111\u1EA1t \u0111\u01B0\u1EE3c m\u1ED9t h\u1EE3p \u0111\u1ED3ng trong \u0111\xF3 c\xF3 \u0111i\u1EC1u kho\u1EA3n thanh to\xE1n ph\u1EE5 c\u1EA5p \u0111\u1ED9c h\u1EA1i v\xE0 t\u0103ng l\u01B0\u01A1ng.`,
      zh: "\u6211\u4EEC\u901A\u8FC7\u8C08\u5224\uFF0C\u4E3A\u5BB6\u5EAD\u62A4\u7406\u5DE5\u4F5C\u8005\u8D62\u5F97\u4E86\u6BD4\u4E24\u5E74\u524D\u9AD8\u51FA 50% \u7684\u85AA\u8D44\uFF0C\u5E76\u8FBE\u6210\u4E86\u4E00\u4EFD\u5305\u542B\u5371\u9669\u6D25\u8D34\u548C\u6DA8\u85AA\u7684\u5408\u540C\u3002",
      ar: `\u062D\u0642\u0642\u0646\u0627 \u0648\u0639\u0627\u0621 \u062A\u0641\u0627\u0648\u0636 \u0644\u0639\u0645\u0627\u0644 \u0627\u0644\u0631\u0639\u0627\u064A\u0629 \u0627\u0644\u0645\u0646\u0632\u0644\u064A\u0629 \u0623\u0639\u0644\u0649 \u0628\u0646\u0633\u0628\u0629 50% \u0645\u0645\u0627 \u0643\u0627\u0646 \u0639\u0644\u064A\u0647 \u0642\u0628\u0644 \u0639\u0627\u0645\u064A\u0646\u060C \u0648\u0646\u062A\u062C \u0639\u0646\u0647 \u0639\u0642\u062F \u0634\u0645\u0644 \u0628\u062F\u0644 \u0645\u062E\u0627\u0637\u0631 \u0648\u0632\u064A\u0627\u062F\u0627\u062A \u0641\u064A \u0627\u0644\u0623\u062C\u0648\u0631.`,
      so: `Waxaan u helnay shaqaalaha daryeelka guriga miisaaniyad gorgortan oo 50% ka sarreysay tii laba sano ka hor, taasoo keentay heshiis ay ku jiraan lacagta khatarta shaqada iyo mushahar kordhin.`
    },
    capeBullet2_2022: {
      selector: '[data-cape-copy="capeBullet2_2022"]',
      mode: "html",
      en: `We helped win budgets at current levels or higher for nearly all state agencies and $190 million was allocated for salary pots, resulting in hazard pay and good contracts.`,
      es: `Ayudamos a conseguir presupuestos a los niveles actuales o superiores para casi todas las agencias estatales y se asignaron $190\xA0millones para fondos salariales, lo que dio como resultado pagos adicionales por trabajar en condiciones peligrosas y buenos contratos.`,
      ru: `\u041C\u044B \u043F\u043E\u043C\u043E\u0433\u043B\u0438 \u0443\u0441\u0442\u0430\u043D\u043E\u0432\u0438\u0442\u044C \u0431\u044E\u0434\u0436\u0435\u0442\u044B \u0442\u0430\u043A\u043E\u0433\u043E \u0436\u0435 \u0440\u0430\u0437\u043C\u0435\u0440\u0430 \u0438\u043B\u0438 \u0432\u044B\u0448\u0435 \u043F\u043E\u0447\u0442\u0438 \u0434\u043B\u044F \u0432\u0441\u0435\u0445 \u0433\u043E\u0441\u0443\u0434\u0430\u0440\u0441\u0442\u0432\u0435\u043D\u043D\u044B\u0445 \u0430\u0433\u0435\u043D\u0442\u0441\u0442\u0432 \u0438 \u0432\u044B\u0434\u0435\u043B\u0438\u0442\u044C 190\xA0\u043C\u043B\u043D \u0434\u043E\u043B\u043B\u0430\u0440\u043E\u0432 \u043D\u0430 \xAB\u0437\u0430\u0440\u043F\u043B\u0430\u0442\u043D\u044B\u0439 \u0431\u0430\u043D\u043A\xBB, \u0447\u0442\u043E \u043F\u0440\u0438\u0432\u0435\u043B\u043E \u043A \u0432\u0432\u0435\u0434\u0435\u043D\u0438\u044E \u043D\u0430\u0434\u0431\u0430\u0432\u043E\u043A \u0437\u0430 \u0440\u0430\u0431\u043E\u0442\u0443 \u0432 \u043E\u043F\u0430\u0441\u043D\u044B\u0445 \u0443\u0441\u043B\u043E\u0432\u0438\u044F\u0445 \u0438 \u043A \u0443\u043B\u0443\u0447\u0448\u0435\u043D\u0438\u044E \u0443\u0441\u043B\u043E\u0432\u0438\u0439 \u043A\u043E\u043D\u0442\u0440\u0430\u043A\u0442\u043E\u0432.`,
      vi: `Ch\xFAng ta \u0111\xE3 gi\xFAp gi\xE0nh \u0111\u01B0\u1EE3c ng\xE2n s\xE1ch \u1EDF m\u1EE9c hi\u1EC7n t\u1EA1i ho\u1EB7c cao h\u01A1n cho h\u1EA7u h\u1EBFt m\u1ECDi c\u01A1 quan t\u1EA1i ti\u1EC3u bang c\u0169ng nh\u01B0 190 tri\u1EC7u \u0111\xF4 la \u0111\u01B0\u1EE3c ph\xE2n b\u1ED5 cho m\u1EE9c l\u01B0\u01A1ng. \u0110i\u1EC1u n\xE0y \u0111\xE3 mang \u0111\u1EBFn m\u1ED9t h\u1EE3p \u0111\u1ED3ng thanh to\xE1n ph\u1EE5 c\u1EA5p \u0111\u1ED9c h\u1EA1i v\xE0 c\xF3 l\u1EE3i.`,
      zh: "\u6211\u4EEC\u51E0\u4E4E\u5E2E\u52A9\u5168\u5DDE\u7684\u673A\u6784\u8D62\u5F97\u4E86\u5F53\u524D\u6C34\u5E73\u6216\u66F4\u9AD8\u7684\u9884\u7B97\uFF0C\u5E76\u4E3A\u85AA\u8D44\u5206\u914D\u4E86 1.9 \u4EBF\u7F8E\u5143\uFF0C\u56E0\u6B64\u624D\u6709\u4E86\u5371\u9669\u6D25\u8D34\u548C\u826F\u597D\u7684\u5408\u540C\u3002",
      ar: `\u0633\u0627\u0639\u062F\u0646\u0627 \u0641\u064A \u0627\u0644\u0641\u0648\u0632 \u0628\u0645\u064A\u0632\u0627\u0646\u064A\u0627\u062A \u0639\u0646\u062F \u0627\u0644\u0645\u0633\u062A\u0648\u064A\u0627\u062A \u0627\u0644\u062D\u0627\u0644\u064A\u0629 \u0623\u0648 \u0623\u0639\u0644\u0649 \u0645\u0646\u0647\u0627 \u0644\u0645\u0639\u0638\u0645 \u0648\u0643\u0627\u0644\u0627\u062A \u0627\u0644\u0648\u0644\u0627\u064A\u0629 \u062A\u0642\u0631\u064A\u0628\u064B\u0627\u060C \u0648\u062A\u0645 \u062A\u062E\u0635\u064A\u0635 190 \u0645\u0644\u064A\u0648\u0646 \u062F\u0648\u0644\u0627\u0631 \u0644\u0623\u0648\u0639\u064A\u0629 \u0627\u0644\u0631\u0648\u0627\u062A\u0628\u060C \u0645\u0645\u0627 \u0623\u062F\u0649 \u0625\u0644\u0649 \u0628\u062F\u0644 \u0645\u062E\u0627\u0637\u0631 \u0648\u0639\u0642\u0648\u062F \u062C\u064A\u062F\u0629.`,
      so: `Waxaan ka caawinnay ku guuleysiga miisaaniyado heerarkii hadda jira ama ka sarreeya ku dhowaad dhammaan hay\u2019adaha gobolka, waxaana $190 milyan loo qoondeeyay miisaaniyadda mushaharka, taasoo keentay lacagta khatarta shaqada iyo heshiisyo wanaagsan.`
    },
    capeBullet3_2022: {
      selector: '[data-cape-copy="capeBullet3_2022"]',
      mode: "html",
      en: `We worked to secure a record $900 million for higher education, which set us up for a historic contract for our members that included hazard pay and step/COLA increases.`,
      es: `Trabajamos para conseguir un registro de $900\xA0millones destinados a la educaci\xF3n superior, lo que nos permiti\xF3 lograr un contrato hist\xF3rico para nuestros(as) miembros que inclu\xEDa el pago adicional por trabajar en condiciones peligrosas y los aumentos del costo de vida (por su sigla en ingl\xE9s COLA).`,
      ru: `\u041C\u044B \u0440\u0430\u0431\u043E\u0442\u0430\u043B\u0438 \u043D\u0430\u0434 \u0442\u0435\u043C, \u0447\u0442\u043E\u0431\u044B \u0432 \u0441\u0444\u0435\u0440\u0443 \u0432\u044B\u0441\u0448\u0435\u0433\u043E \u043E\u0431\u0440\u0430\u0437\u043E\u0432\u0430\u043D\u0438\u044F \u0431\u044B\u043B\u0438 \u043D\u0430\u043F\u0440\u0430\u0432\u043B\u0435\u043D\u044B \u0440\u0435\u043A\u043E\u0440\u0434\u043D\u044B\u0435 900\xA0\u043C\u043B\u043D \u0434\u043E\u043B\u043B\u0430\u0440\u043E\u0432, \u0438 \u044D\u0442\u043E \u043F\u043E\u0437\u0432\u043E\u043B\u0438\u043B\u043E \u043D\u0430\u043C \u0437\u0430\u043A\u043B\u044E\u0447\u0438\u0442\u044C \u0438\u0441\u0442\u043E\u0440\u0438\u0447\u0435\u0441\u043A\u0438 \u0437\u043D\u0430\u0447\u0438\u043C\u044B\u0439 \u043A\u043E\u043D\u0442\u0440\u0430\u043A\u0442 \u0434\u043B\u044F \u0447\u043B\u0435\u043D\u043E\u0432 \u043D\u0430\u0448\u0435\u0433\u043E \u043F\u0440\u043E\u0444\u0441\u043E\u044E\u0437\u0430, \u043F\u0440\u0435\u0434\u0443\u0441\u043C\u0430\u0442\u0440\u0438\u0432\u0430\u044E\u0449\u0438\u0439 \u043D\u0430\u0434\u0431\u0430\u0432\u043A\u0438 \u0437\u0430 \u0440\u0430\u0431\u043E\u0442\u0443 \u0432 \u043E\u043F\u0430\u0441\u043D\u044B\u0445 \u0443\u0441\u043B\u043E\u0432\u0438\u044F\u0445, \u043F\u043E\u044D\u0442\u0430\u043F\u043D\u043E\u0435 \u043F\u043E\u0432\u044B\u0448\u0435\u043D\u0438\u0435 \u0438 \u0443\u0432\u0435\u043B\u0438\u0447\u0435\u043D\u0438\u0435 \u043F\u0440\u0438\u0431\u0430\u0432\u043A\u0438 \u043D\u0430 \u0440\u043E\u0441\u0442 \u0441\u0442\u043E\u0438\u043C\u043E\u0441\u0442\u0438 \u0436\u0438\u0437\u043D\u0438 (COLA).`,
      vi: `Ch\xFAng ta \u0111\xE3 n\u1ED7 l\u1EF1c \u0111\u1EC3 b\u1EA3o v\u1EC7 cho kho\u1EA3n ng\xE2n s\xE1ch k\u1EF7 l\u1EE5c l\xE0 900 tri\u1EC7u \u0111\xF4 la d\xE0nh cho gi\xE1o d\u1EE5c \u0111\u1EA1i h\u1ECDc, qua \u0111\xF3 thi\u1EBFt l\u1EADp m\u1ED9t h\u1EE3p \u0111\u1ED3ng mang t\xEDnh l\u1ECBch s\u1EED cho c\xE1c th\xE0nh vi\xEAn c\u1EE7a ch\xFAng ta. H\u1EE3p \u0111\u1ED3ng n\xE0y cam k\u1EBFt thanh to\xE1n ph\u1EE5 c\u1EA5p \u0111\u1ED9c h\u1EA1i v\xE0 t\u0103ng l\u01B0\u01A1ng theo c\u1EA5p b\u1EADc/chi ph\xED sinh ho\u1EA1t.`,
      zh: "\u6211\u4EEC\u52AA\u529B\u4E3A\u9AD8\u7B49\u6559\u80B2\u884C\u4E1A\u4E89\u53D6\u5230\u4E86\u521B\u7EAA\u5F55\u7684 9 \u4EBF\u7F8E\u5143\uFF0C\u8FD9\u4E3A\u6211\u4EEC\u7684\u6210\u5458\u63D0\u4F9B\u4E86\u4E00\u4EFD\u5386\u53F2\u6027\u7684\u5408\u540C\uFF0C\u5176\u4E2D\u5305\u62EC\u5371\u9669\u6D25\u8D34\u548C\u9636\u68AF\u5F0F\u6DA8\u85AA/\u751F\u6D3B\u8D39\u7528\u8C03\u6574\uFF08\u82F1\u6587\u7F29\u5199\u4E3A COLA\uFF09\u7684\u589E\u957F\u3002",
      ar: `\u0639\u0645\u0644\u0646\u0627 \u0639\u0644\u0649 \u062A\u0623\u0645\u064A\u0646 \u0645\u0628\u0644\u063A \u0642\u064A\u0627\u0633\u064A \u0642\u062F\u0631\u0647 900 \u0645\u0644\u064A\u0648\u0646 \u062F\u0648\u0644\u0627\u0631 \u0644\u0644\u062A\u0639\u0644\u064A\u0645 \u0627\u0644\u0639\u0627\u0644\u064A\u060C \u0645\u0645\u0627 \u0645\u0647\u062F \u0644\u0639\u0642\u062F \u062A\u0627\u0631\u064A\u062E\u064A \u0644\u0623\u0639\u0636\u0627\u0626\u0646\u0627 \u0634\u0645\u0644 \u0628\u062F\u0644 \u0645\u062E\u0627\u0637\u0631 \u0648\u0632\u064A\u0627\u062F\u0627\u062A \u0641\u064A \u0627\u0644\u062F\u0631\u062C\u0627\u062A/\u062A\u0643\u0644\u0641\u0629 \u0627\u0644\u0645\u0639\u064A\u0634\u0629.`,
      so: `Waxaan ka shaqaynay xaqiijinta $900 milyan oo taariikhi ah oo loogu talagalay tacliinta sare, taasoo noo diyaarisay heshiis taariikhi ah oo xubnaheena u keena lacagta khatarta shaqada iyo kordhinta heerarka/COLA.`
    },

    capePullQuote: {
      selector: '[data-cape-copy="capePullQuote"]',
      mode: "html",
      en: `I can\u2019t write big checks. But I contribute what I can each month to CAPE. And when we put all of our resources together, we have shown we can elect legislators in Oregon who will fight for working families and our clients.`,
      es: `No puedo ofrecer grandes sumas, pero mensualmente aporto lo que puedo al CAPE. Si juntamos todos nuestros recursos, demostraremos que podemos elegir legisladores en Oreg\xF3n que luchar\xE1n por las familias trabajadoras y nuestros clientes.`,
      ru: `\u042F \u043D\u0435 \u043C\u043E\u0433\u0443 \u0432\u044B\u043F\u0438\u0441\u044B\u0432\u0430\u0442\u044C \u0447\u0435\u043A\u0438 \u043D\u0430 \u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u0441\u0443\u043C\u043C\u044B. \u041D\u043E \u0432\u043D\u043E\u0448\u0443 \u0432\u0437\u043D\u043E\u0441\u044B \u0432 CAPE \u043A\u0430\u0436\u0434\u044B\u0439 \u043C\u0435\u0441\u044F\u0446 \u0432 \u0442\u043E\u043C \u043E\u0431\u044A\u0435\u043C\u0435, \u043A\u043E\u0442\u043E\u0440\u044B\u0439 \u043C\u043E\u0433\u0443 \u043F\u0440\u0435\u0434\u043E\u0441\u0442\u0430\u0432\u0438\u0442\u044C. \u041A\u043E\u0433\u0434\u0430 \u043C\u044B \u043E\u0431\u044A\u0435\u0434\u0438\u043D\u044F\u0435\u043C \u0432\u0441\u0435 \u0441\u0432\u043E\u0438 \u0440\u0435\u0441\u0443\u0440\u0441\u044B, \u043A\u0430\u043A \u043C\u044B \u0443\u0436\u0435 \u0434\u043E\u043A\u0430\u0437\u0430\u043B\u0438, \u043C\u044B \u043C\u043E\u0436\u0435\u043C \u0438\u0437\u0431\u0438\u0440\u0430\u0442\u044C \u0441\u0432\u043E\u0438\u0445 \u043A\u0430\u043D\u0434\u0438\u0434\u0430\u0442\u043E\u0432 \u0432 \u0437\u0430\u043A\u043E\u043D\u043E\u0434\u0430\u0442\u0435\u043B\u044C\u043D\u044B\u0435 \u043E\u0440\u0433\u0430\u043D\u044B \u0448\u0442\u0430\u0442\u0430 \u041E\u0440\u0435\u0433\u043E\u043D, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0431\u0443\u0434\u0443\u0442 \u0440\u0430\u0431\u043E\u0442\u0430\u0442\u044C \u043D\u0430 \u0431\u043B\u0430\u0433\u043E \u0440\u0430\u0431\u043E\u0447\u0438\u0445 \u0441\u0435\u043C\u0435\u0439 \u0438 \u043D\u0430\u0448\u0438\u0445 \u043A\u043B\u0438\u0435\u043D\u0442\u043E\u0432.`,
      vi: `T\xF4i kh\xF4ng th\u1EC3 \u0111\xF3ng g\xF3p nhi\u1EC1u v\u1EC1 m\u1EB7t t\xE0i ch\xEDnh. Tuy nhi\xEAn, t\xF4i s\u1EBD \u0111\xF3ng g\xF3p cho CAPE theo s\u1EE9c m\xECnh m\u1ED7i th\xE1ng. V\xE0 khi t\u1EADp h\u1EE3p m\u1ECDi ngu\u1ED3n l\u1EF1c v\u1EDBi nhau, ch\xFAng ta cho th\u1EA5y r\u1EB1ng ch\xFAng ta c\xF3 th\u1EC3 b\u1EA7u c\xE1c nh\xE0 l\xE0m lu\u1EADt \u1EDF Oregon. H\u1ECD s\u1EBD \u0111\u1EA5u tranh cho c\xE1c gia \u0111\xECnh lao \u0111\u1ED9ng v\xE0 kh\xE1ch h\xE0ng c\u1EE7a ch\xFAng ta.`,
      zh: "\u6211\u6CA1\u6709\u80FD\u529B\u5F00\u5927\u989D\u652F\u7968\u3002\u4F46\u6BCF\u4E2A\u6708\u6211\u90FD\u5C3D\u81EA\u5DF1\u6240\u80FD\u4E3A CAPE \u6350\u6B3E\u3002\u6211\u4EEC\u5DF2\u7ECF\u5411\u5927\u5BB6\u8BC1\u660E\uFF0C\u5F53\u6574\u5408\u6240\u6709\u8D44\u6E90\u540E\uFF0C\u6211\u4EEC\u5C31\u53EF\u4EE5\u5728\u4FC4\u52D2\u5188\u5DDE\u9009\u51FA\u5C06\u4E3A\u5DE5\u85AA\u5BB6\u5EAD\u548C\u6211\u4EEC\u7684\u5BA2\u6237\u800C\u594B\u6597\u7684\u7ACB\u6CD5\u8005\u3002",
      ar: `\u0644\u0627 \u0623\u0633\u062A\u0637\u064A\u0639 \u0643\u062A\u0627\u0628\u0629 \u0634\u064A\u0643\u0627\u062A \u0643\u0628\u064A\u0631\u0629. \u0644\u0643\u0646\u0646\u064A \u0623\u0633\u0627\u0647\u0645 \u0628\u0645\u0627 \u0623\u0633\u062A\u0637\u064A\u0639 \u0643\u0644 \u0634\u0647\u0631 \u0641\u064A CAPE. \u0648\u0639\u0646\u062F\u0645\u0627 \u0646\u062C\u0645\u0639 \u0645\u0648\u0627\u0631\u062F\u0646\u0627 \u0643\u0644\u0647\u0627\u060C \u0623\u062B\u0628\u062A\u0646\u0627 \u0623\u0646\u0646\u0627 \u0646\u0633\u062A\u0637\u064A\u0639 \u0627\u0646\u062A\u062E\u0627\u0628 \u0645\u0634\u0631\u0651\u0639\u064A\u0646 \u0641\u064A \u0623\u0648\u0631\u064A\u063A\u0648\u0646 \u064A\u062F\u0627\u0641\u0639\u0648\u0646 \u0639\u0646 \u0627\u0644\u0639\u0627\u0626\u0644\u0627\u062A \u0627\u0644\u0639\u0627\u0645\u0644\u0629 \u0648\u0639\u0645\u0644\u0627\u0626\u0646\u0627.`,
      so: `Ma qori karo jeegag waaweyn. Laakiin bil kasta waxaan CAPE ku daraa inta aan awoodo. Marka aan dhammaan khayraadkeenna isu geyno, waxaan muujinnay inaan Oregon ka dooran karno sharci-dejiyayaal u dagaallami doona qoysaska shaqeeya iyo macaamiisheena.`
    },
